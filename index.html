/* Concept : un tableau de bord de club lu comme l'écran d'une arène sous-marine.
   Cinq sections (UI-12a) : Accueil, Club, Effectif, Jouer, Options ; barre du bas sur mobile.
   Eau verre de mer le jour, abysses la nuit, ballon ambré comme seul point chaud. */
:root{
  --bg:#E4EFEE; --surface:#F5FAF9; --surface2:#D6E6E4; --ink:#0A2830; --muted:#476770; --line:#B5CFCC;
  --water:#0B7480; --water-soft:rgba(11,116,128,.12); --on-water:#FFFFFF;
  --ball:#E0910F; --ball-ink:#1B1100; --on-bad:#FFFFFF; --on-good:#FFFFFF; --on-warn:#FFFFFF; --warn-fill:#946300;
  --good:#1C8450; --warn:#A8710A; --bad:#C0412C;
  --p-gk:#8A5F00; --p-df:#1F5FA8; --p-mf:#0B7480; --p-fw:#B03A2A;
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06151C; --surface:#0C2330; --surface2:#123241; --ink:#E3F2F1; --muted:#8DB0B5; --line:#1E4150;
    --water:#3CC4CF; --water-soft:rgba(60,196,207,.14); --on-water:#04222A;
    --ball:#F2B544; --ball-ink:#1B1100; --on-bad:#1B0500; --on-good:#04170D; --on-warn:#1B1100; --warn-fill:#E3A33A;
    --good:#4FD08B; --warn:#E3A33A; --bad:#FF7A63;
    --p-gk:#F2B544; --p-df:#6FA8F0; --p-mf:#3CC4CF; --p-fw:#FF8A72;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06151C; --surface:#0C2330; --surface2:#123241; --ink:#E3F2F1; --muted:#8DB0B5; --line:#1E4150;
  --water:#3CC4CF; --water-soft:rgba(60,196,207,.14); --on-water:#04222A;
  --ball:#F2B544; --ball-ink:#1B1100; --on-bad:#1B0500; --on-good:#04170D; --on-warn:#1B1100; --warn-fill:#E3A33A;
  --good:#4FD08B; --warn:#E3A33A; --bad:#FF7A63;
  --p-gk:#F2B544; --p-df:#6FA8F0; --p-mf:#3CC4CF; --p-fw:#FF8A72;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1180px;margin-inline:auto}
button,select,input{font-family:inherit}
h1,h2,h3,p{margin:0}
h2{font:600 17px/1.25 var(--font-display);letter-spacing:.01em;text-wrap:balance}
h3{font:700 12px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.topin{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding-block:10px 8px}
.brand{display:flex;align-items:center;gap:8px;font:800 14px var(--font-display);letter-spacing:.06em}
.brand .b2{color:var(--water)}
.brand svg{width:26px;height:26px;flex:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font:500 12px var(--font-mono);color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);font:600 12px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn.danger{color:var(--bad)}
.sects{display:flex;gap:6px}
.sect{font:700 12px var(--font-display);letter-spacing:.12em;text-transform:uppercase;padding:9px 20px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--surface);color:var(--muted);cursor:pointer}
.sect[aria-current="true"]{background:var(--water);border-color:var(--water);color:var(--on-water)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:0 8px 0 0;padding-inline:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);font:600 13px var(--font-body);white-space:nowrap;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ball)}
.tab:hover{color:var(--ink)}
.tab:focus-visible,.sect:focus-visible,.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible,.club:focus-visible,.sw:focus-visible,.emb-btn:focus-visible,tr[data-a]:focus-visible{outline:2px solid var(--water);outline-offset:2px}

.main{padding-top:20px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h2+*,.panel>h3+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.grid2>*{min-width:0}
.stack{display:grid;gap:16px;align-content:start}
.stack.tight{gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}

/* Boutons et champs */
.btn{font:600 14px var(--font-body);padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--water)}
.btn.primary{background:var(--ball);color:var(--ball-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 10px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--font-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--on-water)}
.chip[disabled]{background:transparent;border-style:dashed;color:var(--muted);cursor:not-allowed}   /* TAC-10 : formation verrouillée */
.mst{display:flex;align-items:center;gap:8px;font-size:12px}.mst .bar{flex:1}.mst .ms{font-size:12px;letter-spacing:0}   /* TAC-11 */
/* TAC-09 : forces de zone (4 lignes d'environ 18 px), repère gris de l'adversaire, lecture fort / faible */
.zb{display:grid;gap:3px;margin-top:8px}
.zr{display:grid;grid-template-columns:62px 22px minmax(0,1fr) 92px;gap:8px;align-items:center;font:600 12px/18px var(--font-body)}
.zr .zl{color:var(--muted)}.zr .mono{font-size:12px}
.zr .bar>u{background:var(--muted);margin-left:-1px;box-shadow:0 0 0 1.5px var(--surface)}
.zr .zs,.cmp .zs{white-space:nowrap}.zr .zs [aria-hidden]{display:inline-block;width:12px;text-align:center}
.zr.z2 .zs,.cmp.z2 .zs{color:var(--good);color:color-mix(in srgb,var(--good) 78%,var(--ink))}.zr.z0 .zs,.cmp.z0 .zs{color:var(--bad);color:color-mix(in srgb,var(--bad) 82%,var(--ink))}.zr.z1 .zs,.cmp.z1 .zs{color:var(--muted)}
.zt{margin:6px 0 0;font-size:12.5px;line-height:18px}
.zleg u{display:inline-block;width:2px;height:10px;margin-right:6px;background:var(--muted);vertical-align:-1px}
/* UI-12c : Tactique sur une page (mobile : formation / style / pressing, Sphère, six, remplaçants ; ≥ 980 px : Sphère à gauche) */
.tacg{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"ctl" "sph" "six" "ben"}
.tacg>*{min-width:0}.tacctl{grid-area:ctl}.tacsph{grid-area:sph}.tacsix{grid-area:six}.tacben{grid-area:ben}
.tacctl.stack{gap:12px}.tacsph .row{margin-bottom:6px}
.tacsph .pl[id^="p-h-"]{cursor:pointer}
@media (min-width:980px){.tacg{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"sph ctl" "sph six" "sph ben";grid-template-rows:auto auto 1fr}.tacsph{align-self:start}}
select,input[type="text"]{font:500 14px var(--font-body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%;min-width:0}
input[type="text"]{width:100%}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.hint{font-size:13px;color:var(--muted)}
.alert{padding:10px 12px;border-radius:8px;background:var(--water-soft);border:1px solid var(--water);font-size:13.5px}
.alert.warn{border-color:var(--warn)}
.alert button{margin-left:8px}

/* Badges, positions */
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:52px;height:26px;padding-inline:7px;border-radius:6px;background:var(--c,var(--water));color:#fff;font:700 12px var(--font-mono);letter-spacing:.05em;white-space:nowrap}
.badge svg{width:15px;height:15px;flex:none}
.badge.big{flex-direction:column;gap:2px;min-width:64px;height:60px;border-radius:10px;font-size:12px}
.badge.big svg{width:28px;height:28px}
.pos{display:inline-block;font:600 12px var(--font-mono);padding:1px 6px;border-radius:4px;border:1px solid currentColor;min-width:30px;text-align:center}
.pos-GK{color:var(--p-gk)}.pos-DF{color:var(--p-df)}.pos-MF{color:var(--p-mf)}.pos-FW{color:var(--p-fw)}
.form{display:inline-flex;gap:3px}
.form i{font:700 12px var(--font-mono);font-style:normal;width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:#fff}
.form .w{background:var(--good)}.form .l{background:var(--bad)}.form .n{background:var(--surface2);color:var(--muted)}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:700 12px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
th button:hover{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr[data-a]{cursor:pointer}
tr[data-a]:hover{background:var(--water-soft)}
tr.sel{background:var(--water-soft)}
tr.me{background:var(--water-soft);font-weight:700}
td.stat{background:color-mix(in srgb,var(--water) calc(var(--v) * 0.42%),transparent)}
.who{display:flex;align-items:center;gap:8px}
.tag{font:600 12px var(--font-body);padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.bad{background:var(--bad);color:var(--on-bad)}.tag.warn{background:var(--warn-fill);color:var(--on-warn)}.tag.good{background:var(--good);color:var(--on-good)}.tag.ball{background:var(--ball);color:var(--ball-ink)}
.hpcell{display:flex;align-items:center;gap:8px;min-width:96px}
.hpcell .bar{flex:1}

/* Barres */
.bar{position:relative;height:7px;border-radius:4px;background:var(--surface2);min-width:44px}
.bar>i{display:block;height:100%;border-radius:4px;width:var(--w);background:var(--c,var(--water))}
.bar>u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ball);text-decoration:none}
.sb{display:grid;grid-template-columns:30px 26px 1fr 26px;align-items:center;gap:8px;font:500 12px var(--font-mono)}
.sb span{color:var(--muted)}
.sb .btn{padding:0;width:24px;height:24px;line-height:1;font-size:15px;border-radius:6px}
.cmp{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;font:600 12px var(--font-mono)}
.cmp .lab{grid-column:1/-1;font:700 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.cmp .cb{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.cmp .cb i{display:block;height:100%}
.cmp .cb .a{background:var(--water)}.cmp .cb .b{background:var(--ball)}
.cmp b:last-child{text-align:right}

.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.vs .side{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0}
.vs .nm{font:600 14px var(--font-display);text-wrap:balance;overflow-wrap:anywhere;max-width:100%}   /* v0.6.7 : avec la vraie police Unbounded, un nom de club long sans espace débordait de la carte */
.vs .mid{font:700 12px var(--font-mono);color:var(--muted);letter-spacing:.1em;text-align:center}
.news{display:grid}
.news div{padding:8px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:13.5px}
.news div:last-child{border-bottom:0}
.news span{font:600 12px var(--font-mono);color:var(--muted);padding-top:2px}
details summary{cursor:pointer;font-weight:700;font-size:13px}
details>*:not(summary){margin-top:8px}
dl.gl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
dl.gl dt{font:700 12px var(--font-mono);color:var(--water)}
dl.gl dd{margin:0;color:var(--muted)}

/* Choix et personnalisation */
.hero{display:grid;gap:8px;max-width:640px}
.hero h1{font:800 clamp(26px,6vw,40px)/1.05 var(--font-display);letter-spacing:.01em;text-wrap:balance}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.club{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;cursor:pointer;color:var(--ink);font:inherit;justify-items:start}
.club:hover{border-color:var(--ball)}
.club .cn{font:600 14px var(--font-display);text-wrap:balance}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.embs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.emb-btn{background:var(--c);border-radius:10px;padding:10px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center}
.emb-btn svg{width:28px;height:28px}
.emb-btn[aria-pressed="true"]{border-color:var(--ink)}
.pnames{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.pnames label{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center}

/* Terrain : la Sphère (UI-11, v0.6.1) — cercle 1:1, 100 % de la largeur disponible, 460 px au plus */
.sphere{width:100%;max-width:460px;aspect-ratio:1/1;height:auto;display:block;margin-inline:auto;border:0;background:none;overflow:visible}
.sv-water{fill:var(--water-soft)}
.sv-line{fill:none;stroke:var(--line);stroke-width:2}
.sv-goal{fill:var(--ink);fill-opacity:.16;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;opacity:.6}   /* TAC-03 A : but triangulaire, base sur le bord de l'eau, pointe vers l'extérieur */
.bub{fill:none;stroke:var(--water);stroke-width:1.5;opacity:.4;animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-340px)}}
.pl{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.pl circle,.pl rect,.pl polygon{stroke:var(--surface);stroke-width:2}
.pl .pi{font:700 14px var(--font-mono);fill:#fff;text-anchor:middle;pointer-events:none}
.pl .pn{font:600 14px var(--font-body);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.pl .pn.ps{text-anchor:start}.pl .pn.pe{text-anchor:end}
#ballg{transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.sv-ball{fill:var(--ball);stroke:var(--ball-ink);stroke-width:1.5}
/* consigne de mi-temps : zone de la ligne active (hachures + glyphe, jamais la couleur seule) ; Souffler = halo sur les jetons */
.sv-zone{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.4}
.sv-zone.on{opacity:.95}
.sv-gl{font:800 15px var(--font-body);text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.pl circle.sv-halo{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3;opacity:.8}
@media (prefers-reduced-motion:reduce){.bub{animation:none}.pl,#ballg{transition:none}}
@media (max-width:520px){.panel>.sphere,.panel>.spv>.sphere{width:calc(100% + 32px);max-width:none;margin-inline:-16px}}   /* UI-29 : l'aperçu du Stade prend aussi toute la largeur du panneau (texte des jetons ≥ 12 px rendus) */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.scoreboard .tm{display:flex;align-items:center;gap:10px;min-width:0}
.scoreboard .tm.r{justify-content:flex-end;text-align:right}
.scoreboard .tn{font:600 13px var(--font-display);text-wrap:balance;min-width:0}
.score{font:800 clamp(30px,8vw,46px)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center}
.clock{text-align:center;font:600 12px var(--font-mono);color:var(--muted);margin-top:4px}
.prog{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ball);width:var(--w)}
.banner{padding:10px 12px;border-radius:8px;background:var(--water-soft);border:1px solid var(--water);font-size:13.5px;font-weight:600}
.feed{max-height:330px;overflow:auto;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:7px 0 7px 10px;border-bottom:1px dashed var(--line);border-left:3px solid var(--c,transparent);font-size:13.5px}
.ev time{font:500 12px var(--font-mono);color:var(--muted);padding-top:2px}
.ev.goal{font-weight:700;background:var(--water-soft)}
.ev.sys{color:var(--muted);font-style:italic}
.lu-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto 70px 44px 30px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.lu-row:last-child{border-bottom:0}
.lu-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center}
.slot select{width:100%}
.bench-row{display:grid;grid-template-columns:34px minmax(0,1fr) 44px 60px auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.frow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.frow:last-child{border-bottom:0}
.frow.tot{font-weight:700;border-top:1px solid var(--line);border-bottom:0;margin-top:4px;padding-top:8px}
.pos-v{color:var(--good-t)}.neg-v{color:var(--bad-t)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font:600 13px var(--font-body);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:var(--on-bad)}
@media (max-width:520px){
  .lu-row{grid-template-columns:30px minmax(0,1fr) auto 40px 28px;gap:6px}
  .lu-row .bar{display:none}
  .bench-row{grid-template-columns:30px minmax(0,1fr) 40px auto}
  .bench-row .bar{display:none}
  .sect{padding-inline:14px}
}

/* ---- v0.3 : radar, rôles, profil, options ---- */
.sect.opt{margin-left:auto}
.tabs{border-radius:8px 0 0 0}
.radar{width:100%;max-width:300px;height:auto;display:block;margin-inline:auto}
.rd-grid{fill:none;stroke:var(--line);stroke-width:1}
.rd-axis{stroke:var(--line);stroke-width:1}
.rd-cap{fill:none;stroke:var(--ball);stroke-width:1.6;stroke-dasharray:4 3;stroke-linejoin:round}
.rd-val{fill:var(--water-soft);stroke:var(--water);stroke-width:2.4;stroke-linejoin:round}
.rd-dot{fill:var(--water)}
.rd-lab{font:700 13px var(--font-mono);fill:var(--muted);text-anchor:middle}
.rd-lab.key{fill:var(--ink)}
.rd-num{font:600 12.5px var(--font-mono);fill:var(--muted);text-anchor:middle}
.rd-lab.key+.rd-num{fill:var(--ink)}
.rd-ring{fill:var(--ball);opacity:.9}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--water);vertical-align:middle;margin-right:5px}
.legend i.c{border-top:2px dashed var(--ball)}
td.stat.k-key{font-weight:700}
td.stat.k-low{color:var(--muted)}
.q-good{color:var(--good)}.q-bad{color:var(--bad)}
td.stat.k-key.q-good{color:var(--good)}
.g-S{color:var(--p-gk);font-weight:700}.g-A{color:var(--good);font-weight:700}.g-B{color:var(--p-mf);font-weight:700}.g-C{}
.r-hi{color:var(--good);font-weight:700}.r-ok{color:var(--p-mf);font-weight:700}.r-lo{color:var(--warn);font-weight:700}.r-bad{color:var(--bad);font-weight:700}
.rtag{font:600 12px var(--font-body);color:var(--muted);margin-left:6px}
.sd{display:inline-block;font:600 12px var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;min-width:22px;text-align:center}
.sd.bad{color:var(--warn);border-color:var(--warn)}
.ig{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin:0}
.ig dt{color:var(--muted)}.ig dd{margin:0;text-align:right;font-family:var(--font-mono)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.kpi b{font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface)}
.bdg svg{width:34px;height:34px}
.bdg b{font-size:13.5px;display:block}
.bdg small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.bdg.lock{opacity:.55}
.bdg.lock svg{filter:grayscale(1)}
.cups{display:flex;flex-wrap:wrap;gap:10px}
.cupc{display:grid;justify-items:center;gap:4px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:12px;min-width:112px;background:var(--surface);font-size:12px}
.cupc svg{width:38px;height:38px}
.cupc b{font-size:13px}
.cupc.lock{opacity:.5}.cupc.lock svg{filter:grayscale(1)}
.wbar{display:flex;align-items:center;gap:8px;min-width:130px}
.wbar .bar{flex:1}
.prefbar{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;align-items:center;padding-block:10px 0}
.prefbar .seg{gap:4px}.prefbar .chip{padding:4px 10px;font-size:12px}
.prose{display:grid;gap:10px;font-size:14px}
.prose p{color:var(--ink)}
.prose h3{margin-top:6px}
.prose ul{margin:0;padding-left:18px;display:grid;gap:4px}
.optrow{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--line)}
.optrow:last-child{border-bottom:0}
.optrow>div:first-child{display:grid;gap:2px;max-width:46ch}
.optrow b{font-size:14px}
.tsel{min-width:150px}
@media (max-width:520px){.sect.opt{margin-left:0}}
/* ---- v0.4 : lignes adaptatives sans défilement horizontal ---- */
.wrap{max-width:1280px}
.split{grid-template-columns:minmax(0,1fr) 390px}
@media (max-width:1040px){.split{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:visible}
table{table-layout:auto}
td,th{white-space:normal}
.who{min-width:0}
/* lignes joueurs */
.plist{display:grid;gap:3px}
.pr,.ph{display:grid;align-items:center;gap:4px;padding:4px 8px;border-radius:8px}
.pr.sq,.ph.sq{grid-template-columns:44px minmax(0,1fr) repeat(8,34px) 40px 28px 38px 62px 58px}
.pr.mk,.ph.mk{grid-template-columns:44px minmax(0,1fr) repeat(8,34px) 40px 28px 68px 78px}
.pr{background:var(--surface);border:1px solid var(--line);cursor:pointer;min-height:44px}
.pr:hover{border-color:var(--water)}
.pr.sel{border-color:var(--water);background:var(--water-soft);box-shadow:inset 3px 0 0 var(--water)}
.ph{padding-block:2px}
.ph button{all:unset;cursor:pointer;font:700 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0;border-radius:4px;width:100%}
.ph button:hover{color:var(--ink)}
.ph button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ball)}
.ph button.l{text-align:left}
.pr .c-name{display:grid;min-width:0;line-height:1.2}
.pr .c-name b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.pr .c-name small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-stats,.c-extra{display:contents}
.st{display:grid;place-items:center;height:26px;border-radius:5px;font:500 12.5px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.st::before{display:none}
.st.key{color:var(--ink);font-weight:700}
.st.key.t4{background:color-mix(in srgb,var(--good) 34%,transparent)}
.st.key.t3{background:color-mix(in srgb,var(--good) 16%,transparent)}
.st.key.t1{background:color-mix(in srgb,var(--warn) 20%,transparent)}
.st.key.t0{background:color-mix(in srgb,var(--bad) 26%,transparent)}
.st.mid.t4{color:var(--good);font-weight:700}.st.mid.t0{color:var(--bad);font-weight:700}
.st.low{opacity:.7}
.nn{font:700 14px var(--font-mono);text-align:center}
.pg{display:inline-grid;place-items:center;width:24px;height:22px;border-radius:5px;font:700 12px var(--font-mono);border:1px solid var(--line);color:var(--muted)}
.pg-S{background:var(--ball);color:var(--ball-ink);border-color:transparent}
.pg-A{background:var(--good);color:var(--on-good);border-color:transparent}
.pg-B{background:var(--water);color:var(--on-water);border-color:transparent}
.av{display:inline-grid;place-items:center;min-width:34px;height:22px;border-radius:5px;font:700 12px var(--font-mono);color:var(--muted)}
.av.r-hi{background:color-mix(in srgb,var(--good) 30%,transparent);color:var(--ink)}
.av.r-ok{background:color-mix(in srgb,var(--water) 22%,transparent);color:var(--ink)}
.av.r-lo{background:color-mix(in srgb,var(--warn) 24%,transparent);color:var(--ink)}
.av.r-bad{background:color-mix(in srgb,var(--bad) 28%,transparent);color:var(--ink)}
.hpm{display:grid;gap:2px;font:600 12px var(--font-mono);color:var(--muted);text-align:center}
.pr .btn.small{padding:6px 8px;width:100%}
.sortsel{display:flex;gap:8px;align-items:end}
.tabsm{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 0}
.tabsm button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 6px;color:var(--muted);font:600 13px var(--font-body);cursor:pointer}
.tabsm button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ball)}
.sticky{position:sticky;top:calc(var(--hh,128px) + 12px)}
@media (max-width:1040px){.sticky{position:static}}
.ppanel{padding:14px}
.ppanel .radar{max-width:230px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{font:600 12px var(--font-mono);padding:2px 8px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.pchip.main{border:1px solid currentColor;font-size:13px;padding:3px 10px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;font-size:12.5px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.kv span{color:var(--muted)}.kv b{font-family:var(--font-mono);font-weight:600}
.spend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.spend button{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;font:600 12px var(--font-mono);color:var(--ink);cursor:pointer}
.spend button[disabled]{opacity:.4;cursor:not-allowed}
.hist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.hist li>span{font:600 12px var(--font-mono);color:var(--muted);padding-top:2px}
.refp{padding:12px 14px}
.refbody{display:grid;gap:8px;font-size:13px;margin-top:8px}
.refgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:4px 24px}
.refgrid div{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
.refgrid dt,.refgrid b.k{font:700 12px var(--font-mono);color:var(--water)}
.refgrid dd{margin:0;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.lg span{display:inline-flex;gap:6px;align-items:center}
.lg .st{width:34px}
.fac{display:grid;gap:8px;padding:14px}
.pips{display:flex;gap:4px}
.pips i{width:18px;height:8px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.pips i.on{background:var(--ball);border-color:var(--ball)}
.facs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.crow{display:grid;grid-template-columns:30px minmax(0,1fr) 28px 36px 28px 54px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.crow:last-child{border-bottom:0}
.crow>b,.crow>span.nn{font:600 12.5px var(--font-mono);text-align:center}
.crow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center}
.lane select{width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.swopt{display:inline-flex;gap:6px;align-items:center}
.swopt i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;border:1px solid var(--line)}
.sv-water{fill:color-mix(in srgb,var(--sw,var(--water)) 18%,transparent)}
.sv-ball{fill:var(--sb,var(--ball))}
.goalfx{padding:10px 12px;border-radius:8px;background:var(--ball);color:var(--ball-ink);font:800 16px var(--font-display);text-align:center;letter-spacing:.04em}
tr.pick{cursor:pointer}
@media (max-width:700px){
  .x{display:none}

function fitTier(p,slot,lane){

function slotSides(slots){const cnt={},seen={};slots.forEach(s=>cnt[s]=(cnt[s]||0)+1);return slots.map(s=>{const k=seen[s]||0;seen[s]=k+1;const c=cnt[s];if(s==='GK'||c===1)return'C';if(c===2)return k===0?'G':'D';return['G','C','D'][k];});}

function autoAlloc(p,focus){

    const s=wpick(c,k=>(POSW[p.pos][k]||.03)*(k===focus?2.2:1));

  if(p.pts>0&&STATS.every(s=>p.stats[s]>=capOf(p,s)))p.pts=0;
}

let NAT_PREF=.08;
const selScore=(p,line,lane)=>eff(p,line,lane)*(p.pos===line?1+NAT_PREF:1);
// Composition auto : ligne par ligne (GK, FW, MF, DF), en essayant toutes les affectations des meilleurs candidats aux voies de la ligne.
function bestLineup(team,formation){
  const slots=slotsOf(formation),lanes=lanesOf(team,formation),res=Array(slots.length).fill(null);
  const pool=team.players.filter(p=>!p.inj),used=new Set();
  ['GK','FW','MF','DF'].forEach(line=>{
    const ix=slots.map((x,i)=>x===line?i:-1).filter(i=>i>=0);if(!ix.length)return;
    const cand=pool.filter(p=>!used.has(p)).map(p=>({p,v:Math.max(...ix.map(i=>selScore(p,line,lanes[i])))})).sort((a,b)=>b.v-a.v).slice(0,ix.length+3).map(x=>x.p);
    let best=null,bv=-1;
    const rec=(k,cur,tot)=>{
      if(k===ix.length){if(tot>bv+1e-9){bv=tot;best=cur.slice();}return;}
      for(const p of cand){if(cur.includes(p))continue;cur.push(p);rec(k+1,cur,tot+selScore(p,line,lanes[ix[k]]));cur.pop();}
    };
    rec(0,[],0);
    if(best)best.forEach((p,k)=>{res[ix[k]]=p;used.add(p);});
  });
  res.forEach((r,i)=>{if(!r)res[i]=team.players.find(q=>!res.includes(q));});
  return res;
}

function lineupValid(t){

  return t.lineup.every(id=>{const p=t.players.find(q=>q.id===id);return p&&!p.inj;});
}
const ensureLineup=t=>{if(!lineupValid(t))setAutoLineup(t);};

// Réparation : chaque case dont le joueur n'est plus au club (why 'gone', out null) ou est blessé (why 'inj', out = son id) reçoit, parmi les joueurs sains hors de la composition, celui de meilleure eff à ce poste (à égalité l'id le plus petit) ;
// cases traitées dans l'ordre de la composition (gardien d'abord). Sans joueur sain : un blessé de la composition reste en place (aucune entrée dans repl) ; une case « gone » sans joueur sain reçoit le meilleur blessé hors de la composition du plan.

function presetRepair(t,P){
  const sl=slotsOf(P.formation),ln=lanesOf(t,P.formation),cur=Array.isArray(P.lineup)?P.lineup:[],byId=id=>t.players.find(p=>p.id===id);

  sl.forEach((_,k)=>{const p=byId(cur[k]);if(p&&!p.inj&&!used.has(p.id)){res[k]=p;used.add(p.id);}else need.push(k);});
  need.forEach(k=>{

    if(!b)return;
    res[k]=b;used.add(b.id);repl.push({slot:k,out:o?o.id:null,in:b.id,why});

function presetPreview(G,i){

function importSave(text){

  if(typeof text!=='string')return bad('json');
  let o;
  try{o=JSON.parse(text.replace(/^﻿/,''));}catch(e){return bad('json');}
  if(!isObj(o)||o.app!=='blitz-manager'||!Number.isInteger(o.v)||!isObj(o.game)||!Number.isInteger(o.game.v))return bad('format');
  if(o.v!==7||o.game.v!==7)return bad('version');
  const g=o.game;

  const okP=p=>isObj(p)&&typeof p.pos==='string'&&typeof p.race==='string'&&typeof p.side==='string'&&isObj(p.sec)&&Array.isArray(p.traits)&&p.traits.length>0&&isObj(p.stats);
  if(!Array.isArray(g.teams)||g.teams.length!==CLUBS.length||!g.teams.every(t=>isObj(t)&&Array.isArray(t.players)&&t.players.every(okP)))return bad('invalid');
  if(!Number.isInteger(g.userId)||g.userId<0||g.userId>=g.teams.length||g.started!==true)return bad('invalid');
  if(!Array.isArray(g.market)||!g.market.every(okP)||!isObj(g.coach)||!isObj(g.stadium))return bad('invalid');
  // TAC-08 : plans d'équipe (absents = trois vides) ; un plan = {n:texte, formation connue, style, press, lineup de la bonne longueur}
  const okPre=P=>P===null||(isObj(P)&&typeof P.n==='string'&&!!FORMATIONS[P.formation]&&typeof P.style==='string'&&Number.isInteger(P.press)&&Array.isArray(P.lineup)&&P.lineup.length===slotsOf(P.formation).length&&P.lineup.every(Number.isInteger));

  else if(!Array.isArray(g.presets)||g.presets.length!==PRESET_N||!g.presets.every(okPre))return bad('invalid');
  try{g.teams.forEach(t=>t.players.forEach(fixPlayer));g.market.forEach(fixPlayer);}catch(e){return bad('invalid');}
  return {ok:true,G:g};
}

function makeSchedule(n){
  let ids=[...Array(n).keys()];const rounds=[];
  for(let r=0;r<n-1;r++){
    const m=[];
    for(let i=0;i<n/2;i++){const a=ids[i],b=ids[n-1-i];m.push((r+i)%2===0?[a,b]:[b,a]);}
    rounds.push(m);
    ids=[ids[0],ids[n-1],...ids.slice(1,n-1)];
  }
  return [...rounds,...rounds.map(r=>r.map(([h,a])=>[a,h]))];
}

function closestOpp(G){
  const u=G&&Array.isArray(G.teams)?G.teams[G.userId]:null;if(!u)return null;
  const force=t=>Math.max(...FORM_BASE.map(f=>{const sl=slotsOf(f),ss=lanesOf(t,f);return avg(bestLineup(t,f).map((p,i)=>eff(p,sl[i],ss[i])/(.75+.25*hpPct(p))));}));

  return best;
}

function logMatch(M,G){

// puis les jours, les erreurs, en dernier recours les résumés de saison, enfin les parties entières les plus anciennes (la dernière partie reste). Les résumés de saison restent donc tant que possible.
function logTrim(log,max){
  if(max==null)max=LOG_MAX;
  if(!log||!Array.isArray(log.parts))return log;

function radar(p){

function sortFn(key,dir){

  if(f.pos&&p.pos!==f.pos)return false;

// todoLines(G) : lignes « À faire avant le match », par priorité, calculées depuis G seul (aucune clé ajoutée à G, rien n'est stocké).
// → [{id, go, sev, n, who?}] : go = page ciblée, sev = 'block' (bloquante) | 'warn' (ambre), n = nombre concerné ; le texte vient de todoText.
// Les pastilles (en-tête, barre) la lisent dès 12a ; le bloc « À faire » de l'Accueil la réutilisera en 12b.
// UI-37 / UI-71 : table « alerte → page » (la cloche de l'en-tête et le bloc « À faire » de l'Accueil lisent la même todoLines ; les pastilles d'onglet n'existent plus).
const ALERT_GO={inj:'lineup',tired:'lineup',cash:'finance',pts:'squad',spec:'coach'};
function todoLines(G){
  const out=[],t=G&&G.teams&&G.userId!=null?G.teams[G.userId]:null;
  if(!t)return out;
  const lu=(t.lineup||[]).map(id=>t.players.find(p=>p.id===id)).filter(Boolean);
  const hurt=lu.filter(p=>p.inj>0);
  if(hurt.length)out.push({id:'inj',go:ALERT_GO.inj,sev:'block',n:hurt.length,who:hurt[0]});
  const tired=lu.filter(p=>!(p.inj>0)&&hpPct(p)<.5).length;
  if(tired)out.push({id:'tired',go:ALERT_GO.tired,sev:'warn',n:tired});
  if(G.cash<0)out.push({id:'cash',go:ALERT_GO.cash,sev:'warn',n:1});
  const pts=sum(t.players.map(p=>p.pts||0));
  if(pts>0)out.push({id:'pts',go:ALERT_GO.pts,sev:'warn',n:pts});
  if(G.coach&&coachLvl(G.coach).lvl>=SPEC_MIN&&!G.coach.spec)out.push({id:'spec',go:ALERT_GO.spec,sev:'warn',n:1});
  return out;
}

// Lecture seule de la sauvegarde, sans effet de bord (aucun rnd(), G intact). st : 'none' | 'ok' | 'foreign' (JSON valide mais pas chargeable) | 'bad' (JSON illisible).
function peekSave(){
  let s=null;try{s=localStorage.getItem(KEY);}catch(e){}
  if(!s)return {st:'none'};
  let g;try{g=JSON.parse(s);}catch(e){return {st:'bad'};}
  if(!g||typeof g!=='object'||g.userId==null||g.v!==7)return {st:'foreign'};   // v0.8 : G.v = 7, comme migrateSave (toute autre version est refusée)
  try{
    const t=g.teams[g.userId],num=(x,d)=>Number.isFinite(+x)?+x:d;
    return {st:'ok',club:String(t.name).slice(0,40),season:num(g.season,1),day:num(g.day,0),n:g.schedule.length};
  }catch(e){return {st:'foreign'};}
}

// ---------- TEC-10 : journal de test (local, jamais envoyé) ----------
// Le moteur construit les entrées (logMatch, logDay, logSeason, logTrim : lecture seule, aucun rnd()) ; l'UI les range ici. Stockage : clé LKEY, hors de G (aucun champ ajouté à G) ; préférence : PREFS.log.
// Aucune requête réseau : le journal ne sort de l'appareil que par le fichier téléchargé ou le texte copié par la personne. Exclus : noms (joueurs, clubs, entraîneur), textes libres, sauvegarde entière, agent utilisateur.
// Toute erreur interne du journal est avalée : le jeu n'est jamais bloqué, ses tirages et ses résultats ne dépendent pas du journal.
const LKEY='blitz-manager-log';
const logEmpty=()=>({logv:LOG_V,parts:[]});
const logScreen=()=>{const w=window.innerWidth||1280;return w<=700?'mobile':w<=1099?'tablette':'pc';};   // classe d'écran : mêmes seuils que la navigation (700 px) et les colonnes (1 100 px)
function logLoad(){
  if(LOGC)return LOGC;
  let o=null;try{o=JSON.parse(localStorage.getItem(LKEY)||'null');}catch(e){}
  LOGC=o&&typeof o==='object'&&Array.isArray(o.parts)?{logv:LOG_V,parts:o.parts.filter(p=>p&&typeof p==='object').map(p=>({...p,e:Array.isArray(p.e)?p.e.filter(x=>x&&typeof x==='object'):[]}))}:logEmpty();
  return LOGC;
}
// Écriture : tampon circulaire à LOG_MAX (logTrim) ; échec d'écriture : on rogne une fois (moitié du poids), puis on désactive en silence pour la session.
function logSave(){
  if(LOGDEAD||!LOGC)return;
  try{
    if(JSON.stringify(LOGC).length>LOG_MAX)LOGC=logTrim(LOGC,LOG_MAX);
    localStorage.setItem(LKEY,JSON.stringify(LOGC));
  }catch(e){
    try{LOGC=logTrim(LOGC,Math.floor(JSON.stringify(LOGC).length/2));localStorage.setItem(LKEY,JSON.stringify(LOGC));}catch(e2){LOGDEAD=true;}
  }
}
const logCount=o=>o.parts.reduce((a,p)=>a+p.e.length,0);
function logPartNew(){
  const u=U(),p={v:VERSION,gv:G.v,club:u.short,lv:u.level,scr:logScreen(),e:[]};   // en-tête de partie : version, code du club, niveau, classe d'écran
  logLoad().parts.push(p);LOGBOUND=true;logSave();

}
// Section courante = la dernière. Une nouvelle section s'ouvre si la partie en cours n'est pas celle de la dernière section (autre club, autre version, ou progression en arrière : nouvelle partie, import).
function logCur(){
  if(!G||G.userId==null||!G.started)return null;
  const o=logLoad(),p=o.parts[o.parts.length-1];
  if(LOGBOUND&&p)return p;
  if(p&&p.v===VERSION&&p.club===U().short){
    let le=null;for(let i=p.e.length-1;i>=0;i--){const x=p.e[i];if(x&&x.s!=null&&(x.k==='m'||x.k==='d'||x.k==='f')){le=x;break;}}
    if(!(le&&(le.s>G.season||(le.s===G.season&&(le.d||0)>G.day+1)))){LOGBOUND=true;return p;}
  }
  return logPartNew();
}
function logAdd(en){
  if(!en||!PREFS.log||LOGDEAD)return;
  try{const p=logCur();if(!p)return;p.e.push(en);logSave();}catch(e){}
}

const logD=()=>{if(!PREFS.log||LOGDEAD)return;try{logAdd(logDay(G));}catch(e){}};   // après G.day++

function logBind(){LOGBOUND=false;if(!PREFS.log||LOGDEAD)return;try{logCur();}catch(e){}}   // reprise (Continuer) : rattache la sauvegarde à sa section ou en ouvre une
// Erreurs : message tronqué à 160 caractères (adresses retirées), LOG_ERR_MAX par partie ; w : 'e' (error) | 'u' (unhandledrejection). Sans partie en cours : rien.
function logErr(w,msg){
  if(!PREFS.log||LOGDEAD)return;
  try{
    const p=logCur();if(!p)return;
    if(p.e.filter(x=>x&&x.k==='e').length>=LOG_ERR_MAX)return;
    const m=String(msg==null?'':msg).replace(/(?:https?|file|blob|data):\S*/gi,'·').replace(/\s+/g,' ').trim().slice(0,160);
    const en={k:'e',w,m};if(G.season!=null){en.s=G.season;en.d=G.day;}
    p.e.push(en);logSave();
  }catch(e){}
}
if(window.addEventListener){
  window.addEventListener('error',ev=>logErr('e',ev&&(ev.message||(ev.error&&ev.error.message))));

}

// ---------- Choix du club ----------
function pickHTML(){
  const ranked=G.teams.map(t=>({t,p:teamPower(t)})).sort((a,b)=>b.p-a.p);
  const label=t=>{const r=ranked.findIndex(x=>x.t===t);return r<2?L('Favori','Favourite'):r>=5?L('Outsider','Outsider'):L('Ambitieux','Ambitious');};
  const cards=G.teams.map(t=>{
    const star=t.players.slice().sort((a,b)=>ovr(b)-ovr(a))[0];
    return `<button class="club" data-a="prev" data-id="${t.id}" aria-pressed="${UI.prev===t.id}">${badge(t,true)}<span class="cn">${esc(t.name)}</span>
    <span class="row mono muted" style="font-size:12px"><span>${L('Force','Power')} <b style="color:var(--ink)">${Math.round(teamPower(t))}</b></span><span>·</span><span>${label(t)}</span></span>
    <span class="hint">${L('Joueur clé','Key player')} : ${esc(star.name)} (${posCode(star)}, ${ovr(star)}, ${esc(raceName(star))})</span></button>`;
  }).join('');
  let prev='';
  if(UI.prev!=null&&G.teams[UI.prev]){
    const t=G.teams[UI.prev];
    const rows=previewList(t).map((p,i)=>`<div class="prv">${posTag(p)}<div class="pv-n"><input type="text" id="pn-${p.id}" data-c="pname" data-id="${p.id}" maxlength="22" value="${esc(p.name)}" aria-label="${L(fe(p,'Nom du joueur','Nom de la joueuse'),'Player name')}"><small>${esc(raceName(p))} · ${p.age} ${L('ans','y')}${p.sec&&Object.keys(p.sec).length?' · '+L('2e ligne ','2nd line ')+Object.keys(p.sec).map(k=>P(LINEN[k])).join('/'):''}</small>${traitChips(p)}</div><span class="nn">${ovr(p)}</span>${potCell(p)}<button class="btn small shbtn" data-a="sheet" data-i="${i}" aria-label="${esc(L(`Fiche de ${p.name}`,`${p.name}’s sheet`))}">${T('f.sheet')}</button></div>`).join('');
    prev=`<section class="panel stack" id="prevp"><div class="row between"><div class="who">${badge(t,true)}<div><div style="font:600 17px var(--font-display)">${esc(t.name)}</div><span class="muted">${L('Force','Power')} ${Math.round(teamPower(t))} · ${label(t)} · ${L('formation','formation')} ${t.formation}</span></div></div>
    <button class="btn primary" data-a="pick" data-id="${t.id}">${L('Valider ce choix','Confirm this club')}</button></div>
    <p class="muted" style="font-size:13px">${L('Tu peux renommer les joueurs ici.','You can rename the players here.')}</p>
    <div>${rows}</div>
    <div class="row"><button class="btn primary" data-a="pick" data-id="${t.id}">${L('Valider ce choix','Confirm this club')}</button></div></section>`;
  }else prev=`<p class="muted">${L('Clique sur un club pour voir son effectif.','Click a club to see its squad.')}</p>`;
  return `<div class="wrap main" style="padding-block:12px 0">${prefBar()}<div class="stack"><div class="hero">${brandH}${stepHead(2)}
  <h1>${T('f.club.h')}</h1>
  <p class="muted">${T('f.club.sub')}</p></div>
  <div class="clubs pickgrid">${cards}</div>
  <div class="row"><button class="btn" data-a="back">${T('f.back')}</button><button class="btn" data-a="reroll">${L(`Tirer d'autres effectifs`,'Draw new squads')}</button></div>

// UI-12b : Accueil actionnable. Ordre : À faire → Prochain match (+ fiche adversaire) → Journal → Classement → Finances → Entraîneur ; un lien « Page → » par bloc.
const pageName=id=>{id=tabId(id);for(const s in SECT){const x=SECT[s].find(y=>y[0]===id);if(x)return P(x[1]);}return id;};
const TODO_LBL={squad:['Effectif','Squad']};
const TODO_ICO={inj:'⚠',tired:'↓',cash:'⊖',pts:'+',spec:'★'};
const goLink=(t,label)=>`<button class="linkbtn pgl" data-a="goto" data-t="${t}">${label||pageName(t)} →</button>`;
const blockHd=(title,t,label)=>`<div class="row between bhd"><h3>${title}</h3>${t?goLink(t,label):''}</div>`;
// « À faire avant le match » : mêmes lignes que les pastilles (todoLines), 5 au plus ; rien n'est stocké
// UI-71 : liste « À faire » commune au bloc de l'Accueil et à la cloche (une seule source : todoLines)
function todoListHTML(){
  const ls=todoLines(G).slice(0,5);
  const rows=ls.map(l=>`<li class="td ${l.sev}"><span class="tdi" role="img" aria-label="${l.sev==='block'?L('Bloquant','Blocking'):L('À surveiller','Heads-up')}">${TODO_ICO[l.id]||'•'}</span><span class="tdt">${esc(todoText(l))}</span><button class="btn small" data-a="goto" data-t="${l.go}">${TODO_LBL[l.go]?P(TODO_LBL[l.go]):pageName(l.go)} →</button></li>`).join('');
  return ls.length?`<ul class="todo">${rows}</ul>`:`<p class="alldone"><span aria-hidden="true">✓</span> ${L('Tout est prêt','All set')}</p>`;
}
function todoBlock(){
  return `<section class="panel hb1"><h3>${L('À faire avant le match','To do before the match')}</h3>${todoListHTML()}</section>`;
}
// fiche adversaire (dans le bloc Prochain match) : rang et points, joueur clé, meilleur buteur (si g > 0), mention du style ; force par ligne et forme sont au-dessus
function oppCard(opp){
  const st=sortedTable(G),rank=st.findIndex(r=>r.id===opp.id)+1,row=G.table[opp.id];
  const key=opp.players.slice().sort((a,b)=>ovr(b)-ovr(a))[0];
  const top=opp.players.filter(p=>p.g>0).sort((a,b)=>b.g-a.g)[0];
  return `<div class="oppc"><div class="frow"><span class="muted">${L('Classement','Table')}</span><b class="mono">${rank}${ord1(rank)} · ${row.pts} pts</b></div>
  <div class="frow"><span class="muted">${L('Joueur clé','Key player')}</span><span>${esc(key.name)} · ${posCode(key)} ${ovr(key)}</span></div>
  ${top?`<div class="frow"><span class="muted">${L('Meilleur buteur','Top scorer')}</span><span>${esc(top.name)} · ${top.g} ${L(top.g>1?'buts':'but',top.g>1?'goals':'goal')}</span></div>`:''}
  <p class="hint">${L(`Style et pressing : choisis au coup d'envoi.`,'Style and pressing: pick them at kick-off.')}</p>
  <button class="linkbtn pgl" data-a="oppcard" data-id="${opp.id}">${L('Fiche complète','Full sheet')} →</button></div>`;
}

  const [h,a]=todayFx(),home=h===u.id,opp=G.teams[home?a:h];

  <div class="vs"><div class="side">${badge(u,true)}<span class="nm">${esc(u.name)}</span>${formChips(u.id)}</div>
  <div class="mid">${home?L('DOMICILE','HOME'):L('EXTÉRIEUR','AWAY')}<br>VS</div>
  <div class="side">${badge(opp,true)}<span class="nm">${esc(opp.name)}</span>${formChips(opp.id)}</div></div>
  ${cmpFused(u,opp)}
  ${oppCard(opp)}

  const st5=sortedTable(G),me5=st5.findIndex(r=>r.id===u.id),i0=clamp(me5-2,0,Math.max(0,st5.length-5));
  const mini=st5.slice(i0,i0+5).map((r,k)=>{const t=G.teams[r.id],i=i0+k;return `<tr class="${t.id===u.id?'me':''}"><td class="num">${i+1}</td><td>${badge(t)}</td><td class="num hx">${r.p}</td><td class="num hx">${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td class="num">${r.pts}</td></tr>`;}).join('');
  const nw=G.news.length?G.news.slice(0,5).map(n=>`<div><span>J${n.d}</span><p>${n.a?jAlert()+' ':''}${esc(n.s)}</p></div>`).join(''):`<p class="hint">${L('Aucune nouvelle pour le moment.','No news yet.')}</p>`;
  const last=G.finLog[0],C=G.coach,nw1=netIf(true,home),nw0=netIf(false,home),cl=coachLvl(C);
  const fin=`<section class="panel hb6">${blockHd(L('Finances','Finances'),'finance')}<div class="stack tight"><div class="frow"><span class="muted">${L('Budget','Budget')}</span><b class="mono">${fmt(G.cash)} gils</b></div>
  <div class="frow"><span class="muted">${L('Salaires et staff / journée','Wages and staff / matchday')}</span><b class="mono">−${fmt(sum(u.players.map(p=>p.wage))+800)}</b></div>
  ${last?`<div class="frow"><span class="muted">${L('Dernier match','Last match')}</span><b class="mono ${last.net>=0?'pos-v':'neg-v'}">${signed(last.net)}</b></div>`:''}
  <div class="nxfin"><b class="nxh">${L('Prochain match, résultat net prévu','Next match, projected net result')}<span class="mono muted"> · ${home?L('domicile','home'):L('extérieur','away')}</span></b>
  <div class="frow"><span class="muted">${L('Victoire','Win')}</span><b class="mono ${nw1.net>=0?'pos-v':'neg-v'}">${signed(nw1.net)}</b></div>
  <div class="frow"><span class="muted">${L('Défaite','Loss')}</span><b class="mono ${nw0.net>=0?'pos-v':'neg-v'}">${signed(nw0.net)}</b></div>
  <p class="hint">${L(`Seule différence : la prime de victoire (+${fmt(nw1.bonus)}).`,`Only difference: the win bonus (+${fmt(nw1.bonus)}).`)}</p></div></div></section>`;
  const spec=C.spec&&SPECS[C.spec]?P(SPECS[C.spec].n):cl.lvl>=SPEC_MIN?L('à choisir','to pick'):L(`dès le niveau ${SPEC_MIN}`,`from level ${SPEC_MIN}`);
  // UI-74 : bilan général de l'entraîneur (lecture seule de G.coach et G.honors ; matchs de saison seulement, l'entraînement n'est pas enregistré) ; « — » tant qu'aucun match n'est joué
  const pc0=winPct(C),dm=pc0===null?'—':null,ttl=G.honors.filter(h=>h.rank===1).length;
  const cr=(l,v)=>`<div class="frow"><span class="muted">${l}</span><b class="mono">${v}</b></div>`;
  const cc=`<section class="panel hb5">${blockHd(L('Entraîneur','Coach'),'coach')}<div class="stack tight">${coachBar()}<div><div class="frow"><span class="muted">${L('Spécialité','Specialty')}</span><b>${spec}</b></div>
  ${cr(L('Bilan','Record'),`${C.w} ${L('V','W')} · ${C.l} ${L('D','L')}`)}${cr(L('Taux de victoire','Win rate'),dm||pc0+'%')}${cr(L('Série · record','Streak · best'),`${C.streak} · ${C.best}`)}${cr(L('BP · BC / m','GF · GA / m'),dm||`${(C.gf/C.m).toFixed(1)} · ${(C.ga/C.m).toFixed(1)}`)}${cr(L('Saisons · titres','Seasons · titles'),`${C.seasons} · ${ttl}`)}</div></div></section>`;
  const tbl=`<section class="panel hb3">${blockHd(L('Classement','League table'),'table')}<div class="tbl"><table><thead><tr><th class="num">#</th><th>Club</th><th class="num hx">${L('J','P')}</th><th class="num hx">+/−</th><th class="num">Pts</th></tr></thead><tbody>${mini}</tbody></table></div></section>`;
  const jrn=`<section class="panel hb4">${blockHd(L('Journal du club','Club journal'),'journal')}<div class="news">${nw}</div></section>`;
  // UI-72 : à ≥ 1 200 px, deux colonnes (A : À faire, Prochain match | B : Classement et Entraîneur côte à côte, Journal, Finances) ; en dessous, une colonne dans l'ordre hb1…hb6 (À faire, Prochain match, Classement, Journal, Entraîneur, Finances ; display:contents + order, voir « UI-72 » dans style.css)
  return `<div class="hm"><div class="hcA">${todoBlock()}${next}</div><div class="hcB"><div class="hpr">${tbl}${cc}</div>${jrn}${fin}</div>${helpRow('game')}</div>`;
}

    const ord={GK:0,DF:1,MF:2,FW:3};
    body=`<div style="font-size:12px;color:var(--muted)" class="crow"><span></span><span>${L('Joueur','Player')}</span><span style="text-align:center">${L('Âge','Age')}</span><span style="text-align:center">${L('Note','Ovr')}</span><span style="text-align:center">Pot.</span><span style="text-align:center">${L('Clé','Key')}</span></div>`+

  }else{
    const kp=[[L('Rang','Rank'),rank],['Pts',r.pts],[L('Matchs','Played'),r.p],[L('V · D','W · L'),`${r.w+0} · ${r.l+r.otl}`],[L('Buts','Goals'),`${r.gf}–${r.ga}`],[L('Force','Power'),Math.round(teamPower(t))]];

const cupSvg=col=>`<svg viewBox="0 0 36 36" aria-hidden="true"><path d="M10 5h16v8a8 8 0 0 1-16 0z" fill="${col}"/><path d="M10 8H5v3a5 5 0 0 0 5 5M26 8h5v3a5 5 0 0 1-5 5" fill="none" stroke="${col}" stroke-width="2.5"/><rect x="16" y="20" width="4" height="6" fill="${col}"/><rect x="11" y="26" width="14" height="4" rx="1" fill="${col}"/></svg>`;

const kpi=(v,l)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
function trophyCards(){
  const out=[];
  G.honors.forEach(h=>{if(h.rank<=3)out.push(`<div class="cupc">${cupSvg(CUPCOL[h.rank===1?'gold':h.rank===2?'silver':'bronze'])}<b>${h.rank===1?L('Champion','Champions'):h.rank===2?L('Vice-champion','Runners-up'):L('Troisième','Third place')}</b><span>${L('Saison','Season')} ${h.s}</span></div>`);});
  CUPS.forEach(([n,t])=>{const on=G.coach.w>=n;out.push(`<div class="cupc ${on?'':'lock'}">${cupSvg(CUPCOL[t])}<b>${L(`Coupe des ${n} victoires`,`${n}-win cup`)}</b><span>${on?L('Obtenue','Earned'):`${G.coach.w}/${n}`}</span></div>`);});
  return out.join('');
}

function endCoachEdit(){UI.cedit=false;const n=document.getElementById('cname');if(n)n.innerHTML=coachNameHTML();}
function coachHTML(){
  const C=G.coach,u=U(),pct=winPct(C)??0;
  const comps=Object.entries(C.comps).map(([k,v])=>{const [f,s,pr]=k.split('|');return{f,s,pr:+pr,...v};}).sort((a,b)=>b.p-a.p||b.w-a.w);
  const best=comps.filter(c=>c.p>=3).sort((a,b)=>b.w/b.p-a.w/a.p||(b.gf-b.ga)-(a.gf-a.ga))[0];
  const crow=comps.map(c=>{const r=Math.round(c.w/c.p*100);return `<tr class="${best===c?'me':''}"><td class="mono"><b>${c.f}</b></td><td>${nN(c.s)}</td><td class="x">${pN(c.pr)}</td><td class="num">${c.p}</td><td><div class="wbar">${barH(r)}<span class="mono">${r}%</span></div></td><td class="num x">${(c.gf/c.p).toFixed(1)}</td><td class="num x">${(c.ga/c.p).toFixed(1)}</td></tr>`;}).join('');
  const bd=BADGES.map(b=>{const g=C.badges[b.id];return `<div class="bdg ${g?'':'lock'}">${medal(!!g)}<div><b>${P(b.n)}</b><small>${P(b.d)}</small><small>${g?L(`Obtenu saison ${g.s}, journée ${g.d}`,`Earned season ${g.s}, matchday ${g.d}`):L('À débloquer','Locked')}</small></div></div>`;}).join('');
  return `<div class="stack"><h2>${L(`Profil d'entraîneur`,'Coach profile')}</h2>
  <section class="panel stack"><div class="row between"><div class="who">${coachPortraitHTML()}${badge(u,true)}<div class="grow"><div id="cname" class="cname">${coachNameHTML()}</div><span class="muted">${esc(u.name)} · ${L('Saison','Season')} ${G.season}</span></div></div></div>
  ${coachBar()}${specPanel()}<div class="kpis k5">${kpi(C.m,L('Matchs','Matches'))}${kpi(C.w,L('Victoires','Wins'))}${kpi(C.l,L('Défaites','Losses'))}${kpi(pct+'%',L('Taux de victoire','Win rate'))}${kpi(C.gf,L('Buts marqués','Goals for'))}${kpi(C.ga,L('Buts encaissés','Goals against'))}${kpi(C.cs,L('Matchs sans encaisser','Clean sheets'))}${kpi(C.best,L('Meilleure série','Best streak'))}${kpi(C.ow,L('Victoires en prolongation','Overtime wins'))}${kpi(Object.keys(C.badges).length+'/'+BADGES.length,'Badges')}</div></section>
  <section class="panel"><h3>${L('Compositions jouées','Line-ups used')}</h3>
  ${comps.length?`<div class="tbl" style="margin-top:12px"><table><thead><tr><th>${L('Formation','Formation')}</th><th>${L('Style','Style')}</th><th class="x">${L('Pressing','Pressing')}</th><th class="num">${L('Joués','Played')}</th><th>${L('Victoires','Win rate')}</th><th class="num x">${L('BP/m','GF/m')}</th><th class="num x">${L('BC/m','GA/m')}</th></tr></thead><tbody>${crow}</tbody></table></div>
  <p class="hint" style="margin-top:8px">${best?L(`Meilleure composition (au moins 3 matchs) : ${best.f}, ${nN(best.s).toLowerCase()}, pressing ${pN(best.pr).toLowerCase()} — ${Math.round(best.w/best.p*100)} % de victoires.`,`Best set-up (at least 3 matches): ${best.f}, ${nN(best.s).toLowerCase()}, ${pN(best.pr).toLowerCase()} pressing — ${Math.round(best.w/best.p*100)}% wins.`):L('Joue au moins 3 matchs avec une même composition pour désigner la meilleure.','Play at least 3 matches with the same set-up to name the best one.')}</p>`:`<p class="hint" style="margin-top:8px">${L('Aucun match joué pour le moment.','No match played yet.')}</p>`}</section>
  <section class="panel"><h3>${L('Trophées','Trophies')}</h3><div class="cups" style="margin-top:12px">${trophyCards()}</div></section>
  <section class="panel"><h3>Badges</h3><div class="badges" style="margin-top:12px">${bd}</div></section></div>`;
}

function setCrest(u,k,f,v){
  const c=u.crest=JSON.parse(JSON.stringify(crestOf(u)));
  if(k==='bg'||k==='fg'){c[k][f]=v;}else if(k==='lg'&&f==='c')c.lg.c=v;
  if(k==='bg'&&f==='c')u.color=v;
}
// setup === true : étape 3 du parcours (inchangée) ; 'col' : panneau « Club » de la page Personnalisation (nom, code, blason, noms des joueurs) ; sinon : deux panneaux + noms.
function customHTML(setup){
  const u=U(),c=crestOf(u);
  const sw=(k)=>PALETTE.map(col=>`<button class="sw${c[k].c.toLowerCase()===col.toLowerCase()?' cur':''}" style="--c:${col}" data-a="ccol" data-k="${k}" data-v="${col}" aria-label="${L('Couleur','Colour')} ${col}"></button>`).join('')+`<label class="sw wheel" title="${L('Roue chromatique','Colour wheel')}"><input type="color" data-c="ccol" data-k="${k}" value="${c[k].c.slice(0,7)}" aria-label="${L('Roue chromatique','Colour wheel')}"></label>`;
  const mini=(o)=>crestSvg({id:u.id,color:u.color,emblem:u.emblem,crest:o.cr||c},40,{nologo:o.nologo});
  const bgb=BGS.map((s,i)=>`<button class="shape-btn" data-a="cshape" data-k="bg" data-v="${i}" aria-pressed="${c.bg.s===i}" aria-label="${P(s)}" title="${P(s)}">${mini({cr:{...c,bg:{...c.bg,s:i},fg:{...c.fg,s:0}},nologo:1})}</button>`).join('');
  const fgb=FGS.map((s,i)=>`<button class="shape-btn" data-a="cshape" data-k="fg" data-v="${i}" aria-pressed="${c.fg.s===i}" aria-label="${P(s)}" title="${P(s)}">${mini({cr:{...c,fg:{...c.fg,s:i}},nologo:1})}</button>`).join('');
  const lgb=EMBLEMS.map((e,i)=>`<button class="shape-btn" data-a="setemb" data-v="${i}" aria-pressed="${u.emblem===i}" aria-label="${e.n}" title="${e.n}">${crestSvg({id:u.id,color:u.color,emblem:i,crest:{...c,bg:{...c.bg,s:c.bg.s}}},40)}</button>`).join('');
  const ord={GK:0,DF:1,MF:2,FW:3};
  const namesIn=`<div class="pnames">${u.players.slice().sort((a,b)=>ord[a.pos]-ord[b.pos]).map(p=>`<label>${posTag(p)}<input type="text" id="pn-${p.id}" data-c="pname" data-id="${p.id}" maxlength="22" value="${esc(p.name)}" aria-label="${L(fe(p,'Nom du joueur','Nom de la joueuse'),'Player name')}"></label>`).join('')}</div>`;
  const idIn=`<div class="crestprev">${crestSvg(u,96)}</div><div class="row" style="justify-content:center"><span style="font:600 16px var(--font-display)">${esc(u.name)}</span><span class="mono muted">${esc(u.short)}</span></div>
  <label class="f">${L('Nom du club','Club name')}<input type="text" id="club-name" data-c="tname" maxlength="28" value="${esc(u.name)}"></label>
  <label class="f">${L('Code (2 à 4 lettres)','Code (2 to 4 letters)')}<input type="text" id="club-short" data-c="tshort" maxlength="4" value="${esc(u.short)}" style="max-width:120px"></label>`;
  const crIn=`<div class="cgroup"><h4>${L('1 · Forme de fond','1 · Background shape')}</h4><div class="shapes">${bgb}</div><div class="swatches">${sw('bg')}</div></div>
  <div class="cgroup"><h4>${L('2 · Forme de premier plan','2 · Foreground shape')}</h4><div class="shapes">${fgb}</div><div class="swatches">${sw('fg')}</div></div>
  <div class="cgroup"><h4>${L('3 · Logo','3 · Logo')}</h4><div class="shapes">${lgb}</div><div class="swatches">${sw('lg')}</div></div>`;
  if(setup==='col')return `<section class="panel stack"><h3>${L('Club','Club')}</h3>${idIn}<div class="stack cblock"><h3 class="sub">${L('Blason','Crest')}</h3>${crIn}</div><div class="stack cblock"><h3 class="sub">${L('Joueurs','Players')}</h3>${namesIn}</div></section>`;
  const names=setup?'':`<section class="panel stack"><h3>${L('Joueurs','Players')}</h3>${namesIn}</section>`;
  return `<div class="grid2"><section class="panel stack"><h3>${L('Identité','Identity')}</h3>${idIn}</section>
  <section class="panel stack"><h3>${L('Blason','Crest')}</h3>${crIn}</section>
  ${names?`<div style="grid-column:1/-1">${names}</div>`:''}</div>`;
}

// UI-22 : trois infos de la Fiche du club, calculées depuis G.results (aucun champ de sauvegarde ajouté).
function seasonLines(){
  const u=U(),out=[];
  (G.results||[]).forEach((day,d)=>{
    const r=day&&day.find(x=>x.h===u.id||x.a===u.id);if(!r)return;
    const home=r.h===u.id,gf=home?r.hs:r.as,ga=home?r.as:r.hs;
    out.push({d,home,opp:G.teams[home?r.a:r.h],gf,ga,won:gf>ga});
  });
  return out;
}
function clubSeasonHTML(){
  const u=U(),ln=seasonLines(),S=G.stadium;
  const side=h=>{const a=ln.filter(x=>x.home===h);return{p:a.length,w:a.filter(x=>x.won).length,l:a.filter(x=>!x.won).length,gf:sum(a.map(x=>x.gf)),ga:sum(a.map(x=>x.ga))};};
  const hm=side(true),aw=side(false);
  const sline=(lab,o)=>`<div class="frow"><span class="muted">${lab} · ${o.p} ${L('m.','pl.')}</span><b class="mono">${o.p?`${o.w}${L('V','W')} ${o.l}${L('D','L')} · ${o.gf}–${o.ga}`:'–'}</b></div>`;
  const best=(arr,sgn)=>arr.reduce((b,x)=>!b||sgn*(x.gf-x.ga)>sgn*(b.gf-b.ga)?x:b,null);
  const bw=best(ln.filter(x=>x.won),1),bl=best(ln.filter(x=>!x.won),-1);
  const rec=(lab,x,none,cls)=>`<div class="rec"><span class="muted">${lab}</span>${x?`<div class="recv"><b class="mono ${cls}">${x.gf}–${x.ga}</b><span class="mono muted">${x.gf>x.ga?'+':'−'}${Math.abs(x.gf-x.ga)}</span>${badge(x.opp)}<span class="mono muted">J${x.d+1} · ${x.home?L('Dom.','Home'):L('Ext.','Away')}</span></div>`:`<p class="hint">${none}</p>`}</div>`;
  const none=L('Aucun match joué cette saison.','No match played this season yet.');
  return `<h3 class="sub">${L('Saison en cours','Current season')} · S${G.season}</h3>
  <div class="grid3"><section class="panel"><h3>${L('Domicile / extérieur','Home / away')}</h3><div style="margin-top:8px">${ln.length?sline(L('Domicile','Home'),hm)+sline(L('Extérieur','Away'),aw):`<p class="hint">${none}</p>`}</div></section>
  <section class="panel"><h3>${L('Écarts de la saison','Season margins')}</h3><div class="stack tight" style="margin-top:8px">${ln.length?rec(L('Plus large victoire','Biggest win'),bw,L('Aucune victoire pour le moment.','No win yet.'),'pos-v')+rec(L('Plus lourde défaite','Heaviest defeat'),bl,L('Aucune défaite pour le moment.','No defeat yet.'),'neg-v'):`<p class="hint">${none}</p>`}</div></section>
  <section class="panel"><h3>${L('Installations','Facilities')}</h3><div style="margin-top:8px">${FAC.map(k=>`<div class="frow"><span class="muted">${P(FACD[k].n)}</span><b class="mono">${S.lv[k]}/${FACMAX}</b></div>`).join('')}<div class="frow tot"><span>${L('Total','Total')}</span><b class="mono">${stadTotal(G)}/${FAC.length*FACMAX}</b></div></div>
  <button class="btn small" data-a="tab" data-t="finance" style="margin-top:10px">${L('Améliorer dans Finances','Upgrade in Finances')}</button></section></div>`;
}

  <div class="kpis">${kpi(titles,L('Titres de champion','League titles'))}${kpi(podiums,L('Podiums','Podiums'))}${kpi(bestRank?rankTxt(bestRank):'–',L('Meilleur classement','Best finish'))}${kpi(H.length,L('Saisons terminées','Seasons completed'))}${kpi(fmt(G.cash),L('Budget (gils)','Budget (gil)'))}${kpi(fmt(G.fans),L('Public moyen','Average crowd'))}${kpi(fmt(val),L('Valeur de l’effectif','Squad value'))}${kpi(fmt(wag),L('Salaires / journée','Wages / matchday'))}${kpi(age.toFixed(1),L('Âge moyen','Average age'))}</div></section>
  <section class="panel"><h3>${L('Palmarès','Honours')}</h3>
  ${H.length?`<div class="tbl" style="margin-top:12px"><table><thead><tr><th class="num">${L('Saison','Season')}</th><th class="num">${L('Rang','Rank')}</th><th class="num">Pts</th><th class="num">${L('Bilan','Record')}</th><th class="num">${L('Buts','Goals')}</th><th>${L('Champion','Champions')}</th></tr></thead><tbody>${hrows}</tbody></table></div>`:`<p class="hint" style="margin-top:8px">${L('Le palmarès se remplit à la fin de chaque saison.','The honours list fills up at the end of every season.')}</p>`}</section>

  ${clubSeasonHTML()}
  <p class="hint">${L(`Bilan de l’ère ${esc(coachName())} : ${C.w} victoires, ${C.l} défaites, ${C.gf} buts marqués.`,`Under ${esc(coachName())}: ${C.w} wins, ${C.l} losses, ${C.gf} goals scored.`)}</p></div>`;

    ${sec('Match','Match',li([L(`Huit joueurs par équipe : un gardien et sept joueurs de champ selon la formation. Effectif de ${SQUAD_MIN} à ${SQUAD_MAX} joueurs (${SQUAD_START.length} au départ), banc de ${SQUAD_START.length-slotsOf(FORM_DEFAULT).length}.`,`Eight players a side: one keeper and seven outfield players depending on the formation. Squad of ${SQUAD_MIN} to ${SQUAD_MAX} players (${SQUAD_START.length} at the start), a bench of ${SQUAD_START.length-slotsOf(FORM_DEFAULT).length}.`),L('Deux périodes de cinq minutes (36 phases). En cas d’égalité : mort subite, puis départage.','Two five-minute halves (36 phases). If level: sudden death, then a tiebreak.'),L('Chaque phase : possession, portée du ballon (AT contre PH), jusqu’à deux passes (PS contre IN), tir (TI contre IN) puis arrêt (AR).','Each phase: possession, carrying the ball (AT vs PH), up to two passes (PS vs IN), a shot (TI vs IN), then a save (AR).'),L('Trois remplacements par match, à la mi-temps ou en direct.','Three substitutions per match, at half-time or live.'),...(MERCY>0?[L(`Écart de ${MERCY} buts : en temps réglementaire, le match s’arrête dès que l’écart atteint ${MERCY} buts. Le score est conservé et la victoire vaut 3 points ; ni prolongation ni tirs au but.`,`${MERCY}-goal gap: in regulation time the match stops as soon as the gap reaches ${MERCY} goals. The score stands and the win is worth 3 points; no overtime or penalty shoot-out.`)]:[]),...(LONE_FW>1?[L(`Un attaquant seul en pointe reçoit +${Math.round((LONE_FW-1)*100)} % sur toutes ses caractéristiques.`,`A lone forward gets +${Math.round((LONE_FW-1)*100)}% on all of their stats.`)]:[]),L('Trois consignes, données en pause à tout moment du match, mi-temps comprise : Souffler, Verrouiller, Pousser. Une réserve de 3 blocs de 6 phases par match à répartir entre elles (1 à 3 blocs par consigne, dans la limite de la fin du match). Souffler est instantané ; Verrouiller et Pousser durent leurs blocs, une seule à la fois : en changer fait perdre les phases restantes. Impossible en prolongation. Souffler rend des HP à tous les titulaires ; Verrouiller renforce la défense et affaiblit le milieu et l’attaque ; Pousser renforce l’attaque et affaiblit la défense et le milieu ; les joueurs de la ligne visée perdent des HP. L’adversaire en donne aussi.'+(HALF_POWER>0?'':' Leurs effets sont provisoirement désactivés, le temps du rééquilibrage.'),'Three instructions, given while paused at any point in the match, half-time included: Catch breath, Lock down, Push forward. A reserve of 3 blocks of 6 phases per match to spend on them (1 to 3 blocks per instruction, within what is left of the match). Catch breath is instant; Lock down and Push forward last for their blocks, one at a time: switching loses the remaining phases. Not possible in overtime. Catch breath gives all starters HP back; Lock down boosts defence and weakens midfield and attack; Push forward boosts attack and weakens defence and midfield; the players of the targeted line lose HP. The opponent gives instructions too.'+(HALF_POWER>0?'':' Their effects are temporarily switched off until the game is rebalanced.')),L('En direct, chaque phase du fil se déplie pour montrer ses duels : stats comparées, probabilité du tacle, facteurs (style, pressing, poste, trait, HP). Vert : favorable à ton équipe ; rouge : défavorable ; ✓ ou ✗ : l’action de celui qui la tente réussit ou non.','Live, every feed phase unfolds to show its duels: compared stats, tackle probability, factors (style, pressing, position, trait, HP). Green: good for your team; red: bad for it; ✓ or ✗: the action succeeds or fails for the player attempting it.'),L('Infos de match : possession cumulée et sur les 6 dernières phases ; la jauge de HP de tes joueurs passe de OK à fatigué (HP à 25 % du maximum ou moins) puis épuisé (moins de 10 HP) ; un bandeau et le fil signalent chaque joueur qui passe épuisé.','Match info: total possession and possession over the last 6 phases; your players’ HP gauge goes from OK to tired (HP at 25% of max or less) then spent (under 10 HP); a banner and the feed flag every player who becomes spent.'),L('La Sphère est ronde : le club qui reçoit joue vers la droite, le visiteur vers la gauche. Une consigne de ligne colore la ligne visée (bande hachurée et symbole) tant qu’elle dure ; Souffler entoure brièvement tous les titulaires d’un halo. Seul le dessin change : aucune distance ne compte dans les duels.','The Sphere is round: the home club attacks to the right, the visitor to the left. A line instruction marks the targeted line (hatched band and symbol) while it lasts; Catch breath briefly puts a halo around all starters. Only the picture changes: no distance counts in the duels.'),L('Dimensions de convention : terrain de 100 m de diamètre (rayon 50 m), ballon de 0,3 m, buts triangulaires de 6 m (dessinés environ 2,5 fois plus grands pour rester lisibles).','Game convention: an arena 100 m across (50 m radius), a 0.3 m ball, triangular goals 6 m wide (drawn about 2.5 times larger to stay readable).'),L('Dans un duel de passe, la phrase nomme le passeur, le receveur et le défenseur qui gêne : passe sans gêne, passe affaiblie, interception ou passe qui s’éteint.','In a pass duel, the sentence names the passer, the receiver and the defender who hampers it: clean pass, weakened pass, interception or a pass that fades out.'),L('Avant le coup d’envoi, « Tactique rapide » règle le style, le pressing et la formation ; le détail est dans Effectif › Tactique. Changer de formation refait les huit de départ en automatique.','Before kick-off, “Quick tactics” sets style, pressing and formation; details are in Squad › Tactics. Changing formation resets the starting eight to automatic.')]))}</div>

r game). “Clear” empties it, after confirmation. If downloads are blocked, use Copy.')]))}

t ses joueurs marquants.','Dashboard: “To do before the match” lists the same alerts, each with its link; the opponent card gives its rank, form, strength by line and standout players.'),L('Club › Journal : les 100 derniers événements, groupés par saison et journée ; les puces filtrent par catégorie (⚠ alertes, match, effectif, marché, club, finances).','Club › Journal: the last 100 events, grouped by season and matchday; the chips filter by category (⚠ alerts, match, squad, market, club, finances).')]))}

// TAC-09 : forces de zone et lecture fort / faible. Lecture seule de lineVals ; seuil d'écart ZONE_TH (constante d'interface, hors G) comparé au pourcentage arrondi affiché.
// Recalibré en v0.6.9 : 5 % sortait 59,6 % des zones (167/280, 10 ligues neuves, club n°3 contre ses 7 adversaires) ; 9 % en sort 30,7 % (cible : un tiers).
const ZONE_TH=9,ZONES=[['gk',['Gardien','Keeper']],['def',['Défense','Defence']],['mid',['Milieu','Midfield']],['fwd',['Attaque','Attack']]];
// zst : écart en % (valeurs non arrondies) et indice 0 faible / 1 égal / 2 fort ; zsum : ligne de synthèse (la plus forte et la plus faible zone) ; partagés par zonesHTML (Tactique) et cmpFused
const zst=(a,b)=>{const pc=b?Math.round((a-b)/b*100):0;return {pc,s:Math.abs(pc)<ZONE_TH?0:pc>0?1:-1};};
const zsum=(z,W)=>{const hi=z.filter(r=>r.s>0).sort((x,y)=>y.pc-x.pc)[0],lo=z.filter(r=>r.s<0).sort((x,y)=>x.pc-y.pc)[0];return !hi&&!lo?L('Équilibré','Balanced'):[hi&&`<b>${W[2]}</b> : ${hi.n}`,lo&&`<b>${W[0]}</b> : ${lo.n}`].filter(Boolean).join(' · ');};
function zonesHTML(u,opp){

  const z=ZONES.map(([k,n])=>{const a=me[k],b=op&&op[k];return {k,n:P(n),a,b,...zst(a,b)};});
  const rows=z.map(r=>{const i=r.s+1,al=`${r.n} : ${Math.round(r.a)}${op?`, ${sg(r.pc)}${Math.abs(r.pc)} % ${L('face à l’adversaire','against the opponent')} (${W[i]})`:''}`;
    return `<div class="zr z${i}" role="group" aria-label="${al}"><span class="zl">${r.n}</span><b class="mono">${Math.round(r.a)}</b>${barH(r.a,'var(--water)').replace('</i>',`</i>${op?`<u style="left:${clamp(r.b,0,100)}%"></u>`:''}`)}<span class="zs">${op?`<span aria-hidden="true">${['▼','=','▲'][i]}</span> ${W[i]} ${sg(r.pc)}${Math.abs(r.pc)} %`:''}</span></div>`;}).join('');
  const rd=op?zsum(z,W):'';
  return `<div class="zb">${rows}</div>${rd?`<p class="zt">${rd}</p>`:''}`;

// UI-29 (v0.6.7) : étiquettes de nom sans chevauchement. Fonction pure (aucune mesure du navigateur : largeur estimée par caractère, en unités du SVG).
// Chaque étiquette choisit sa place : sous le jeton, au-dessus, à droite, à gauche, avec le nom entier puis raccourci à 3 puis 2 lettres.

function sphereLabelPos(spec,lay){

  ['h','a'].forEach(sd=>{const t=spec[sd];if(!t)return;t.slots.forEach((s,i)=>{const c=lay[sd][i];T.push({sd,i,x:SPH.C+c.x*SPH.R,y:SPH.C+c.y*SPH.R,nm:String(t.names[i])});});});

    T.forEach(o=>{if(o===k)return;const nx=Math.max(r.x0,Math.min(o.x,r.x1)),ny=Math.max(r.y0,Math.min(o.y,r.y1));const d=Math.hypot(o.x-nx,o.y-ny);if(d<SPH.TR+2.6)p+=BIG+(SPH.TR+2.6-d)*10;});return p;}));

function clockText(M){

// ---- v0.6-dev5 (MAT-02) ; v0.6.4 (MAT-04) : consignes en direct, en pause ----
// L'interface lit M[sd].half / .until / .blocs (jamais G) ; réserve de HALF_BLOCS blocs de HALF_BLOC phases ; effets × HALF_POWER (0 : « effet désactivé »).
const HICO={souffler:'≈',verrouiller:'▣',pousser:'▶'};
const HLINE={D:['défense','defence'],A:['attaque','attack']};
const hPct=v=>pctTxt(v).replace(' ','\u00a0');
const SOUF_SHOW=3;   // Souffler est instantané : halo et pastille restent SOUF_SHOW phases (état d'interface UI.live.souf, jamais sauvegardé)
const blocTxt=b=>L(`${b} bloc${b>1?'s':''}`,`${b} block${b>1?'s':''}`);
const phaseTxt=n=>`${n} phase${n>1?'s':''}`;
// blocs proposables au camp sd à la phase courante : réserve et fin du match (même borne que applyHalf)
const hMax=(M,sd)=>Math.max(0,Math.min(M[sd].blocs,Math.ceil((36-M.n)/HALF_BLOC)));
const hBlocs=(Lv,mx)=>Math.max(1,Math.min(Lv.hb||1,mx));
const soufOn=(M,sd)=>{const Lv=UI.live,t=Lv&&Lv.M===M&&Lv.souf?Lv.souf[sd]:null;return t!=null&&M.n>=t&&M.n-t<SOUF_SHOW;};
// effet chiffré d'une consigne de b blocs (sans b : 3 blocs, la mi-temps v0.6) ; HALF_POWER = 0 → « effet désactivé »
function halfEffect(o,b){
  const pw=HALF_POWER,f=(b||HALF_BLOCS)/HALF_BLOCS;
  if(!(pw>0))return L('effet désactivé','effect off');
  if(!o.line)return L(`${hPct(HALF_REST*pw*f)} de HP à tous les titulaires`,`${hPct(HALF_REST*pw*f)} HP for all starters`);
  const oth=['D','M','A'].filter(x=>x!==o.line).map(x=>({D:['défense','defence'],M:['milieu','midfield'],A:['attaque','attack']}[x]));
  return L(`${hPct(HALF_K*pw)} ${HLINE[o.line][0]}, ${hPct(-HALF_OFF*pw)} ${oth[0][0]} et ${oth[1][0]}, ${hPct(-HALF_COST*pw*f)} de HP en ${HLINE[o.line][0]}`,`${hPct(HALF_K*pw)} ${HLINE[o.line][1]}, ${hPct(-HALF_OFF*pw)} ${oth[0][1]} and ${oth[1][1]}, ${hPct(-HALF_COST*pw*f)} HP in ${HLINE[o.line][1]}`);
}
const halfName=id=>{const o=id&&halfOpt(id);return o?P(o.n):L('Aucune','None');};
// pastilles d'un camp : consigne de ligne active (« Pousser · encore 4 phases ») et Souffler récent (« Souffler · instantané »)
function halfChips(Lv,sd){
  const M=Lv.M,s=M[sd],id=halfNow(s,M.n),sh=esc(s.team.short),out=[];
  const chip=(ico,txt)=>`<span class="hchip"><b>${sh}</b> <i aria-hidden="true">${ico}</i>${txt}</span>`;
  if(id){const k=s.until-M.n;out.push(chip(HICO[id],`${esc(halfName(id))} · ${L(`encore ${phaseTxt(k)}`,`${phaseTxt(k)} left`)}`));}
  if(soufOn(M,sd))out.push(chip(HICO.souffler,`${esc(halfName('souffler'))} · ${L('instantané','instant')}`));
  return out;
}

// UI-15 : barre de niveau (fait / gagné hachuré) + chiffres secondaires ; p.lvl et p.xp sont déjà ceux d'après le match
function xpCell(r){
  const p=r.p,gain=r.xp+(r.tx||0),max=p.lvl>=MAXLVL,need=xpNeed(p.lvl),after=max?need:p.xp;
  const before=max?need:r.ups?0:Math.max(0,after-gain);
  const w0=Math.min(100,before/need*100),w1=Math.min(100-w0,(after-before)/need*100);
  const pts=r.ups?r.ups*(p.age<=23?3:2):0;
  const pill=r.ups?`<span class="lvup"><i aria-hidden="true">▲</i>${L('Niv.','Lvl')} ${p.lvl-r.ups} → ${p.lvl}</span>`:'';
  const lab=L(`+${gain} XP, niveau ${p.lvl}${max?' (max)':`, ${after}/${need}`}`,`+${gain} XP, level ${p.lvl}${max?' (max)':`, ${after}/${need}`}`);
  const gn=(r.gain||[]),gtxt=gn.map(g=>`+${g.d} ${SL[g.s]}`).join(', ');
  const gp=`<span class="xpg">${gn.map(g=>`<span class="gpill" title="${esc(P(STATN[g.s]))}" aria-label="${esc(`+${g.d} ${P(STATN[g.s])}`)}">+${g.d} ${SL[g.s]}</span>`).join('')}</span>`;   // emplacement toujours présent : les barres d'XP restent alignées d'une ligne à l'autre
  return `<div class="xpc" role="group" aria-label="${esc(lab+(gtxt?', '+L('entraînement','training')+' '+gtxt:''))}"><div class="xpr"><div class="xpb"><i class="x0" style="width:${w0}%"></i><i class="x1" style="width:${w1}%"></i></div>${gp}</div><div class="xpn"><b class="mono">+${gain} XP</b>${pill}<span class="muted mono">${L('Niv.','Lvl')} ${p.lvl}${max?' max':` · ${after}/${need}`}${pts?` · +${pts} pts`:''}${r.tx?` · ${L('dont','incl.')} +${r.tx} ${L('entr.','trn.')}`:''}</span></div></div>`;
}
// UI-47 (v0.6.10) : barre de HP du bilan = HP de fin (plein) + segment hachuré de la récupération attendue (même grammaire que le segment d'XP) ; texte « 96 → 138/160 », « Pleine forme » si full.

// Les panneaux sont DÉPLACÉS (appendChild), jamais clonés : ids stables (score, clock, bloc, banner, p-{sd}-{i}…) que updateLive trouve par id ; un repère caché .fsph garde leur place sur la page.

const fsBtn=k=>`<button class="btn fsbtn" data-a="fsopen" data-k="${k}" aria-label="${L('Sphère en plein écran','Full-screen Sphere')}" title="${L('Plein écran','Full screen')}">⤢</button>`;

    :`<h3>${L('Composition','Line-up')}</h3><b class="qtl">${L('Formation','Formation')}</b><div id="fs-a"></div><div id="fs-b"></div><div id="fs-c"></div><h3>${L('Tactique','Tactics')}</h3><b class="qtl">${L('Style de jeu','Playstyle')}</b><div id="fs-d"></div><b class="qtl">Pressing</b><div id="fs-e"></div><div id="fs-f" class="fszb"></div>`;

function fsMount(){

function fsUnmount(){const F=UI.fs;if(!F)return;F.mv.forEach(({ph,el})=>{if(ph.isConnected)ph.replaceWith(el);else el.remove();});F.mv=[];}
function fsDrop(){const F=UI.fs;if(!F)return;F.mv.forEach(({el})=>el.remove());F.mv=[];}
function openFS(k){
  if(UI.fs||!FSQ.matches||!G||UI.scr!=='game')return;

function fsTab(e){
