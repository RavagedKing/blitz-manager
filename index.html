// UI-24 : résultat net d'un match du club selon l'issue (won) et le lieu (home), avec les installations et salaires actuels.
// Source unique du bilan d'après-match (makeReport) et du tableau de bord (prévision) : seule la prime de victoire dépend de won.
// home : par défaut le prochain match ; fee : programmes individuels (par défaut indivFee actuel, makeReport passe la valeur calculée avant le match).
function netIf(won,home,fee){
  const u=U();
  if(home==null){const fx=todayFx();home=fx[0]===u.id;}
  if(fee==null)fee=indivFee(u);
  const sponsor=sponsorOf(G),gate=gateOf(G,home),conc=concOf(G,home),upk=upkeepOf(G),bonus=won?1500:0,wages=sum(u.players.map(p=>p.wage)),staff=800;
  return{sponsor,gate,conc,bonus,wages,staff,train:fee,upk,net:sponsor+gate+conc+bonus-wages-staff-fee-upk};
}
function makeReport(Lv){
  const u=U(),res=Lv.res,won=res.winner===Lv.userSide,home=Lv.userSide==='h';
  const hpEnd={};u.players.forEach(p=>{hpEnd[p.id]=p.hp;});
  const fee=indivFee(u),nIndiv=u.players.filter(p=>p.train&&!p.inj).length;
  const rows=awardTeam(G,u,won,false).map(r=>({...r,hpEnd:hpEnd[r.p.id]}));
  const before={};u.players.forEach(p=>{before[p.id]=Object.assign({},p.stats);});   // UI-23 : copie des stats avant trainGain (moteur non touché)
  const tg=trainGain(G,u);
  rows.forEach(r=>{const b=before[r.p.id];r.gain=b?STATS.filter(k=>r.p.stats[k]>b[k]).map(k=>({s:k,d:r.p.stats[k]-b[k]})):[];});
  const {sponsor,gate,conc,upk,bonus,wages,staff,net}=netIf(won,home,fee);   // UI-24 : même fonction que le tableau de bord
  G.cash+=net;G.fans=clamp(G.fans+fanDelta(G,won),300,6000);
  const fin={sponsor,gate,conc,bonus,wages,staff,train:fee,upk,net,bal:G.cash};
  G.finLog.unshift({s:G.season,d:G.day+1,...fin});G.finLog=G.finLog.slice(0,28);
  const rm=recordMatch(G,res,Lv.userSide);
  Lv.rep={rows,tg,fin,badges:rm.badges,nIndiv,cxp:rm.xp,clvl:rm.lvl,up:rm.up,newForms:rm.newForms};
}
function completeDay(Lv){
  const u=U(),day=G.day,out=[];
  logM(Lv.M);   // TEC-10 : match du club, après finalizeMatch (direct ou simulation rapide) et avant G.day++ ; lecture seule
  G.schedule[day].forEach(([h,a])=>{
    const mine=h===u.id||a===u.id;
    const res=mine?Lv.res:simFixture(G,h,a).res;
    applyResult(G,h,a,res);
    out.push({h,a,hs:res.hs,as:res.as,ot:res.ot,so:res.so});
    res.inj.forEach(i=>{if(i.tid===u.id)news(L(`${i.name} se blesse (${i.n} journée${i.n>1?'s':''}).`,`${i.name} is injured (${i.n} matchday${i.n>1?'s':''}).`),'effectif',1);});
  });
  G.results[day]=out;
  const res=Lv.res,home=Lv.userSide==='h',won=res.winner===Lv.userSide;
  const opp=Lv.M[home?'a':'h'].team;
  news(L(`${won?'Victoire':'Défaite'} ${res.hs}–${res.as}${res.ot?' (prol.)':''} ${home?'contre':'à'} ${opp.short}. Résultat net : ${signed(Lv.rep.fin.net)} gils.${res.mvp?` Meilleure note : ${res.mvp.name}.`:''}`,`${won?'Win':'Loss'} ${res.hs}–${res.as}${res.ot?' (OT)':''} ${home?'vs':'at'} ${opp.short}. Net result: ${signed(Lv.rep.fin.net)} gil.${res.mvp?` Top rating: ${res.mvp.name}.`:''}`),'match');
  const ups=Lv.rep.rows.filter(r=>r.ups>0);
  if(ups.length)news(L('Niveau supérieur : ','Level up: ')+ups.slice(0,4).map(r=>`${r.p.name} (${L('niv','lvl')} ${r.p.lvl})`).join(', ')+(ups.length>4?` (+${ups.length-4})`:'')+'.','effectif');
  if(Lv.rep.tg.length)news(L('Entraînement : ','Training: ')+Lv.rep.tg.slice(0,4).join(', ')+'.','effectif');
  if(Lv.rep.up)news(L(`Niveau d’entraîneur ${Lv.rep.clvl}`,`Coach level ${Lv.rep.clvl}`)+(Lv.rep.newForms.length?' : '+Lv.rep.newForms.join(', ')+'.':'.'),'club');
  Lv.rep.badges.forEach(b=>news(L('Badge obtenu : ','Badge earned: ')+P(b.n)+'.','club'));
  afterDay(G);
  {const f0=G.finLog[0],f1=G.finLog[1];if(f0&&f0.bal<0&&!(f1&&f1.bal<0))news(L('Budget négatif : les recrutements sont bloqués.','Negative budget: signings are blocked.'),'finances',1);}
  G.day++;
  logD();   // TEC-10 : état du jour, après G.day++
  if(marketDue(G))G.market=genMarket(G);
  ensureLineup(u);
  checkBadges(G,{});
  UI.live=null;UI.tab='home';UI.resDay=null;
  save();render();window.scrollTo(0,0);
  if(G.cash<0)toast(L('Budget négatif : les recrutements sont bloqués.','Negative budget: signings are blocked.'),true);
}
function endSeasonUI(){
  const st=sortedTable(G),u=U(),rank=st.findIndex(r=>r.id===u.id)+1,me=G.table[u.id];
  G.cash+=PRIZES[rank-1];
  G.honors.push({s:G.season,rank,pts:me.pts,w:me.w,l:me.l+me.otl,gf:me.gf,ga:me.ga,champ:G.teams[st[0].id].name});
  G.coach.seasons++;
  const nb=checkBadges(G,{});
  stampNews();
  logS();   // TEC-10 : bilan de la saison, avant newSeason
  const retired=newSeason(G);
  news(L(`Saison ${G.season} lancée. Prime de fin de saison : ${fmt(PRIZES[rank-1])} gils (${rankTxt(rank)}).`,`Season ${G.season} started. End-of-season prize: ${fmt(PRIZES[rank-1])} gil (${rankTxt(rank)}).`),'club');
  if(retired.length)news(L(`Retraite : ${retired.join(', ')}. Des jeunes espoirs les remplacent.`,`Retired: ${retired.join(', ')}. Young prospects take their place.`),'club');
  nb.forEach(b=>news(L('Badge obtenu : ','Badge earned: ')+P(b.n)+'.','club'));
  UI.tab='home';UI.live=null;save();render();
}

    case 'rtab':UI.rtab=d.v;render();break;
    case 'gorules':pauseLive();UI.rtab=d.v;UI.tab='rules';UI.last.options='rules';render();window.scrollTo(0,0);break;

    case 'sortdir':{if(d.w==='m')UI.mdir=-UI.mdir;else UI.sdir=-UI.sdir;render();break;}
    case 'upfac':{const r=upgradeFac(G,d.k);if(r==='ok'){news(L(`Stade : ${P(FACD[d.k].n)} niveau ${G.stadium.lv[d.k]}.`,`Stadium: ${P(FACD[d.k].n)} level ${G.stadium.lv[d.k]}.`),'club');checkBadges(G,{});save();render();toast(L('Installation améliorée.','Facility upgraded.'));}else toast(r==='cash'?L('Budget insuffisant.','Not enough budget.'):L('Niveau maximum.','Maximum level.'),true);break;}

    case 'plsave':{
      const i=+d.i;if(UI.live)break;

      else toast(L('Huit de départ incomplet.','Starting eight incomplete.'),true);
      break;}
    case 'plsaveok':{
      const i=+d.i,ok=UI.confirm==='plan:save:'+i&&!UI.live&&presetSave(G,i);
      UI.confirm=null;if(ok)save();render();toast(ok?L(`${plRef(i)} remplacé.`,`${plRef(i)} replaced.`):L('Huit de départ incomplet.','Starting eight incomplete.'),!ok);break;}
    case 'plren':{
      const i=+d.i;if(UI.live||!plPre(i))break;
      UI.confirm='plan:ren:'+i;render();{const e=document.getElementById('plan-name');if(e){e.focus();e.select();}}break;}
    case 'plrenok':{
      const i=+d.i;if(UI.confirm!=='plan:ren:'+i||UI.live)break;
      const e=document.getElementById('plan-name');presetRename(G,i,e?e.value:'');UI.confirm=null;save();render();toast(L(`${plRef(i)} renommé.`,`${plRef(i)} renamed.`));break;}
    case 'plclear':{const i=+d.i;if(UI.live||!plPre(i))break;UI.confirm='plan:clear:'+i;render();break;}
    case 'plclearok':{
      const i=+d.i;if(UI.confirm!=='plan:clear:'+i||UI.live)break;

    case 'resday':{const cur=UI.resDay==null?Math.max(0,G.results.length-1):UI.resDay;UI.resDay=clamp(cur+(+d.d),0,G.schedule.length-1);render();break;}
    case 'play':startLive();break;
    case 'mode':setMode(d.v);break;
    case 'trpick':if(UI.mode==='training'&&!UI.live&&G.teams[+d.id]&&+d.id!==G.userId){UI.tr.opp=+d.id;render();const b=app.querySelector(`[data-a=trpick][data-id="${+d.id}"]`);if(b)b.focus();}break;

    case 'trchg':trainStage('pick');break;
    case 'trback':act('tab',{t:UI.last.jouer||'match'});break;
    case 'bell':toggleBell();break;
    case 'sim':quickSim();break;
    case 'pause':{
      const Lv=UI.live,M=Lv.M;
      if(M.status==='half'){resolveHalf(Lv,false);M.status='play';Lv.paused=false;}else Lv.paused=!Lv.paused;
      if(!Lv.paused)Lv.halfPick=null;   // une consigne sélectionnée mais pas activée n'est pas appliquée à la reprise
      updateLive();nextTick();break;}
    case 'half':{const Lv=UI.live;if(!Lv||Lv.done||!Lv.paused||Lv.M.over||Lv.M.ot||!halfOpt(d.v))break;Lv.halfPick=Lv.halfPick===d.v?null:d.v;updateLive();break;}
    case 'fsopen':openFS(d.k);break;
    case 'fsclose':closeFS();break;
    case 'fsconsigne':{const Lv=UI.live;if(!Lv||Lv.done||Lv.M.over||Lv.M.ot)break;Lv.paused=true;stopTimer();Lv.fsh=true;updateLive();const o=document.querySelector('#halfpanel .hopt');if(o)o.focus();break;}
    case 'hq':{const Lv=UI.live;if(!Lv||Lv.done)break;Lv.hq=!Lv.hq;halfRecap(Lv);break;}
    case 'hb':{const Lv=UI.live;if(!Lv||Lv.done||!Lv.paused)break;Lv.hb=+d.v;updateLive();break;}
    case 'hgo':{
      const Lv=UI.live;if(!Lv||Lv.done||!Lv.paused||!Lv.halfPick)break;
      const M=Lv.M,u=Lv.userSide,mx=hMax(M,u);
      if(mx>=1&&applyHalfUI(Lv,u,Lv.halfPick,hBlocs(Lv,mx)))Lv.halfPick=null;
      updateLive();break;}
    case 'speed':{UI.live.speed=+d.v;document.querySelectorAll('[data-a="speed"]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===UI.live.speed)));nextTick();break;}
    case 'skip':{
      const Lv=UI.live,M=Lv.M;stopTimer();
      const opp=Lv.userSide==='h'?M.a:M.h,me=M[Lv.userSide];
      if(M.status==='half'){aiSubs(opp);aiSubs(me);resolveHalf(Lv,true);M.status='play';}
      while(!M.over){liveAI(Lv,'h');liveAI(Lv,'a');phase(M);if(M.status==='half'){aiSubs(opp);aiSubs(me);resolveHalf(Lv,true);M.status='play';}if(M.n===27&&!M.ot){aiSubs(opp);aiSubs(me);}}
      finishLive();break;}
    case 'lstyle':{const Lv=UI.live;Lv.M[Lv.userSide].style=d.v;if(!Lv.train)U().style=d.v;document.querySelectorAll('[data-a="lstyle"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===d.v)));break;}
    case 'lpress':{const Lv=UI.live;Lv.M[Lv.userSide].press=+d.v;if(!Lv.train)U().press=+d.v;document.querySelectorAll('[data-a="lpress"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===d.v)));break;}
    case 'subopen':{const Lv=UI.live;Lv.paused=true;stopTimer();Lv.subSlot=+d.i;updateLive();break;}
    case 'subclose':UI.live.subSlot=null;updateLive();break;
    case 'dosub':{
      const Lv=UI.live,M=Lv.M,side=M[Lv.userSide],b=side.bench.find(x=>x.id===+d.id);

    case 'duel':{const Lv=UI.live;if(!Lv)break;const o=Lv.open||(Lv.open=new Set()),i=+d.i;if(o.has(i))o.delete(i);else o.add(i);refreshFeed();break;}
    case 'cont':completeDay(UI.live);break;
    case 'endseason':endSeasonUI();break;
  }
  if(UI.dlg&&UI.dlg.k==='psheet')syncSheet();
}

    case 'sname':{G.stadium.name=el.value.trim().slice(0,30);save();render();break;}

    case 'impfile':{const f=el.files&&el.files[0];el.value='';if(f)readImport(f);break;}
    case 'xptxt':UI.xptxt=el.value;break;
    case 'pname':{const tm=u||G.teams[UI.prev];const p=tm&&tm.players.find(x=>x.id===+el.dataset.id),v=el.value.trim();if(p&&v)p.name=v.slice(0,22);if(G.started)save();if(UI.scr==='flow'){if(p)el.value=p.name;}else render();break;}

});
