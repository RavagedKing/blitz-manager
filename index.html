body=`<div class="grid2">${sec('Saison','Season',li([L('8 clubs en matchs aller-retour : 14 journées.','8 clubs, home and away: 14 matchdays.'),L('Victoire 3 points ; victoire en prolongation 2 ; défaite en prolongation 1 ; défaite 0.','Win 3 points; overtime win 2; overtime loss 1; loss 0.'),L(`Prime de fin de saison de ${fmt(PRIZES[0])} gils (champion) à ${fmt(PRIZES[PRIZES.length-1])} (dernier).`,`End-of-season prize from ${fmt(PRIZES[0])} gil (champions) to ${fmt(PRIZES[PRIZES.length-1])} (last).`),L('À chaque nouvelle saison, les joueurs vieillissent d’un an ; à 35 ans ils prennent leur retraite et un jeune les remplace. Dès 30 ans, les stats déclinent légèrement.','Every new season players age a year; at 35 they retire and a youngster replaces them. From 30, stats decline slightly.')]))}
    ${sec('Match','Match',li([L(`Huit joueurs par équipe : un gardien et sept joueurs de champ selon la formation. Effectif de ${SQUAD_MIN} à ${SQUAD_MAX} joueurs (${SQUAD_START.length} au départ), banc de ${SQUAD_START.length-slotsOf(FORM_DEFAULT).length}.`,`Eight players a side: one keeper and seven outfield players depending on the formation. Squad of ${SQUAD_MIN} to ${SQUAD_MAX} players (${SQUAD_START.length} at the start), a bench of ${SQUAD_START.length-slotsOf(FORM_DEFAULT).length}.`),L('Deux périodes de cinq minutes (36 phases). En cas d’égalité : mort subite, puis départage.','Two five-minute halves (36 phases). If level: sudden death, then a tiebreak.'),L('Chaque phase : possession, portée du ballon (AT contre PH), jusqu’à deux passes (PS contre IN), tir (TI contre IN) puis arrêt (AR).','Each phase: possession, carrying the ball (AT vs PH), up to two passes (PS vs IN), a shot (TI vs IN), then a save (AR).'),L('Trois remplacements par match, à la mi-temps ou en direct.','Three substitutions per match, at half-time or live.'),L(`Sphère : chaque club a sa forme de jeton. Le contour montre les HP : trait plein au-dessus de ${pp(HP_TIRED)}, tirets jusqu’à ${pp(HP_WARN+.01)}, pointillé à ${pp(HP_WARN)} et moins.`,`Sphere: each club has its own marker shape. The outline shows HP: solid line above ${pp(HP_TIRED)}, dashes down to ${pp(HP_WARN+.01)}, dots at ${pp(HP_WARN)} and below.`),...(MERCY>0?[L(`Écart de ${MERCY} buts : en temps réglementaire, le match s’arrête dès que l’écart atteint ${MERCY} buts. Le score est conservé et la victoire vaut 3 points ; ni prolongation ni tirs au but.`,`${MERCY}-goal gap: in regulation time the match stops as soon as the gap reaches ${MERCY} goals. The score stands and the win is worth 3 points; no overtime or penalty shoot-out.`)]:[]),...(LONE_FW>1?[L(`Un attaquant seul en pointe reçoit +${Math.round((LONE_FW-1)*100)} % sur toutes ses caractéristiques.`,`A lone forward gets +${Math.round((LONE_FW-1)*100)}% on all of their stats.`)]:[]),L('Trois consignes, données en pause à tout moment du match, mi-temps comprise : Souffler, Verrouiller, Pousser. Une réserve de 3 blocs de 6 phases par match à répartir entre elles (1 à 3 blocs par consigne, dans la limite de la fin du match). Souffler est instantané ; Verrouiller et Pousser durent leurs blocs, une seule à la fois : en changer fait perdre les phases restantes. Impossible en prolongation. Souffler rend des HP à tous les titulaires ; Verrouiller renforce la défense et affaiblit le milieu et l’attaque ; Pousser renforce l’attaque et affaiblit la défense et le milieu ; les joueurs de la ligne visée perdent des HP. L’adversaire en donne aussi.'+(HALF_POWER>0?'':' Leurs effets sont provisoirement désactivés, le temps du rééquilibrage.'),'Three instructions, given while paused at any point in the match, half-time included: Catch breath, Lock down, Push forward. A reserve of 3 blocks of 6 phases per match to spend on them (1 to 3 blocks per instruction, within what is left of the match). Catch breath is instant; Lock down and Push forward last for their blocks, one at a time: switching loses the remaining phases. Not possible in overtime. Catch breath gives all starters HP back; Lock down boosts defence and weakens midfield and attack; Push forward boosts attack and weakens defence and midfield; the players of the targeted line lose HP. The opponent gives instructions too.'+(HALF_POWER>0?'':' Their effects are temporarily switched off until the game is rebalanced.')),L('En direct, chaque phase du fil se déplie pour montrer ses duels : stats comparées, probabilité du tacle, facteurs (style, pressing, poste, trait, HP). Vert : favorable à ton équipe ; rouge : défavorable ; ✓ ou ✗ : l’action de celui qui la tente réussit ou non.','Live, every feed phase unfolds to show its duels: compared stats, tackle probability, factors (style, pressing, position, trait, HP). Green: good for your team; red: bad for it; ✓ or ✗: the action succeeds or fails for the player attempting it.'),L(`Infos de match : possession cumulée et sur les 6 dernières phases ; la jauge de HP de tes joueurs passe de en forme à fatigué (${pp(HP_TIRED)} des HP ou moins), très fatigué (${pp(HP_WARN)} ou moins) puis épuisé (moins de ${HP_LOW} HP) ; un bandeau et le fil signalent chaque joueur qui passe épuisé.`,`Match info: total possession and possession over the last 6 phases; your players’ HP gauge goes from fresh to tired (${pp(HP_TIRED)} of HP or less), very tired (${pp(HP_WARN)} or less) then spent (under ${HP_LOW} HP); a banner and the feed flag every player who becomes spent.`),L('La Sphère est ronde : le club qui reçoit joue vers la droite, le visiteur vers la gauche. Une consigne de ligne colore la ligne visée (bande hachurée et symbole) tant qu’elle dure ; Souffler entoure brièvement tous les titulaires d’un halo. Seul le dessin change : aucune distance ne compte dans les duels.','The Sphere is round: the home club attacks to the right, the visitor to the left. A line instruction marks the targeted line (hatched band and symbol) while it lasts; Catch breath briefly puts a halo around all starters. Only the picture changes: no distance counts in the duels.'),L('Dimensions de convention : terrain de 100 m de diamètre (rayon 50 m), ballon de 0,3 m, buts triangulaires de 6 m (dessinés environ 2,5 fois plus grands pour rester lisibles).','Game convention: an arena 100 m across (50 m radius), a 0.3 m ball, triangular goals 6 m wide (drawn about 2.5 times larger to stay readable).'),L('Dans un duel de passe, la phrase nomme le passeur, le receveur et le défenseur qui gêne : passe sans gêne, passe affaiblie, interception ou passe qui s’éteint.','In a pass duel, the sentence names the passer, the receiver and the defender who hampers it: clean pass, weakened pass, interception or a pass that fades out.'),L('Avant le coup d’envoi, « Tactique rapide » règle le style, le pressing et la formation ; le détail est dans Effectif › Tactique. Changer de formation refait les huit de départ en automatique.','Before kick-off, “Quick tactics” sets style, pressing and formation; details are in Squad › Tactics. Changing formation resets the starting eight to automatic.')]))}</div>
    ${sec('Match d’entraînement','Training match',li([L('Jouer › Entraînement : un match contre l’un des sept autres clubs, présélection = le plus proche en force. Les deux équipes partent à HP maximum ; le bonus d’entraîneur s’applique.','Play › Training: a match against any of the seven other clubs, preselected = the closest in strength. Both teams start at full HP; the coach bonus applies.'),L('Bac à sable : aucun effet sur la saison (classement, stats, XP, HP, blessures, finances, journal) ni sur ta composition. Les réglages faits pendant le match sont jetés.','Sandbox: no effect on the season (table, stats, XP, HP, injuries, finances, journal) or on your lineup. Changes made during the match are discarded.'),L('Quitter, changer d’onglet ou de section ferme le match sans confirmation.','Leaving, or switching tab or section, closes the match without asking.')]))}
    ${sec('Journal de test','Test log',li([L('Un journal de test s’enregistre sur cet appareil, actif par défaut (Options › Paramètres) : il aide à signaler un problème ou à régler l’équilibrage. Rien n’est envoyé : tu l’exportes ou le copies toi-même. Il ne change rien au jeu.','A test log is recorded on this device, on by default (Options › Settings): it helps report a problem or tune the balance. Nothing is sent: you export or copy it yourself. It changes nothing in the game.'),L('Pour ton club : version, code du club, niveau, puis par match le score, la formation, le style, le pressing, les consignes, les remplacements, les tirs, la possession, les HP de fin et les blessures ; par journée le budget, le public, le niveau moyen, les points de talent non dépensés et le rang ; le bilan de chaque saison ; les matchs d’entraînement (adversaire, score) ; les erreurs du jeu (160 caractères, 20 par partie).','For your club: version, club code, level, then per match the score, formation, style, pressing, instructions, substitutions, shots, possession, end HP and injuries; per matchday the budget, crowd, average level, unspent talent points and rank; each season’s summary; training matches (opponent, score); game errors (160 characters, 20 per game).'),L('Ni noms de joueurs, de clubs ou d’entraîneur, ni textes libres, ni sauvegarde, ni informations sur ton navigateur : les clubs y figurent par leur code.','No player, club or coach names, no free text, no save file, no browser information: clubs appear by their code only.'),L('Taille limitée à 128 Ko : au-delà, les matchs les plus anciens partent d’abord et les bilans de saison restent. Le journal survit à « Nouvelle partie » et au changement de version (une section par partie). « Effacer » le vide, après confirmation. Si le téléchargement est bloqué, utilise Copier.','Size capped at 128 KB: beyond that the oldest matches go first and the season summaries stay. The log survives “New Game” and version changes (one section per game). “Clear” empties it, after confirmation. If downloads are blocked, use Copy.')]))}
    ${sec('Son et musique','Sound and music',li([L('Sifflets et petits jingles pendant un match en direct (coup d’envoi, buts, mi-temps, fin), et une musique de match en option, coupée à la pause. Options › Paramètres : sons, musique, volume, bouton Test. Jamais en simulation rapide.','Whistles and short jingles during a live match (kick-off, goals, half-time, full time), plus optional match music, stopped on pause. Options › Settings: sounds, music, volume, Test button. Never when simulating.')]))}
    ${sec('Fatigue et blessures','Fatigue and injuries',li([L(`Porter le ballon, passer et tirer coûtent des HP ; un joueur qui ne participe pas à l’action en récupère un peu. Sous ${HP_LOW} HP, PS et TI sont divisés par 2.`,`Carrying, passing and shooting cost HP; a player not involved in the action recovers a little. Below ${HP_LOW} HP, PS and TI are halved.`),L('Après chaque journée, tout le monde récupère une partie de ses HP.','After every matchday everyone recovers part of their HP.'),L('Un joueur très fatigué risque davantage de se blesser (1 à 3 journées d’absence).','A very tired player is more likely to get injured (1 to 3 matchdays out).')]))}
    ${sec('Navigation et alertes','Navigation and alerts',li([L('Cinq sections : Tableau de bord, Club, Effectif, Jouer, Options. Sur mobile, la barre du bas les garde sous le pouce, avec Jouer au centre en ambre ; le réglage Options › Paramètres › Navigation mobile la place en haut.','Five sections: Dashboard, Club, Squad, Play, Options. On mobile the bottom bar keeps them under your thumb, with Play in the middle in amber; Options › Settings › Mobile navigation moves it to the top.'),L('Club : Entraîneur, Finances, Fiche du club, Personnalisation, Journal. Effectif : Joueurs, Tactique, Entraînement, Marché. Jouer : Match, Calendrier, Classement.','Club: Coach, Finances, Club sheet, Customisation, Journal. Squad: Players, Tactics, Training, Market. Play: Match, Fixtures, Table.'),L('L’onglet ▶ Jouer est le seul point d’entrée pour jouer : il devient « Prochain match » hors de la section, « Reprendre le match » pendant un direct, « Bilan du match » une fois le match fini et « Fin de saison » quand les 14 journées sont jouées (en jaune plein : une action est attendue).','The ▶ Play tab is the single way in to play: it reads “Next match” from other sections, “Resume the match” during a live match, “Match report” once it is over and “Season over” after the 14 matchdays (solid yellow: an action is expected).'),L(`La cloche en haut à droite liste ce qui reste à faire : titulaire blessé ou à ${pp(HP_TIRED)} de HP ou moins, budget négatif, points de talent à répartir, spécialité d’entraîneur à choisir. Rouge : un titulaire blessé ; ambre : le reste. Le chiffre donne le nombre de lignes.`,`The bell at the top right lists what is left to do: an injured starter or one at ${pp(HP_TIRED)} HP or less, a negative budget, talent points to spend, a coach specialty to pick. Red: an injured starter; amber: the rest. The number is the count of lines.`),L('Tableau de bord : « À faire avant le match » liste ces mêmes alertes, chacune avec son lien ; la fiche de l’adversaire donne son rang, sa forme, sa force par ligne et ses joueurs marquants.','Dashboard: “To do before the match” lists the same alerts, each with its link; the opponent card gives its rank, form, strength by line and standout players.'),L('Club › Journal : les 100 derniers événements, groupés par saison et journée ; les puces filtrent par catégorie (⚠ alertes, match, effectif, marché, club, finances).','Club › Journal: the last 100 events, grouped by season and matchday; the chips filter by category (⚠ alerts, match, squad, market, club, finances).'),L('Options › Paramètres › Simplifiée : l’ancienne interface, sans fond animé ni verre, appelée à disparaître. Par défaut, le fond à bulles est l’interface principale ; « Fond animé » (bulles) se coupe à part et s’arrête si ton appareil demande moins d’animations.','Options › Settings › Simple: the former interface, with no animated background or glass, due to be removed. By default the bubble background is the main interface; “Animated background” (bubbles) switches off separately and stops if your device asks for reduced motion.')]))}
    ${sec('Sauvegarde','Save',li([L('La partie se sauvegarde toute seule dans ce navigateur.','The game saves itself in this browser.'),L('Options › Paramètres : Exporter télécharge un fichier, Copier la sauvegarde copie son texte. Importer lit un fichier, Coller une sauvegarde importe un texte copié. Si le téléchargement est bloqué, utilise Copier et Coller.','Options › Settings: Export downloads a file, Copy save copies its text. Import reads a file, Paste a save imports copied text. If downloads are blocked, use Copy and Paste.')]))}`;
}else if(t==='stats'){
const ex=demoPlayer();
const smp=(c,v,l)=>`<span><span class="st key t${c}" style="width:34px">${v}</span>${l}</span>`;
const wrows=STATS.map((s,i)=>[`<b class="mono" style="color:var(--water)">${SL[s]}</b>`,(()=>{const n=P(STATN[s]),d=P(GLOSS[i][1]);return d.startsWith(n)?`<b>${d.slice(0,n.length)}</b>${d.slice(n.length)}`:`<b>${n}.</b> ${d}`;})(),...['GK','DF','MF','FW'].map(p=>POSW[p][s]?Math.round(POSW[p][s]*100):'–')]);
body=`<div class="grid2"><section class="panel prose"><h3>${L('La fiche d’un joueur','A player sheet')}</h3>
    <p>${L(`Exemple : ${esc(ex.name)}. Le radar à huit branches (un octogone, une branche par caractéristique) montre les stats actuelles en trait plein et le plafond de progression en pointillés ambrés. Un point ambré marque les stats clés du poste.`,`Example: ${esc(ex.name)}. The eight-spoke radar (an octagon, one spoke per stat) shows current stats as a solid line and the progression ceiling dashed in amber. An amber dot marks the role’s key stats.`)}</p>${radar(ex)}</section>
    <section class="panel prose"><h3>${L('Code couleur','Colour code')}</h3>
    <p>${L('Dans les listes, chaque stat est lue selon le poste du joueur.','In the lists, every stat is read according to the player’s position.')}</p>
    <div class="lg"><b>${L('Stat clé du poste','Key stat for the role')}</b>${smp(4,72,L('excellent (72+)','excellent (72+)'))}${smp(3,62,L('bon (62–71)','good (62–71)'))}${smp(2,50,L('correct (50–61)','fair (50–61)'))}${smp(1,40,L('faible (40–49)','weak (40–49)'))}${smp(0,30,L('très faible (< 40)','very weak (< 40)'))}</div>
    <div class="lg"><b>${L('Autres stats','Other stats')}</b><span><span class="st mid t4" style="width:34px">80</span>${L('colorée seulement aux extrêmes','coloured only at the extremes')}</span><span><span class="st low" style="width:34px">45</span>${L('grisée : compte peu pour ce poste','greyed: matters little for this role')}</span></div>
    <div class="lg"><b>${L('Trait','Trait')}</b><span><span class="st key t3 tm-up" style="width:34px">64</span>${L('trait bonus sur cette stat','bonus trait on this stat')}</span><span><span class="st key t2 tm-dn" style="width:34px">52</span>${L('trait malus','penalty trait')}</span></div>
    <div class="lg"><b>${L('Potentiel','Potential')}</b><span><span class="pg pg-S">S</span>≥ 88</span><span><span class="pg pg-A">A</span>80–87</span><span><span class="pg pg-B">B</span>72–79</span><span><span class="pg">C</span>&lt; 72</span></div>
    <div class="lg"><b>${L('Note moyenne','Average rating')}</b><span><span class="av r-hi">7.4</span>≥ 7,2</span><span><span class="av r-ok">6.8</span>≥ 6,5</span><span><span class="av r-lo">6.0</span>≥ 5,8</span><span><span class="av r-bad">5.2</span>&lt; 5,8</span><span><span class="av">6.1</span>${L('neutre avant 3 matchs','neutral before 3 matches')}</span></div>
    <p>${L('La note du joueur est la moyenne de ses stats pondérée par le poste (poids ci-dessous) ; une stat est « clé » quand son poids atteint au moins 60 % du plus fort du poste. Le potentiel fixe le plafond de chaque stat.','A player’s rating is the position-weighted average of their stats (weights below); a stat is “key” when its weight reaches at least 60% of the role’s highest. Potential sets each stat’s ceiling.')}</p></section></div>
    <section class="panel prose"><h3>${L('Les huit caractéristiques et leur poids par poste (%)','The eight stats and their weight by position (%)')}</h3>${tb([[L('Stat','Stat')],[L('Rôle','Role')],['GK','num'],['DF','num'],['MF','num'],['FW','num']],wrows)}</section>`;
}else if(t==='races'){
const wsum=Object.keys(RACES).reduce((a,k)=>a+RACES[k].w,0);
const rnote=k=>{const c=RACE_CAP[k],x=RACE_XP[k];if(!c&&!x)return '';const b=[];if(RACES[k].w/wsum<.07)b.push(L('rares','rare'));if(c)b.push(L(`plafonds ${c>0?'+':'−'}${Math.abs(c)}`,`ceilings ${c>0?'+':'−'}${Math.abs(c)}`));if(x)b.push(`XP ${x<1?'−':'+'}${Math.round(Math.abs(1-x)*100)} %`);return `<br><span class="muted">${b.join(' · ')}</span>`;};
const rows=Object.keys(RACES).map(k=>{const r=RACES[k];return [`<b>${P(r.n)}</b>`,Object.keys(r.m).length?`<span class="mono">${modsHTML(r.m)}</span>`:'–',P(r.d)+rnote(k),`${Math.round(r.w/wsum*100)} %`];});
body=sec('Races','Races',`<p>${L('Chaque joueur a une race qui décale ses stats de départ et ses plafonds de progression. Les noms sont génériques, inspirés des peuples de Spira.','Every player has a race that shifts their starting stats and progression ceilings. The names are generic, inspired by Spira’s peoples.')}</p>`+tb([[L('Race','Race')],[L('Modificateurs','Modifiers')],[L('Profil','Profile')],[L('Fréquence','Frequency'),'num x']],rows));
}else if(t==='tactics'){
const frows=Object.keys(FORMATIONS).map(f=>[`<b class="mono">${f}</b>`,FORM_UNLOCK[f]>1?L(`Niveau d’entraîneur ${FORM_UNLOCK[f]}`,`Coach level ${FORM_UNLOCK[f]}`):L('Disponible','Available')]);
const srows=Object.keys(NAMES).map(k=>[`<b>${nN(k)}</b>`,P(STYLE_DESC[k])]);
const prows=['-1','0','1'].map(k=>[`<b>${pN(k)}</b>`,P(PRESS_DESC[k])]);
const codeRows=['FW','MF','DF'].map(l=>[`<b>${P(LINEN[l])}</b>`,...['G','C','D'].map(sd=>`<b class="mono">${slotCode(l,sd)}</b>`)]);
const pc=pctTxt;
const fitRows=[
[`<span class="fit fit-spe"><b>${P(FITN.spe)}</b></span>`,L('Sur sa ligne et dans sa voie de spécialité.','On their line and in their specialty lane.'),`<b class="mono">${pc(FIT_SPEC)}</b>`],
[`<span class="fit fit-line"><b>${P(FITN.line)}</b></span>`,L('Sur sa ligne, mais dans une autre voie.','On their line, but in another lane.'),`<b class="mono">${pc(FIT_LINE)}</b>`],
[`<span class="fit fit-sec"><b>${P(FITN.sec)}</b></span>`,L('Sur une de ses lignes secondaires (aucun effet de voie).','On one of their secondary lines (no lane effect).'),`<b class="mono">${pc(FIT_SEC)}</b>`],
[`<span class="fit fit-off"><b>${P(FITN.off)}</b></span>`,L('Sur toute autre ligne.','On any other line.'),`<b class="mono">${pc(FIT_OFF)}</b>`],
[`<span class="fit fit-spe"><b>${L('Gardien','Keeper')}</b></span>`,L('Gardien dans son but.','Keeper in goal.'),`<b class="mono">${pc(FIT_GK)}</b>`]
];
const tkeys=Object.keys(TRAITS),tcol=ks=>ks.map(id=>[traitChip(id),`<span class="mono">${TRAITS[id].v>0?'+':'−'}${Math.abs(TRAITS[id].v)} ${SL[TRAITS[id].s]}</span>${TRAITS[id].gk?' · '+L('gardiens','keepers'):''}`]);
const traitRows=[...tcol(tkeys.filter(k=>TRAITS[k].v>0)),...tcol(tkeys.filter(k=>TRAITS[k].v<0))];
body=`<div class="grid2">${sec('Postes','Positions',li([L('Quatre lignes : gardien, défense, milieu, attaque. Un joueur a une ligne et une spécialité de voie (gauche, centre ou droite) : son poste est la paire des deux, soit neuf postes de champ et le gardien.','Four lines: keeper, defence, midfield, attack. A player has a line and a lane specialty (left, centre or right): their position is the pair, giving nine outfield positions plus the keeper.'),L('La voie de chaque poste est imposée par la formation : seul sur sa ligne, il joue au centre ; à deux, à gauche et à droite ; à trois, à gauche, au centre et à droite. Il n’y a rien à régler.','The formation sets each position’s lane: alone on their line they play centre; two play left and right; three play left, centre and right. Nothing to set.'),L('Postes secondaires (jusqu’à deux lignes) : défenseur → milieu ; milieu → défenseur ou attaquant ; attaquant → milieu. Le gardien n’en a pas.','Secondary lines (up to two): defender → midfielder; midfielder → defender or forward; forward → midfielder. Keepers have none.'),L(`Le poste s’affiche par son code ; l’infobulle donne le détail (« Attaquant · spécialité droite »). Gardien : ${slotCode('GK')}.`,`A position shows as its code; the tooltip gives the detail (“Forward · right specialty”). Keeper: ${slotCode('GK')}.`)])+tb([[L('Ligne','Line')],[L('Gauche','Left')],[L('Centre','Centre')],[L('Droite','Right')]],codeRows,'gridcodes'))}
    ${sec('Adéquation au poste','Position fit',tb([[L('Palier','Tier')],[L('Situation','Situation')],[L('Effet','Effect'),'num']],fitRows)+li([L('Le même multiplicateur s’applique à la note affichée en composition et aux caractéristiques en match.','The same multiplier applies to the rating shown in the line-up and to stats in a match.'),L('Un joueur de champ au but, ou un gardien sur le terrain, est hors ligne.','An outfield player in goal, or a keeper on the pitch, is out of line.'),L('La composition automatique privilégie la ligne naturelle de chaque poste.','The automatic line-up favours the natural line of each position.')]))}</div>
    <div class="grid2">${sec('Traits','Traits',li([L(`Chaque joueur a un trait bonus ; ${Math.round(TRAIT_MALUS_P*100)} % ont en plus un trait malus. Un trait modifie une caractéristique de ±2, avant les multiplicateurs (adéquation, bonus d’entraîneur). Les traits de HP changent les HP maximum.`,`Every player has a bonus trait; ${Math.round(TRAIT_MALUS_P*100)}% also have a penalty trait. A trait changes one stat by ±2, before the multipliers (fit, coach bonus). HP traits change maximum HP.`)])+tb([[L('Trait','Trait')],[L('Effet','Effect')]],traitRows))}
    ${sec('Compositions','Formations',tb([[L('Formation (déf · mil · att)','Formation (def · mid · att)')],[L('Déblocage','Unlock')]],frows)+`<p>${L('Les compositions se débloquent avec le niveau d’entraîneur (Club › Entraîneur). Maîtrise : chaque tranche de 5 matchs joués dans une composition ajoute une étoile ★ (4 au maximum) et +0,5 % sur toutes les stats de tes joueurs tant que tu l’utilises.','Formations unlock with coach level (Club › Coach). Mastery: every 5 matches played in a formation add a star ★ (4 at most) and +0.5% on all your players’ stats while you use it.')}</p>`)}</div>
    ${sec('Style et pressing','Style and pressing',tb([[L('Style','Style')],[L('Effet','Effect')]],srows)+tb([['Pressing'],[L('Effet','Effect')]],prows))}
