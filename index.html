/* Concept : un tableau de bord de club lu comme l'écran d'une arène sous-marine.
   Cinq sections (UI-12a) : Accueil, Club, Effectif, Jouer, Options ; barre du bas sur mobile.
   Eau verre de mer le jour, abysses la nuit, ballon ambré comme seul point chaud. */
:root{
  --bg:#E4EFEE; --surface:#F5FAF9; --surface2:#D6E6E4; --ink:#0A2830; --muted:#40616A; --line:#B5CFCC;
  --water:#0B7480; --water-soft:rgba(11,116,128,.12); --on-water:#FFFFFF;
  --ball:#E0910F; --ball-ink:#1B1100; --on-bad:#FFFFFF; --on-good:#FFFFFF; --on-warn:#FFFFFF; --warn-fill:#946300;
  --good:#1C8450; --warn:#A8710A; --bad:#C0412C; --ball-bar:var(--warn-fill);
  --p-gk:#775200; --p-df:#1F5FA8; --p-mf:#096470; --p-fw:#A8372A;
  --font-display:'Square 721',system-ui,'Segoe UI Symbol',sans-serif;
  --font-body:'Square 721',system-ui,'Segoe UI Symbol',sans-serif;
  --font-cond:'Square 721 Cond','Square 721',system-ui,'Segoe UI Symbol',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;   /* UI-89 : Plex Mono conservée */
}
:root{font-synthesis:none}
/* UI-61 · mode Alt : trois blocs de variables (jour ici, nuit manuel et nuit auto après les blocs sombres). Le bloc jour précède les blocs sombres, qui l'emportent
   sur tout ce qu'ils redéfinissent ; les blocs nuit redéfinissent tous les --alt-*. Règle : alpha des blocs ≥ 0,70 le jour, ≥ 0,62 la nuit (tests/ui61-alt.js). */
:root[data-alt]{
  --alt-sky-1:#BFE9F5; --alt-sky-2:#6CC1DC; --alt-sky-3:#3F9FC0; --alt-bubble:rgba(255,255,255,.55);
  --alt-glass:rgba(255,255,255,.78); --alt-glass-hi:rgba(255,255,255,.94); --alt-glass-pm:rgba(255,255,255,.90); --alt-base:#EAF6FA;
  --alt-blur:12px; --alt-ring:#0B4F6C; --alt-glow:rgba(255,255,255,.55); --alt-reef:rgba(11,79,108,.30);
  --bg:var(--alt-glass-hi); --surface:var(--alt-glass); --surface2:rgba(11,42,58,.10); --line:rgba(11,42,58,.28);
  --ink:#0B2A3A; --muted:#2F5463; --water:#0A5F6E; --water-soft:rgba(10,95,110,.14);
  --good:#13633A; --warn:#7A5200; --bad:#A3321F; --p-gk:#6E4A00; --p-df:#1A4F8C; --p-mf:#0A5F6E; --p-fw:#9A2F20;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06151C; --surface:#0C2330; --surface2:#123241; --ink:#E3F2F1; --muted:#8DB0B5; --line:#1E4150;
    --water:#3CC4CF; --water-soft:rgba(60,196,207,.14); --on-water:#04222A;
    --ball:#F2B544; --ball-ink:#1B1100; --on-bad:#1B0500; --on-good:#04170D; --on-warn:#1B1100; --warn-fill:#E3A33A;
    --good:#4FD08B; --warn:#E3A33A; --bad:#FF7A63; --ball-bar:var(--ball);
    --p-gk:#F2B544; --p-df:#6FA8F0; --p-mf:#3CC4CF; --p-fw:#FF8A72;
    color-scheme:dark;--tp:78%;
  }
}

  --water:#3CC4CF; --water-soft:rgba(60,196,207,.14); --on-water:#04222A;
  --ball:#F2B544; --ball-ink:#1B1100; --on-bad:#1B0500; --on-good:#04170D; --on-warn:#1B1100; --warn-fill:#E3A33A;
  --good:#4FD08B; --warn:#E3A33A; --bad:#FF7A63; --ball-bar:var(--ball);
  --p-gk:#F2B544; --p-df:#6FA8F0; --p-mf:#3CC4CF; --p-fw:#FF8A72;
  color-scheme:dark;--tp:78%;
}
/* UI-61 · Alt nuit (manuel, puis automatique) : mêmes valeurs dans les deux blocs */
:root[data-alt][data-theme="dark"]{
  --alt-sky-1:#0A2F45; --alt-sky-2:#072436; --alt-sky-3:#041520; --alt-bubble:rgba(143,211,234,.40);
  --alt-glass:rgba(6,32,46,.70); --alt-glass-hi:rgba(6,32,46,.94); --alt-glass-pm:rgba(6,32,46,.90); --alt-base:#0A2A3B; --alt-ring:#8FD3EA; --alt-glow:rgba(143,211,234,.16); --alt-reef:rgba(143,211,234,.14);
  --bg:var(--alt-glass-hi); --surface:var(--alt-glass); --surface2:rgba(2,14,22,.38); --line:rgba(230,244,248,.26); --ink:#E6F4F8; --muted:#9CC3CC;
}
@media (prefers-color-scheme: dark){
  :root[data-alt]:not([data-theme="light"]){
    --alt-sky-1:#0A2F45; --alt-sky-2:#072436; --alt-sky-3:#041520; --alt-bubble:rgba(143,211,234,.40);
    --alt-glass:rgba(6,32,46,.70); --alt-glass-hi:rgba(6,32,46,.94); --alt-glass-pm:rgba(6,32,46,.90); --alt-base:#0A2A3B; --alt-ring:#8FD3EA; --alt-glow:rgba(143,211,234,.16); --alt-reef:rgba(143,211,234,.14);
    --bg:var(--alt-glass-hi); --surface:var(--alt-glass); --surface2:rgba(2,14,22,.38); --line:rgba(230,244,248,.26); --ink:#E6F4F8; --muted:#9CC3CC;
  }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1180px;margin-inline:auto}
button,select,input{font-family:inherit}
h1,h2,h3,p{margin:0}
h2{font:600 17px/1.25 var(--font-display);letter-spacing:.01em;text-wrap:balance}
h3{font:700 12px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.topin{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding-block:10px 8px}
.brand{display:flex;align-items:center;gap:8px;font:800 14px var(--font-display);letter-spacing:.06em}
.brand .b2{color:var(--water)}
.brand svg{width:26px;height:26px;flex:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font:500 12px var(--font-mono);color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);font:600 12px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn.danger{color:var(--bad)}
.sects{display:flex;gap:6px}
.sect{font:700 12px var(--font-display);letter-spacing:.12em;text-transform:uppercase;padding:9px 20px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--surface);color:var(--muted);cursor:pointer}
.sect[aria-current="true"]{background:var(--water);border-color:var(--water);color:var(--on-water)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:0 8px 0 0;padding-inline:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);font:600 13px var(--font-body);white-space:nowrap;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ball)}
.tab:hover{color:var(--ink)}
.tab:focus-visible,.sect:focus-visible,.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible,.club:focus-visible,.sw:focus-visible,.emb-btn:focus-visible,tr[data-a]:focus-visible{outline:2px solid var(--water);outline-offset:2px}

.main{padding-top:20px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h2+*,.panel>h3+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.grid2>*{min-width:0}
.stack{display:grid;gap:16px;align-content:start}
.stack.tight{gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}

/* Boutons et champs */
.btn{font:600 14px var(--font-body);padding:10px 16px;border-radius:8px;border:1px solid var(--line-ctl);background:var(--surface2);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--water)}
.btn.primary{background:var(--ball);color:var(--ball-ink);border-color:var(--ball-bar)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 10px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--font-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--on-water)}
.chip[disabled]{background:transparent;border-style:dashed;color:var(--muted);cursor:not-allowed}   /* TAC-10 : formation verrouillée */
.mst{display:flex;align-items:center;gap:8px;font-size:12px}.mst .bar{flex:1}.mst .ms{font-size:12px;letter-spacing:0}   /* TAC-11 */
/* TAC-09 : forces de zone (4 lignes d'environ 18 px), repère gris de l'adversaire, lecture fort / faible */
.zb{display:grid;gap:3px;margin-top:8px}
.zr{display:grid;grid-template-columns:62px 22px minmax(0,1fr) 92px;gap:8px;align-items:center;font:600 12px/18px var(--font-body)}
.zr .zl{color:var(--muted)}.zr .mono{font-size:12px}
.zr .bar>u{background:var(--muted);margin-left:-1px;box-shadow:0 0 0 1.5px var(--surface)}
.zr .zs,.cmp .zs{white-space:nowrap}.zr .zs [aria-hidden]{display:inline-block;width:12px;text-align:center}
.zr.z2 .zs,.cmp.z2 .zs{color:var(--good);color:color-mix(in srgb,var(--good) 78%,var(--ink))}.zr.z0 .zs,.cmp.z0 .zs{color:var(--bad);color:color-mix(in srgb,var(--bad) 82%,var(--ink))}.zr.z1 .zs,.cmp.z1 .zs{color:var(--muted)}
.zt{margin:6px 0 0;font-size:12.5px;line-height:18px}
.zleg u{display:inline-block;width:2px;height:10px;margin-right:6px;background:var(--muted);vertical-align:-1px}
/* UI-12c : Tactique sur une page (mobile : formation / style / pressing, Sphère, six, remplaçants ; ≥ 980 px : Sphère à gauche) */
.tacg{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"ctl" "sph" "six" "ben"}
.tacg>*{min-width:0}.tacctl{grid-area:ctl}.tacsph{grid-area:sph}.tacsix{grid-area:six}.tacben{grid-area:ben}
.tacctl.stack{gap:12px}.tacsph .row{margin-bottom:6px}
.tacsph .pl[id^="p-h-"]{cursor:pointer}
@media (min-width:980px){.tacg{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"sph ctl" "sph six" "sph ben";grid-template-rows:auto auto 1fr}.tacsph{align-self:start}}
select,input[type="text"]{font:500 14px var(--font-body);padding:8px 10px;border-radius:8px;border:1px solid var(--line-ctl);background:var(--surface);color:var(--ink);max-width:100%;min-width:0}
input[type="text"]{width:100%}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.hint{font-size:13px;color:var(--muted)}
.alert{padding:10px 12px;border-radius:8px;background:var(--water-soft);border:1px solid var(--water);font-size:13.5px}
.alert.warn{border-color:var(--warn)}
.alert button{margin-left:8px}

/* Badges, positions */
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:52px;height:26px;padding-inline:7px;border-radius:6px;background:var(--c,var(--water));color:#fff;font:700 12px var(--font-mono);letter-spacing:.05em;white-space:nowrap}
.badge svg{width:15px;height:15px;flex:none}
.badge.big{flex-direction:column;gap:2px;min-width:64px;height:60px;border-radius:10px;font-size:12px}
.badge.big svg{width:28px;height:28px}
.pos{display:inline-block;font:600 12px var(--font-mono);padding:1px 6px;border-radius:4px;border:1px solid currentColor;min-width:30px;text-align:center}
.pos-GK{color:var(--p-gk)}.pos-DF{color:var(--p-df)}.pos-MF{color:var(--p-mf)}.pos-FW{color:var(--p-fw)}
.form{display:inline-flex;gap:3px}
.form i{font:700 12px var(--font-mono);font-style:normal;width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:#fff}
.form .w{background:var(--good)}.form .l{background:var(--bad)}.form .n{background:var(--surface2);color:var(--muted)}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:700 12px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
th button:hover{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr[data-a]{cursor:pointer}
tr[data-a]:hover{background:var(--water-soft)}
tr.sel{background:var(--water-soft)}
tr.me{background:var(--water-soft);font-weight:700}
td.stat{background:color-mix(in srgb,var(--water) calc(var(--v) * 0.42%),transparent)}
.who{display:flex;align-items:center;gap:8px}
.tag{font:600 12px var(--font-body);padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.bad{background:var(--bad);color:var(--on-bad)}.tag.warn{background:var(--warn-fill);color:var(--on-warn)}.tag.good{background:var(--good);color:var(--on-good)}.tag.ball{background:var(--ball);color:var(--ball-ink)}
.tag.uniq{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ball);font-size:11px;padding:2px 6px;flex:none}
.sx{display:inline-block;vertical-align:-1px;margin-right:2px;flex:none}
.ic{width:1em;height:1em;vertical-align:-.125em;flex:none}   /* UI-89 : icônes SVG currentColor */
.pr .c-name b.nmw{display:flex;align-items:center;gap:5px;min-width:0}.pr .c-name .nmt{min-width:0;overflow:hidden;text-overflow:ellipsis}.pr .c-name b.nmw .tag{flex:none}
.hpcell{display:flex;align-items:center;gap:8px;min-width:96px}
.hpcell .bar{flex:1}

/* Barres */
.bar{position:relative;height:7px;border-radius:4px;background:var(--surface2);min-width:44px}
.bar>i{display:block;height:100%;border-radius:4px;width:var(--w);background:var(--c,var(--water))}
.bar>u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ball-bar);text-decoration:none}
.sb{display:grid;grid-template-columns:30px 26px 1fr 26px;align-items:center;gap:8px;font:500 12px var(--font-mono)}
.sb span{color:var(--muted)}
.sb .btn{padding:0;width:24px;height:24px;line-height:1;font-size:15px;border-radius:6px}
.cmp{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;font:600 12px var(--font-mono)}
.cmp .lab{grid-column:1/-1;font:700 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.cmp .cb{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.cmp .cb i{display:block;height:100%}
.cmp .cb .a{background:var(--water)}.cmp .cb .b{background:var(--ball-bar)}   /* UI-76 : segment adverse ≥ 3:1 en clair (--ball-bar = --warn-fill) ; inchangé en sombre */
.cmp b:last-child{text-align:right}

.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.vs .side{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0}
.vs .nm{font:600 14px var(--font-display);text-wrap:balance;overflow-wrap:anywhere;max-width:100%}   /* v0.6.7 : avec la vraie police Unbounded, un nom de club long sans espace débordait de la carte */
.vs .mid{font:700 12px var(--font-mono);color:var(--muted);letter-spacing:.1em;text-align:center}
.news{display:grid}
.news div{padding:8px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:13.5px}
.news div:last-child{border-bottom:0}
.news span{font:600 12px var(--font-mono);color:var(--muted);padding-top:2px}
details summary{cursor:pointer;font-weight:700;font-size:13px}
details>*:not(summary){margin-top:8px}
dl.gl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
dl.gl dt{font:700 12px var(--font-mono);color:var(--water)}
dl.gl dd{margin:0;color:var(--muted)}

/* Choix et personnalisation */
.hero{display:grid;gap:8px;max-width:640px}
.hero h1{font:800 clamp(26px,6vw,40px)/1.05 var(--font-display);letter-spacing:.01em;text-wrap:balance}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.club{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;cursor:pointer;color:var(--ink);font:inherit;justify-items:start}
.club:hover{border-color:var(--ball)}
.club .cn{font:600 14px var(--font-display);text-wrap:balance}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.embs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.emb-btn{background:var(--c);border-radius:10px;padding:10px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center}
.emb-btn svg{width:28px;height:28px}
.emb-btn[aria-pressed="true"]{border-color:var(--ink)}
.pnames{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.pnames label{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center}

/* Terrain : la Sphère (UI-11, v0.6.1) — cercle 1:1, 100 % de la largeur disponible, 460 px au plus */
.sphere{width:100%;max-width:460px;aspect-ratio:1/1;height:auto;display:block;margin-inline:auto;border:0;background:none;overflow:visible}
.sv-water{fill:var(--water-soft)}
.sv-line{fill:none;stroke:var(--line);stroke-width:2}
.sv-goal{fill:var(--ink);fill-opacity:.16;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;opacity:.6}   /* TAC-03 A : but triangulaire, base sur le bord de l'eau, pointe vers l'extérieur */
.bub{fill:none;stroke:var(--water);stroke-width:1.5;opacity:.4;animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-340px)}}
.pl{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.pl circle,.pl rect,.pl polygon,.pl ellipse{stroke:var(--surface);stroke-width:2}
/* UI-57 : contour de HP du jeton (mêmes seuils que les barres) ; jamais la couleur seule : vert = trait plein fin, orange = tirets, rouge = pointillé épais */
.pl .tf{stroke-width:3.5}   /* liseré clair entre le disque d'équipe et le trait de HP */
.pl .hr{fill:none;stroke-linejoin:round}
.pl .hr.hg{stroke:var(--good);stroke-width:2.5}
.pl .hr.hw{stroke:var(--warn);stroke-width:3.5;stroke-dasharray:7 4}
.pl .hr.hb{stroke:var(--bad);stroke-width:4;stroke-dasharray:.1 5.4;stroke-linecap:round}
.pl .pi{font:700 14px var(--font-mono);fill:#fff;text-anchor:middle;pointer-events:none}
.pl .pn{font:600 14px var(--font-body);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.pl .pn.ps{text-anchor:start}.pl .pn.pe{text-anchor:end}
#ballg{transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.sv-ball{fill:var(--ball);stroke:var(--ball-ink);stroke-width:1.5}
/* consigne de mi-temps : zone de la ligne active (hachures + glyphe, jamais la couleur seule) ; Souffler = halo sur les jetons */
.sv-zone{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.4}
.sv-zone.on{opacity:.95}
.sv-gl{font:800 15px var(--font-body);text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.pl circle.sv-halo{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3;opacity:.8}
@media (prefers-reduced-motion:reduce){.bub{animation:none}.pl,#ballg{transition:none}}
@media (max-width:520px){.panel>.sphere,.panel>.spv>.sphere{width:calc(100% + 32px);max-width:none;margin-inline:-16px}}   /* UI-29 : l'aperçu du Stade prend aussi toute la largeur du panneau (texte des jetons ≥ 12 px rendus) */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.scoreboard .tm{display:flex;align-items:center;gap:10px;min-width:0}
.scoreboard .tm.r{justify-content:flex-end;text-align:right}
.scoreboard .tn{font:600 13px var(--font-display);text-wrap:balance;min-width:0}
.score{font:800 clamp(30px,8vw,46px)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center}
.clock{text-align:center;font:600 12px var(--font-mono);color:var(--muted);margin-top:4px}
.prog{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ball);width:var(--w)}
.banner{padding:10px 12px;border-radius:8px;background:var(--water-soft);border:1px solid var(--water);font-size:13.5px;font-weight:600}
.feed{max-height:330px;overflow:auto;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:7px 0 7px 10px;border-bottom:1px dashed var(--line);border-left:3px solid var(--c,transparent);font-size:13.5px}
.ev time{font:500 12px var(--font-mono);color:var(--muted);padding-top:2px}
.ev.goal{font-weight:700;background:var(--water-soft)}
.ev.sys{color:var(--muted);font-style:italic}
.lu-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto 70px 44px 30px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.lu-row:last-child{border-bottom:0}
.lu-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center}
.slot select{width:100%}
.bench-row{display:grid;grid-template-columns:34px minmax(0,1fr) 44px 60px auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.frow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.frow:last-child{border-bottom:0}
.frow.tot{font-weight:700;border-top:1px solid var(--line);border-bottom:0;margin-top:4px;padding-top:8px}
.pos-v{color:var(--good-t)}.neg-v{color:var(--bad-t)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font:600 13px var(--font-body);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:var(--on-bad)}
@media (max-width:520px){
  .lu-row{grid-template-columns:30px minmax(0,1fr) auto 40px 28px;gap:6px}

  .mr{grid-template-columns:42px minmax(0,1fr) auto;gap:calc(6px*.9) 8px;padding:calc(8px*.9);border:1px solid var(--line);border-radius:8px}
  .mr:last-child{border-bottom:1px solid var(--line)}
  .m-cells{display:grid;grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(6px*.9)}
  .mc,.mc.m-hp,.mc.m-xp{display:grid;align-content:start;align-self:auto;justify-content:stretch;gap:calc(3px*.9);padding:calc(4px*.9) 6px;border-radius:6px;background:var(--surface2);text-align:left}
  .mr .mc{text-align:left}
  .mc::before{display:block;content:attr(data-l);font:600 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .mc .tag{justify-self:start}
  .mc.m-hp,.mc.m-xp{grid-column:1/-1}
  .mc.m-hp .bar{order:1}.mc.m-hp .hpt{order:2}
  .mc.m-xp .xpn{order:0}
}
@media (max-width:520px){
  .lane{grid-template-columns:36px minmax(0,1fr);gap:4px 8px}
  .lane .fit{grid-column:2;justify-self:start}
  .lane .fit i{display:inline}
  .lane select{font-size:13px}
}
/* ---- v0.6-dev2 : duels dépliables (MAT-03) et infos de match (MAT-01) ---- */
:root{--line-ctl:color-mix(in srgb,var(--muted) 82%,var(--surface2));/* UI-66 : bordure des commandes ≥ 3:1 */--good-t:color-mix(in srgb,var(--good) var(--tp,62%),var(--ink));--warn-t:color-mix(in srgb,var(--warn) var(--tp,62%),var(--ink));--bad-t:color-mix(in srgb,var(--bad) var(--tp,62%),var(--ink))}   /* UI-78 : 62 % le jour (4,5:1 sur ligne choisie et pastille), 78 % la nuit (--tp) */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ev .dz{grid-column:2;min-width:0;font-style:normal;font-weight:400}
.dz-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-height:26px;padding:2px 8px 2px 4px;border-radius:6px;font:600 12px var(--font-body);color:var(--muted)}
.dz-btn:hover{color:var(--ink);background:var(--water-soft)}
.dz-btn:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.dz-ch{display:inline-block;width:12px;font-size:12px;transition:transform .15s}
.dz-btn[aria-expanded="true"] .dz-ch{transform:rotate(90deg)}
.dz-m{display:inline-flex;gap:4px}
.dm{font-style:normal;font-weight:800;font-size:13px;color:var(--muted)}
.dm.good,.df li.good,.dl.good .dr{color:var(--good-t)}
.dm.bad,.df li.bad,.dl.bad .dr{color:var(--bad-t)}
.dz-body{display:grid;gap:6px;margin:4px 0 4px}
.dl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;padding:6px 8px;border-left:3px solid var(--line);border-radius:0 6px 6px 0;background:var(--surface);font-size:12.5px;font-weight:500}
.dl.good{border-left-color:var(--good)}
.dl.bad{border-left-color:var(--bad)}
.dk{font-weight:700}
.sp{font-style:normal;color:var(--muted)}
.dv{font-family:var(--font-mono);font-weight:500;border-bottom:2px solid var(--c,var(--line));white-space:nowrap}
.dv.hi{font-weight:800}
.dp,.dth{font-family:var(--font-mono);white-space:nowrap}
.dr{font-weight:700;white-space:nowrap}
.dr i{font-style:normal;font-weight:800}
.df{flex-basis:100%;margin:2px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;font-weight:500;color:var(--muted)}
.df li::before{content:'• ';color:var(--muted)}
.ev.goal .dz-btn,.ev.goal .dl{font-weight:inherit}
.ev.goal .dl{font-weight:500}
#banner{display:grid;gap:6px}
#banner:empty{display:none}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:var(--warn)}
.banner i{font-style:normal;margin-right:8px}
.lu-row.live{grid-template-columns:34px minmax(0,1fr) auto 70px 44px 22px 30px}
.hps{display:inline-flex;align-items:center;gap:4px}
.hps .bat{flex:none}
.hps-ok{color:var(--good-t)}.hps-warn{color:var(--warn-t)}.hps-vwarn,.hps-low{color:var(--bad-t)}
.hps b{font-size:12px}
.hpleg .hps{vertical-align:middle}
@media (max-width:520px){
  .lu-row.live{grid-template-columns:30px minmax(0,1fr) auto 40px 22px 28px}
  .dz-btn{min-height:32px}
  .dl{font-size:12px}
}

/* v0.6-dev5 MAT-02 */
.hopt{display:grid;grid-template-columns:22px minmax(0,1fr) 18px;gap:8px;align-items:center;text-align:left;width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--font-body);cursor:pointer}
.hopt .ht{display:grid;gap:2px;min-width:0;overflow-wrap:anywhere}
.hopt .ht span{font-size:12.5px;color:var(--muted)}
.hopt i{font-style:normal;font-weight:800;text-align:center}
.hopt em{font-style:normal;font-weight:800}
.hopt[aria-pressed="true"]{border-color:var(--water);background:var(--water-soft);box-shadow:inset 0 0 0 1px var(--water)}
.hbadge{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px}
.hbadge .hl{font-weight:700;color:var(--muted)}
.hchip{display:inline-flex;gap:5px;align-items:center;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.hchip i{font-style:normal;font-weight:800}
/* v0.6.4 MAT-04 : réserve de blocs, blocs à choisir, pastilles */
.hres{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px}
.hres .hl{font-weight:700;color:var(--muted)}
.hblk{display:inline-flex;gap:4px}
.hblk i{width:16px;height:10px;border-radius:3px;border:2px solid var(--ink);box-sizing:border-box}
.hblk i.on{background:var(--ink)}
.hchip{max-width:100%;overflow-wrap:anywhere}
[hidden]{display:none!important}

/* v0.6-dev6 UI-14..17 */
.dph{flex-basis:100%;font-weight:700;font-size:13px;line-height:1.35}
.pn{color:color-mix(in srgb,var(--c) 62%,var(--ink));border-bottom:2px solid var(--c);font-weight:800}
.gtag{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;font:800 12px var(--font-body);letter-spacing:.04em;white-space:nowrap}
.gtag i{font-style:normal;margin-right:4px}
.gtag.good{color:var(--good-t)}.gtag.bad{color:var(--bad-t)}
.goalfx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);letter-spacing:0;font:700 14px var(--font-body)}
.goalfx .gb{grid-row:1/3}
.goalfx .gl{display:flex;gap:8px;align-items:baseline;font:800 17px var(--font-display);letter-spacing:.04em}
.goalfx .gl i{font-style:normal}
.goalfx .gt{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.goalfx.us{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.goalfx.us .gl{color:var(--good-t)}
.goalfx.them{border-color:var(--bad);border-style:dashed;background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.goalfx.them .gl{color:var(--bad-t)}
.cmp{--mk:var(--ink)}
.cmp .cb{position:relative;height:10px;overflow:visible;border-radius:5px}
.cmp .cb i:first-of-type{border-radius:5px 0 0 5px}.cmp .cb i:nth-of-type(2){border-radius:0 5px 5px 0}
.cmp .cb .mk{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--mk);border-radius:1px;box-shadow:0 0 0 2px var(--surface)}
.cmp b.hi{font-weight:800;color:var(--ink)}
.cmp b.lo{font-weight:500;color:var(--muted)}
/* UI-51 : comparatif de forces en couleurs (vert plus fort, rouge moins fort, jaune égal) + ▲ ▼ = ; les teintes sont rapprochées de l'encre pour tenir 4,5:1 en clair et en sombre */
.cmp.tn{grid-template-columns:46px 1fr 46px}
.cmp.tn b{display:flex;align-items:center;gap:3px;font-weight:800}
.cmp.tn b:last-child{justify-content:flex-end}
.cmp.tn b .tg{font-size:12px;line-height:1}
.cmp.tn b.up{color:var(--good);color:color-mix(in srgb,var(--good) 78%,var(--ink))}
.cmp.tn b.dn{color:var(--bad);color:color-mix(in srgb,var(--bad) 82%,var(--ink))}
.cmp.tn b.eq{color:var(--warn);color:color-mix(in srgb,var(--warn) 82%,var(--ink))}
.xpc{display:grid;gap:4px;min-width:0}
.xpb{display:flex;border-radius:4px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.xpb i{display:block;height:100%}
.xpb .x0{background:color-mix(in srgb,var(--water) 55%,var(--surface2))}
.xpb .x1{background:repeating-linear-gradient(135deg,var(--ball) 0 4px,color-mix(in srgb,var(--ball) 55%,var(--surface)) 4px 8px)}
.xpn{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;font-size:12px;min-width:0}
.xpn .muted{font-size:12px}
.lvup{display:inline-flex;gap:4px;align-items:center;padding:1px 8px;border-radius:999px;border:1px solid var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good-t);font:800 12px var(--font-body);white-space:nowrap}
.lvup i{font-style:normal}
.mtab.idle .mr .m-xp{grid-column:8}
.panel.idle{border-style:dashed;background:transparent}
.panel.idle h3{color:var(--muted)}
@media (max-width:820px){
  .mtab.idle .mr{grid-template-columns:42px minmax(0,1fr)}
  .mtab.idle .mr .m-xp{grid-column:1/-1}
  .m-cells:has(> .m-xp:only-child){grid-template-columns:minmax(0,1fr)}
}

/* v0.6.1 : compaction de la page Match (direct et bilan), environ −10 % sur les espacements ; limité à .pm (les autres pages gardent leurs valeurs) */
.main.pm{gap:calc(16px*.9)}
.pm .panel{padding:calc(16px*.9)}
.pm .panel>h2+*,.pm .panel>h3+*{margin-top:calc(12px*.9)}
.pm .grid2{gap:calc(16px*.9)}
.pm .stack{gap:calc(16px*.9)}
.pm .stack.tight{gap:calc(8px*.9)}
.pm .lu-row{padding:calc(6px*.9) 0}
@media (max-width:520px){.pm .panel>.sphere{width:calc(100% + 2*16px*.9);margin-inline:calc(-16px*.9)}}

/* ---- v0.6.2 (UI-12a) : navigation en 5 sections, barre mobile, pastilles « à faire » ---- */
.mshort,.ns{display:none}
.bnav{display:none}
.sect{position:relative;display:inline-flex;align-items:center;justify-content:center}
/* UI-70 : l'onglet Jouer porte l'état du jeu (icône ▶, bordure jaune fine permanente, texte gras) ; plein jaune seulement quand une action est attendue (.act).
   La bordure est --warn-fill (≥ 3:1 sur le fond en clair comme en sombre) : le jaune vif --ball seul ne l'atteint pas (écart connu UI-66). */
.sect.play,.sect.play[aria-current="true"]{border:2px solid var(--warn-fill);border-bottom:0;font-weight:800;gap:7px}
.sect.play .pi{font-size:12px;line-height:1}
.sect.play.act,.sect.play.act[aria-current="true"]{background:var(--ball);color:var(--ball-ink)}
/* UI-71 : cloche de notifications (remplace le bouton jaune et les pastilles) */
.bellw{position:relative;flex:none}
.bellbtn{display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border-radius:10px}
/* UI-94 : pas de position:relative sur le bouton ; le compteur .bcnt s’ancre sur .bellw, sinon il élargit la zone défilable du bouton (44 > 38 px) ; offsets -5 px = rendu identique */
.bcnt{position:absolute;top:-5px;right:-5px;display:grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ball);color:var(--ball-ink);font:700 12px/1 var(--font-mono);letter-spacing:0;box-shadow:0 0 0 2px var(--bg)}
.bcnt.block{background:var(--bad);color:var(--on-bad)}
.bellmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:35;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - var(--hh,128px) - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.bellmenu[hidden]{display:none}
.bellmenu h3{margin:0}
/* NAR-05 : sélecteur de mode (défile avec le contenu, hors de l'en-tête collant) */
.modes{display:flex;width:max-content;max-width:100%;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mseg{flex:1 1 auto;min-width:0;min-height:36px;padding:6px 18px;border:0;border-radius:7px;background:none;color:var(--muted);font:600 13px var(--font-body);white-space:nowrap;cursor:pointer}
.mseg[aria-selected="true"]{background:var(--water);color:var(--on-water);font-weight:800}
.mseg[aria-selected="true"]::before{content:"✓";margin-right:6px}
.mseg:focus-visible{outline:2px solid var(--water);outline-offset:2px}
@media (max-width:700px){.modes{width:100%}}
/* NAR-06 : match d'entraînement (bandeau permanent, choix de l'adversaire) */
.trban{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px dashed var(--warn-fill);border-radius:8px;background:var(--surface);font:700 13px var(--font-body)}
.trban .trt{min-width:0;overflow-wrap:anywhere}
.trpick{align-items:start}
.trlist{display:grid;gap:8px}
.trop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:600 14px var(--font-body);text-align:left;cursor:pointer}
.trop .nm{min-width:0;overflow-wrap:anywhere}
.trop[aria-pressed="true"]{border-color:var(--water);box-shadow:inset 0 0 0 2px var(--water);background:var(--water-soft)}
.trop[aria-pressed="true"] .nm::before{content:"✓ "}
.trop:focus-visible{outline:2px solid var(--water);outline-offset:2px}
/* UI-69 : l'en-tête collant (--hh) et la barre du bas (--bh) ne masquent plus ce vers quoi on défile (focus clavier, scrollIntoView) */
html{scroll-padding-top:calc(var(--hh,0px) + 8px);scroll-padding-bottom:calc(var(--bh,0px) + 8px)}
.sub{font:700 14px var(--font-display);margin-top:6px}
@media (max-width:700px){
  .bt,.mfull,.nl{display:none}
  .mshort,.ns{display:inline}
  .topin{flex-wrap:nowrap;gap:8px;padding:6px 48px 6px 0;min-height:52px}
  .bellw{position:absolute;top:6px;right:16px;margin:0}
  .brand svg{width:24px;height:24px}
  .meta{flex:1 1 auto;min-width:0;flex-wrap:nowrap;gap:0 10px;font-size:12px;white-space:nowrap;overflow:hidden}
  .tabs{display:flex;flex-wrap:nowrap;padding-inline:2px;border-radius:8px 8px 0 0}
  .tab{flex:1 1 auto;padding:10px 4px 8px;font-size:12.5px;text-align:center}
  .top.navtabs .sects{gap:2px}
  .top.navtabs .sect{flex:1 1 0;min-width:0;padding:8px 1px;font-size:12px;letter-spacing:0;border-radius:6px 6px 0 0}
  .top.navtabs .sect{text-transform:none;font-size:12px;font-weight:600}
  .top.navtabs .sect .pi{display:none}
  .top.navbar .sect{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bn{flex:1 1 0;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px 5px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:600 12px var(--font-body);cursor:pointer;position:relative}
  .bn[aria-current="true"]{color:var(--water);border-top-color:var(--water)}
  .bn .si{display:grid;place-items:center;height:22px}
  .bn .sl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bn:focus-visible{outline:2px solid var(--water);outline-offset:-3px}
  /* UI-38 : Jouer au centre, ambre, mis en évidence (la hauteur de la barre ne change pas) ; pastille accrochée hors de la capsule */
  .bn.play .si{width:46px;border-radius:11px;background:var(--ball);color:var(--ball-ink)}
  .bn.play .sl{color:var(--ink);font-weight:800}
  .bn.play[aria-current="true"]{border-top-color:var(--ball)}
  .bn.play[aria-current="true"] .si{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
  /* même ordre et même mise en évidence quand la barre est en haut (réglage « Barre en haut ») */
  .top.navtabs .sect[data-s=accueil]{order:1}.top.navtabs .sect[data-s=club]{order:2}.top.navtabs .sect.play{order:3}.top.navtabs .sect[data-s=effectif]{order:4}.top.navtabs .sect[data-s=options]{order:5}
  .top.navtabs .sect.play{background:var(--ball);border-color:var(--ball);color:var(--ball-ink);font-weight:800}
  .top.navtabs .sect.play[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
  body:has(.bnav){padding-block-end:calc(52px + env(safe-area-inset-bottom,0px) + 20px)}
  body:has(.bnav) .toast{bottom:calc(52px + 14px + env(safe-area-inset-bottom,0px))}
}

/* ---- v0.6.3 (UI-19 / UI-20a / UI-21 / TEC-01) : écran titre, parcours, fenêtres, import / export ---- */
.tcol{max-width:360px;margin-inline:auto;display:grid;gap:12px;align-content:start;padding-block:4px 16px}
.thero{display:grid;justify-items:center;gap:6px;text-align:center;padding-top:0}
.thero svg{width:44px;height:44px}
.thero h1{font:800 clamp(24px,7.4vw,32px)/1.1 var(--font-display);letter-spacing:.03em;text-wrap:balance}
.thero h1 span{color:var(--water)}
.thero .ttag{font-size:14px;color:var(--muted)}
.tbtns{display:grid;gap:10px}
.btn.tb{width:100%;min-height:48px;display:grid;justify-items:center;align-content:center;gap:1px;font-size:15px}
.btn.tb small{font:500 12px/1.3 var(--font-body);opacity:.9;overflow-wrap:anywhere}
.btn[aria-disabled="true"]{opacity:.6;cursor:not-allowed;border-style:dashed}
.btn[aria-disabled="true"]:hover{border-color:var(--line-ctl)}
.tmsg{text-align:center}
.twarn{border-color:var(--bad)}
.tnews{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:2px 6px 12px;min-height:182px;display:grid;align-content:start}
.tnh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tnc{font-size:12px;color:var(--muted)}
.tnb{display:grid;gap:4px;padding-inline:6px;font-size:13.5px}
.tnt{font:600 15px var(--font-body)}
.tnb p{color:var(--ink);overflow-wrap:anywhere}
.icbtn{min-width:44px;min-height:44px;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink);font:700 18px var(--font-body);cursor:pointer}
.icbtn:hover{border-color:var(--line)}
.icbtn:focus-visible,.dlgbox:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.tfoot .linkbtn{min-height:32px}
.stepl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.flowp input[type="text"],.flowp input:not([type]){font-size:16px}
.coachf input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)}
.prv{grid-template-columns:36px minmax(0,1fr) auto auto auto}
.prv .shbtn{min-width:44px;min-height:40px}
.optnote{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:13px}
.optnote.bad{border-color:var(--bad);color:var(--bad-t)}
/* fenêtres : conteneur #dlg dans <body> (hors de #app, rendu inert tant qu'une fenêtre est ouverte) */
html[data-dlg],html[data-dlg] body{overflow:hidden}
.dlgback{position:fixed;inset:0;z-index:60;background:rgba(3,12,16,.62);display:grid;place-items:center;padding:16px}
.dlgbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:100%;max-width:440px;max-height:calc(100dvh - 32px);overflow-y:auto;overflow-x:hidden;padding:18px;display:grid;gap:12px;align-content:start}
.dlgbox.sheet{max-width:460px}
.dlgbox h2{overflow-wrap:anywhere}
.dlgbox p{overflow-wrap:anywhere}
.shnav{position:sticky;top:-18px;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:6px;margin:-18px -18px 0;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.shc{font-size:13px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--water)}
.dlgbox .linkbtn{min-height:44px;padding-inline:6px;font-size:13px}
.sheetbody .who{min-width:0}
@media (max-width:700px){
  .dlgbox.sheet{max-width:none;max-height:none;height:100dvh;border-radius:0;border:0}
  .dlgback:has(.sheet){padding:0;place-items:stretch}
  .prv{gap:6px}
}
@media (prefers-reduced-motion: reduce){
  .dlgback,.dlgbox,.tnews,.tnews *,.icbtn{transition:none!important;animation:none!important}
}
/* v0.6.3-dev2 : fiche du club, personnalisation, pastilles de gains, tableau de bord, tactique rapide, copier / coller */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.grid3>*{min-width:0}
.custcols{align-items:start}
.cblock{border-top:1px dashed var(--line);padding-top:14px}
.rec{display:grid;gap:2px}
.recv{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.nxfin{display:grid;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.nxh{font-size:13px}
.nxfin .hint{margin-top:4px;font-size:12.5px}
.xpr{display:flex;align-items:center;gap:8px;min-width:0}
.xpr .xpb{flex:1 1 auto;min-width:0}
.xpg{display:inline-flex;flex-wrap:wrap;gap:4px;flex:none;justify-content:flex-end;min-width:52px}
.gpill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;border:1px solid var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good-t);font:800 12px var(--font-mono);white-space:nowrap}
.qtl{font:700 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.xbtns .row{justify-content:flex-end}
.xta{display:block;width:100%;box-sizing:border-box;min-height:96px;resize:vertical;font:12px/1.4 var(--font-mono);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400}
.xbox{margin:6px 0}
@media (max-width:700px){.tabs{flex-wrap:wrap}}   /* Club compte 5 onglets : à 390 px ils passent sur deux lignes au lieu de déborder */

/* UI-12b : Accueil actionnable (À faire, fiche adversaire) et Journal */
.bhd{margin-bottom:10px}
.linkbtn.pgl{min-height:32px;padding:4px 2px;font-size:13px}
.todo{list-style:none;margin:10px 0 0;padding:0;display:grid}
.td{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.td:last-child{border-bottom:0}
.tdi{text-align:center;font-size:15px;line-height:1}
.td.block .tdi{color:var(--bad)}
.td .btn{white-space:nowrap}
.alldone{margin:10px 0 0;font-weight:600}
.alldone span{color:var(--good);margin-right:4px}
.oppc{border-top:1px solid var(--line);padding-top:8px}
.oppc .hint{margin:6px 0 2px}
.jw{color:var(--bad);font-weight:700}
.jchips{margin-top:-4px}
.jgrp{margin:14px 0 2px;font:700 12px/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.jlist>.jgrp:first-child{margin-top:0}
.jr{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.jr p{min-width:0;overflow-wrap:anywhere}
.jk{padding-top:2px;font:600 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.news p .jw{margin-right:2px}
@media (max-width:480px){.jr{grid-template-columns:18px minmax(0,1fr)}.jk{grid-column:2;padding-top:0}}

/* ---- v0.6.7 (UI-07) : Entraînement en lignes, une ligne par joueur ---- */
.trl{overflow:visible}
.trow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"p n m" "x x s";gap:6px 8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tp{grid-area:p}.trow .tn{grid-area:n}.trow .tm{grid-area:m;font-size:12px;white-space:nowrap}.trow .tx{grid-area:x;min-width:0;font-size:12px}.trow .ts{grid-area:s;width:150px;max-width:100%}
.trow .tn{display:flex;align-items:center;gap:6px;min-width:0}
.trow .tn b{font-size:13.5px;flex:0 1 auto}
.trow .tx .bar{min-width:36px}
.trow .tx span{white-space:nowrap}
@media (max-width:700px){.trow .ts{width:112px;font-size:13px}}

/* UI-39 : nom de l'entraîneur + crayon ; UI-40 : confirmation de spécialité */
.cname{display:flex;align-items:center;gap:6px;min-width:0;font:600 17px var(--font-display)}
.cname .cn{min-width:0;overflow-wrap:anywhere}
.cname input{font:600 15px var(--font-body);flex:1 1 auto;width:min(240px,100%)}
.grow{flex:1 1 0;min-width:0}
.ibtn{flex:none;width:32px;height:32px;display:inline-grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--muted);cursor:pointer}
.ibtn:hover{color:var(--ink);border-color:var(--water)}
.ibtn:focus-visible{outline:2px solid var(--water);outline-offset:2px}
/* UI-20b : portrait de l'entraîneur ; l'icône « changer » ouvre la grille des 8 portraits (UI-D) */
.cport{position:relative;flex:none}
.cpchg{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;background:var(--surface)}
.cpick{display:flex;flex-wrap:wrap;gap:8px}
.cpb{display:block;padding:0;border:0;background:none;border-radius:6px;cursor:pointer;font:inherit}
.cpb[aria-checked="true"] .pframe{box-shadow:0 0 0 3px var(--water)}
.cpb:focus-visible{outline:2px solid var(--water);outline-offset:3px}
.ibtn[aria-disabled="true"]{opacity:.65;cursor:default}
.ibtn[aria-disabled="true"]:hover{color:var(--muted);border-color:var(--line)}
.chip.pend{border-color:var(--water);box-shadow:0 0 0 2px var(--water) inset}
.cfm{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;border:1px solid var(--water);border-radius:8px;background:var(--surface2);font-size:14px}
.cfm>span:first-child{min-width:0;flex:1 1 200px}
/* v0.6.9 (UI-41, UI-53, UI-56) : barre d'outils des listes (tri, filtres, compteur) ; carte joueur en feuille du bas sous 700 px */
.ltb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end}
.ltb .sortsel{grid-column:1/-1}
.ltb select{width:100%}
.fltr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.flc{font-size:13px;white-space:nowrap}
@media (min-width:701px){.ltb{grid-template-columns:repeat(4,minmax(0,1fr))}.ltb .sortsel{grid-column:span 2}}
.nxd{margin-top:-4px}
.dlgback.bs{display:flex;align-items:flex-end;padding:0}
.bsheet{width:100%;height:80vh;height:80dvh;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;overflow:hidden;animation:bsup .15s ease-out}
.bsheet:focus-visible{outline:2px solid var(--water);outline-offset:-2px}
@keyframes bsup{from{transform:translateY(32px);opacity:.4}to{transform:none;opacity:1}}
.bshh{border-bottom:1px solid var(--line)}
.bsh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 0 16px}
.bshh .tabsm{margin:0;padding-inline:10px;border-bottom:0}
.bsh .who{min-width:0;flex:1}
.bsb{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.toast{z-index:70}   /* les notifications passent au-dessus de la feuille (z-index 60) */
@media (prefers-reduced-motion: reduce){.bsheet{animation:none!important;transition:none!important}}

/* ===== v0.6.10 · pack UI-A ===== */
/* UI-35 / UI-45 : créneau d'état de 48 px, toujours présent dans le direct (but > mi-temps > alertes ; sans message : consigne active) */
.slot48{display:grid;height:48px}
.slot48>*{grid-area:1/1;min-width:0}
#banner{display:flex;gap:8px;align-items:center;position:relative;z-index:1;background:var(--surface);border-radius:8px}
#banner:empty{display:none}
#banner>.banner,#banner>.goalfx{flex:1;min-width:0;height:48px;overflow:hidden}
#banner>.banner{display:flex;align-items:center;padding:4px 12px;font-size:13px;line-height:1.25}
.bnt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#banner>.goalfx{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center;padding:2px 12px}
#banner>.goalfx .gb{grid-row:auto}
#banner>.goalfx .gl{font-size:15px}
#banner>.goalfx .gt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmore{flex:none;font:700 12px var(--font-mono);color:var(--muted);padding-right:4px}
#halfbadge{align-self:center}
#halfbadge .hbadge{gap:4px 8px;max-height:48px;overflow:hidden}
#halfbadge .hchip{padding:1px 8px}
/* UI-35 : textes de style et de pressing superposés dans une même cellule (hauteur = le plus long), texte de zone réservé */
.hstk{display:grid}
.hstk>p{grid-area:1/1;visibility:hidden}
.hstk>p.on{visibility:visible}
.zt{min-height:18px}
/* UI-34a : disposition PC. Sous 700 px : ordre et hauteurs de la v0.6.9 (aucune règle ci-dessous) */
.lvk1,.lvk2,.lvk3{display:contents}   /* UI-67 : transparents sous 1 100 px */
@media (min-width:700px){
  .lv{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"main main" "team feed" "style info" "half stats";align-items:start;grid-auto-rows:auto}
  .lvmain{grid-area:main}.lvteam{grid-area:team}.lvfeed{grid-area:feed}.lvstyle{grid-area:style}.lvinfo{grid-area:info}.lvhalf{grid-area:half}.lvstats{grid-area:stats}
  .lvfeed .feed{height:330px;max-height:330px}   /* hauteur fixe : le fil qui se remplit ne pousse plus Infos et Statistiques */
  .tacg{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"sph sph" "ctl six" "ctl ben";grid-template-rows:auto auto 1fr;align-items:start}
  .tacg .tacctl{align-self:stretch}
  .pre>.quick{grid-column:1/-1}
}
@media (min-width:1100px){
  /* UI-67 : trois colonnes indépendantes (plus de ligne commune) ; Consigne reste sous le terrain */
  .lv{grid-template-columns:minmax(260px,300px) minmax(0,1fr) minmax(280px,340px);grid-template-areas:none;grid-template-rows:none}
  .lvk1,.lvk2,.lvk3{display:grid;gap:16px;align-content:start;min-width:0;grid-row:1}
  .lvk1{grid-column:1}.lvk2{grid-column:2}.lvk3{grid-column:3}
  .lvk1>.panel,.lvk2>.panel,.lvk3>.panel{grid-area:auto}
  .lv .sphere{max-width:520px}
  .tacg{grid-template-columns:minmax(260px,320px) minmax(0,1fr) minmax(300px,380px);grid-template-areas:"ctl sph six" "ctl sph ben";grid-template-rows:auto 1fr}
  .tacg .tacctl{align-self:stretch;align-content:space-between}   /* UI-75 : la colonne de gauche finit à la hauteur des deux autres (plus de blanc dessous) ; l'écart se répartit entre les blocs */
  .pre{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pre>.quick{grid-column:auto}
  .pre .pre-bn{display:grid;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
}
/* UI-72 : Tableau de bord. Sous 1 200 px : une colonne dans l'ordre hb1 À faire, hb2 Prochain match, hb3 Classement, hb4 Journal, hb5 Entraîneur, hb6 Finances (.hcA, .hcB et .hpr sont transparents, display:contents ; les cartes se rangent par order).
   À ≥ 1 200 px : deux colonnes indépendantes, donc sans trou : A (À faire, Prochain match) | B (.hpr : Classement et Entraîneur côte à côte à demi-largeur, puis Journal, puis Finances). */
.hm{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.hcA,.hcB,.hpr{display:contents}
.hm .panel{min-width:0}
.hb1{order:1}.hb2{order:2}.hb3{order:3}.hb4{order:4}.hb5{order:5}.hb6{order:6}.hm>.helprow{order:7}
@media (min-width:1200px){
  .hm{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch}
  .hcA,.hcB{display:grid;gap:16px;align-content:start;min-width:0}
  .hcA{grid-template-rows:auto 1fr}.hcB{grid-template-rows:auto auto 1fr}   /* UI-75 : la dernière carte de la colonne la plus courte s'étire, les deux colonnes finissent ensemble */
  .hb2.stack{align-content:space-between}.hb6{display:grid;align-content:space-between}
  .hpr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch;min-width:0}
  .hb1,.hb2,.hb3,.hb4,.hb5,.hb6{order:0}
  .hm>.helprow{grid-column:1/-1}
  .hpr .panel{padding:12px}
  .hpr .hx{display:none}
  .hpr .tbl th,.hpr .tbl td{padding:6px 5px}
  .hpr .tbl th{letter-spacing:.03em}
}
@media (max-width:480px){
  .hm{gap:10px}
  .hm .panel{padding:12px}
  .hm .hx{display:none}
  .hm .tbl th,.hm .tbl td{padding-inline:5px}
  .hm .news div:nth-child(n+4){display:none}
  .hm .news div{grid-template-columns:30px minmax(0,1fr);gap:6px}
  .hm .news p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
}
/* colonne gauche étroite (3 colonnes, 1 100 à 1 279 px) : la ligne d'un titulaire passe sur deux rangées pour garder le nom lisible */
@media (min-width:1100px){
  .lvteam .lu-row.live{grid-template-columns:30px auto minmax(40px,1fr) auto auto 30px;row-gap:2px}
  .lvteam .lu-row.live>:nth-child(1){grid-column:1;grid-row:1}
  .lvteam .lu-row.live>:nth-child(2){grid-column:2/6;grid-row:1}
  .lvteam .lu-row.live>:nth-child(7){grid-column:6;grid-row:1/3}
  .lvteam .lu-row.live>:nth-child(3){grid-column:2;grid-row:2}
  .lvteam .lu-row.live>:nth-child(4){grid-column:3;grid-row:2}
  .lvteam .lu-row.live>:nth-child(5){grid-column:4;grid-row:2}
  .lvteam .lu-row.live>:nth-child(6){grid-column:5;grid-row:2}
}
/* colonne centrale étroite : le tableau de score s'empile comme sur mobile (largeur du panneau, pas de la fenêtre) */
@media (min-width:700px){.lvmain{container-type:inline-size}}
@container (max-width:560px){
  .scoreboard{grid-template-columns:1fr 1fr;row-gap:8px}.scoreboard>:nth-child(2){grid-column:1/-1;grid-row:1}
  .scoreboard .tm,.scoreboard .tm.r{flex-direction:column;justify-content:flex-start;text-align:center;gap:6px}.scoreboard .tm.r{flex-direction:column-reverse}
}

/* ===== v0.6.10 · pack UI-B ===== */
/* TAC-08 : Plans d'équipe. Trois pastilles de 48 px et un « ⋯ » de 44 × 44 px sur une rangée (colonne gauche de Tactique, panneau « Tactique rapide » avant le coup d'envoi).
   Nom : au plus 2 lignes (12 caractères entiers, jamais coupés) ; sous 250 px de large (colonne gauche à 1 100 px) les pastilles passent en rangées pleine largeur. Aucune couleur nouvelle. */
.plans{display:grid;gap:8px;min-width:0;container-type:inline-size}
.plrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 44px;gap:4px;align-items:center}
.pla{display:grid;align-content:center;justify-items:start;height:48px;min-width:0;padding:2px 5px;border:1px solid var(--line-ctl);border-radius:8px;background:var(--surface);color:var(--ink);font:600 12px/1.15 var(--font-body);text-align:left;cursor:pointer;overflow:hidden}
.pla:hover:not([disabled]){border-color:var(--water)}
.pla[aria-pressed="true"]{border-color:var(--water);box-shadow:0 0 0 1px var(--water) inset}
.pla.emp{border-style:dashed}
.pla[disabled]{opacity:.55;cursor:not-allowed}
.pln{max-width:100%;font:700 12px/1.15 var(--font-body);overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pls{max-width:100%;font:500 12px/1.15 var(--font-body);color:var(--muted);white-space:nowrap;overflow:hidden}
.pls.on{color:var(--ink);font-weight:700}
.pls i{font-style:normal}
.plw{color:var(--warn-t);font-weight:700}
.plm{width:44px;height:44px;padding:0;display:grid;place-items:center;border:1px solid var(--line-ctl);border-radius:8px;background:var(--surface2);color:var(--ink);font:700 18px/1 var(--font-body);cursor:pointer}
.plm:hover:not([disabled]),.plm[aria-expanded="true"]{border-color:var(--water)}
.plm[disabled]{opacity:.45;cursor:not-allowed}
.plmenu{display:grid;gap:6px;padding:10px 12px;border:1px solid var(--water);border-radius:8px;background:var(--surface2)}
.plr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.plrn{min-width:0;font-size:13px;overflow-wrap:anywhere}
.plmenu .btn,.plans .cfm .btn,.plsum .btn{min-height:44px}
.plsum{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px}
.plsum>:first-child{flex:1 1 120px;min-width:0}
.plrename label.f{flex:1 1 180px;min-width:0}
.plrename label.f span{font-size:12px}
@container (max-width:249px){
  .plrow{grid-template-columns:minmax(0,1fr) 44px;grid-template-rows:repeat(3,48px)}
  .plrow .pla{grid-column:1}
  .plrow .plm{grid-column:2;grid-row:1}
}
/* UI-42 : six de départ éditable et barres de zone sur l'avant-match ; repère d'effet sous chaque bouton de formation, de style et de pressing */
.lu-row .nm select{width:100%}
.pre-r select{padding:6px 8px;font-size:13px}
.pre-bn{display:none}   /* UI-75 : remplaçants sous le huit de départ, visibles à partir de 1 100 px seulement (en dessous, ils restent sur Effectif › Tactique) */
.pre{align-items:start}   /* UI-68 : chaque carte garde la hauteur de son contenu (plus de carte « Journée » étirée et vide avant le coup d'envoi) */
/* UI-73 : comparatif fusionné. Étroit : libellé et écart sur une ligne, puis valeurs et barre ; à partir de 460 px de large (conteneur) : tout sur une seule ligne par rubrique */
.fcm{container-type:inline-size;display:grid;gap:8px}
.fcm .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cmp .zs{font:700 12px var(--font-body);letter-spacing:0;text-transform:none}
.fcf{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fcf .zt{margin:0;min-height:0}
@container (min-width:460px){
  .fcm .cmp.tn{grid-template-columns:112px 46px minmax(0,1fr) 46px 104px}
  .fcm .lab{display:contents}
  .fcm .lab .zs{order:9;text-align:right}
}
.optc{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.rep{font:600 12px/1.2 var(--font-body);color:var(--muted);white-space:nowrap;min-height:15px}
.rep i{font-style:normal}
.seg+.rep{white-space:normal;min-height:0}
/* UI-47 : barre de HP du bilan = HP de fin (plein) + segment hachuré de la récupération attendue (même grammaire que le segment d'XP) */
.bar.hpr{display:flex;overflow:hidden;gap:0}
.bar.hpr>i{flex:none;border-radius:0}
.bar.hpr>.h0{border-radius:4px 0 0 4px}
.bar.hpr>.h1{background:repeating-linear-gradient(135deg,var(--c) 0 4px,color-mix(in srgb,var(--c) 45%,var(--surface)) 4px 8px)}

/* ===== v0.6.10 · pack UI-C ===== */
/* UI-46 : ligne « Bloc n/3 » sous le chrono (hauteur réservée : rien ne bouge quand elle se vide) */
.clock.bloc{min-height:16px;margin-top:0}
/* UI-43 : « ? » du panneau Consigne (cible tactile 44 px) et rappel court */
.hqh{align-items:center}
.icbtn.hq{border-color:var(--line-ctl);font-size:16px}
.icbtn.hq[aria-expanded="true"]{border-color:var(--water);background:var(--water-soft)}
.hqt{display:grid;gap:6px;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:13px;color:var(--muted)}
.hqt[hidden]{display:none}
.hqt ul{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.hqt p{margin:0}
.hqt b{color:var(--ink)}
/* UI-34b : Sphère en plein écran. Calque fixe au-dessus de la page (z-index 65, sous les notifications) ; la Sphère est un carré min(hauteur − 72 px, largeur − 320 px) ; commandes à droite (≥ 1 100 px) ou sous la Sphère (700 à 1 099 px). Mêmes variables que le reste, aucune couleur nouvelle. */
