<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Blitz Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept : un tableau de bord de club lu comme l'écran d'une arène sous-marine.
   Cinq sections (UI-12a) : Accueil, Club, Effectif, Jouer, Options ; barre du bas sur mobile.
   Eau verre de mer le jour, abysses la nuit, ballon ambré comme seul point chaud. */
:root{
  --bg:#E4EFEE; --surface:#F5FAF9; --surface2:#D6E6E4; --ink:#0A2830; --muted:#476770; --line:#B5CFCC;
  --water:#0B7480; --water-soft:rgba(11,116,128,.12); --on-water:#FFFFFF;
  --ball:#E0910F; --ball-ink:#1B1100; --on-bad:#FFFFFF; --on-good:#FFFFFF; --on-warn:#FFFFFF; --warn-fill:#946300;
  --good:#1C8450; --warn:#A8710A; --bad:#C0412C;
  --p-gk:#8A5F00; --p-df:#1F5FA8; --p-mf:#0B7480; --p-fw:#B03A2A;
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06151C; --surface:#0C2330; --surface2:#123241; --ink:#E3F2F1; --muted:#8DB0B5; --line:#1E4150;
    --water:#3CC4CF; --water-soft:rgba(60,196,207,.14); --on-water:#04222A;
    --ball:#F2B544; --ball-ink:#1B1100; --on-bad:#1B0500; --on-good:#04170D; --on-warn:#1B1100; --warn-fill:#E3A33A;
    --good:#4FD08B; --warn:#E3A33A; --bad:#FF7A63;
    --p-gk:#F2B544; --p-df:#6FA8F0; --p-mf:#3CC4CF; --p-fw:#FF8A72;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06151C; --surface:#0C2330; --surface2:#123241; --ink:#E3F2F1; --muted:#8DB0B5; --line:#1E4150;
  --water:#3CC4CF; --water-soft:rgba(60,196,207,.14); --on-water:#04222A;
  --ball:#F2B544; --ball-ink:#1B1100; --on-bad:#1B0500; --on-good:#04170D; --on-warn:#1B1100; --warn-fill:#E3A33A;
  --good:#4FD08B; --warn:#E3A33A; --bad:#FF7A63;
  --p-gk:#F2B544; --p-df:#6FA8F0; --p-mf:#3CC4CF; --p-fw:#FF8A72;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1180px;margin-inline:auto}
button,select,input{font-family:inherit}
h1,h2,h3,p{margin:0}
h2{font:600 17px/1.25 var(--font-display);letter-spacing:.01em;text-wrap:balance}
h3{font:700 11px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.topin{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding-block:10px 8px}
.brand{display:flex;align-items:center;gap:8px;font:800 14px var(--font-display);letter-spacing:.06em}
.brand .b2{color:var(--water)}
.brand svg{width:26px;height:26px;flex:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font:500 12px var(--font-mono);color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);font:600 12px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn.danger{color:var(--bad)}
.sects{display:flex;gap:6px}
.sect{font:700 12px var(--font-display);letter-spacing:.12em;text-transform:uppercase;padding:9px 20px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--surface);color:var(--muted);cursor:pointer}
.sect[aria-current="true"]{background:var(--water);border-color:var(--water);color:var(--on-water)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:0 8px 0 0;padding-inline:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);font:600 13px var(--font-body);white-space:nowrap;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ball)}
.tab:hover{color:var(--ink)}
.tab:focus-visible,.sect:focus-visible,.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible,.club:focus-visible,.sw:focus-visible,.emb-btn:focus-visible,tr[data-a]:focus-visible{outline:2px solid var(--water);outline-offset:2px}

.main{padding-top:20px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h2+*,.panel>h3+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.grid2>*{min-width:0}
.stack{display:grid;gap:16px;align-content:start}
.stack.tight{gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}

/* Boutons et champs */
.btn{font:600 14px var(--font-body);padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--water)}
.btn.primary{background:var(--ball);color:var(--ball-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 10px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--font-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--on-water)}
select,input[type="text"]{font:500 14px var(--font-body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%;min-width:0}
input[type="text"]{width:100%}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.hint{font-size:13px;color:var(--muted)}
.alert{padding:10px 12px;border-radius:8px;background:var(--water-soft);border:1px solid var(--water);font-size:13.5px}
.alert.warn{border-color:var(--warn)}
.alert button{margin-left:8px}

/* Badges, positions */
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:52px;height:26px;padding-inline:7px;border-radius:6px;background:var(--c,var(--water));color:#fff;font:700 11px var(--font-mono);letter-spacing:.05em;white-space:nowrap}
.badge svg{width:15px;height:15px;flex:none}
.badge.big{flex-direction:column;gap:2px;min-width:64px;height:60px;border-radius:10px;font-size:12px}
.badge.big svg{width:28px;height:28px}
.pos{display:inline-block;font:600 10.5px var(--font-mono);padding:1px 6px;border-radius:4px;border:1px solid currentColor;min-width:30px;text-align:center}
.pos-GK{color:var(--p-gk)}.pos-DF{color:var(--p-df)}.pos-MF{color:var(--p-mf)}.pos-FW{color:var(--p-fw)}
.form{display:inline-flex;gap:3px}
.form i{font:700 10px var(--font-mono);font-style:normal;width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:#fff}
.form .w{background:var(--good)}.form .l{background:var(--bad)}.form .n{background:var(--surface2);color:var(--muted)}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:700 10.5px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
th button:hover{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr[data-a]{cursor:pointer}
tr[data-a]:hover{background:var(--water-soft)}
tr.sel{background:var(--water-soft)}
tr.me{background:var(--water-soft);font-weight:700}
td.stat{background:color-mix(in srgb,var(--water) calc(var(--v) * 0.42%),transparent)}
.who{display:flex;align-items:center;gap:8px}
.tag{font:600 11px var(--font-body);padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.bad{background:var(--bad);color:var(--on-bad)}.tag.warn{background:var(--warn-fill);color:var(--on-warn)}.tag.good{background:var(--good);color:var(--on-good)}.tag.ball{background:var(--ball);color:var(--ball-ink)}
.hpcell{display:flex;align-items:center;gap:8px;min-width:96px}
.hpcell .bar{flex:1}

/* Barres */
.bar{position:relative;height:7px;border-radius:4px;background:var(--surface2);min-width:44px}
.bar>i{display:block;height:100%;border-radius:4px;width:var(--w);background:var(--c,var(--water))}
.bar>u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ball);text-decoration:none}
.sb{display:grid;grid-template-columns:30px 26px 1fr 26px;align-items:center;gap:8px;font:500 12px var(--font-mono)}
.sb span{color:var(--muted)}
.sb .btn{padding:0;width:24px;height:24px;line-height:1;font-size:15px;border-radius:6px}
.cmp{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;font:600 12px var(--font-mono)}
.cmp .lab{grid-column:1/-1;font:700 10.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.cmp .cb{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.cmp .cb i{display:block;height:100%}
.cmp .cb .a{background:var(--water)}.cmp .cb .b{background:var(--ball)}
.cmp b:last-child{text-align:right}

.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.vs .side{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0}
.vs .nm{font:600 14px var(--font-display);text-wrap:balance}
.vs .mid{font:700 12px var(--font-mono);color:var(--muted);letter-spacing:.1em;text-align:center}
.news{display:grid}
.news div{padding:8px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:13.5px}
.news div:last-child{border-bottom:0}
.news span{font:600 11px var(--font-mono);color:var(--muted);padding-top:2px}
details summary{cursor:pointer;font-weight:700;font-size:13px}
details>*:not(summary){margin-top:8px}
dl.gl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
dl.gl dt{font:700 12px var(--font-mono);color:var(--water)}
dl.gl dd{margin:0;color:var(--muted)}

/* Choix et personnalisation */
.hero{display:grid;gap:8px;max-width:640px}
.hero h1{font:800 clamp(26px,6vw,40px)/1.05 var(--font-display);letter-spacing:.01em;text-wrap:balance}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.club{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;cursor:pointer;color:var(--ink);font:inherit;justify-items:start}
.club:hover{border-color:var(--ball)}
.club .cn{font:600 14px var(--font-display);text-wrap:balance}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.embs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.emb-btn{background:var(--c);border-radius:10px;padding:10px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center}
.emb-btn svg{width:28px;height:28px}
.emb-btn[aria-pressed="true"]{border-color:var(--ink)}
.pnames{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.pnames label{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center}

/* Terrain : la Sphère (UI-11, v0.6.1) — cercle 1:1, 100 % de la largeur disponible, 460 px au plus */
.sphere{width:100%;max-width:460px;aspect-ratio:1/1;height:auto;display:block;margin-inline:auto;border:0;background:none;overflow:visible}
.sv-water{fill:var(--water-soft)}
.sv-line{fill:none;stroke:var(--line);stroke-width:2}
.sv-goal{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;opacity:.55}
.bub{fill:none;stroke:var(--water);stroke-width:1.5;opacity:.4;animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-340px)}}
.pl{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.pl circle,.pl rect,.pl polygon{stroke:var(--surface);stroke-width:2}
.pl .pi{font:700 9px var(--font-mono);fill:#fff;text-anchor:middle;pointer-events:none}
.pl .pn{font:600 9.5px var(--font-body);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
#ballg{transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.sv-ball{fill:var(--ball);stroke:var(--ball-ink);stroke-width:1.5}
/* consigne de mi-temps : zone de la ligne active (hachures + glyphe, jamais la couleur seule) ; Souffler = halo sur les jetons */
.sv-zone{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.4}
.sv-zone.on{opacity:.95}
.sv-gl{font:800 15px var(--font-body);text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.pl circle.sv-halo{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3;opacity:.8}
@media (prefers-reduced-motion:reduce){.bub{animation:none}.pl,#ballg{transition:none}}
@media (max-width:520px){.panel>.sphere{width:calc(100% + 32px);max-width:none;margin-inline:-16px}}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.scoreboard .tm{display:flex;align-items:center;gap:10px;min-width:0}
.scoreboard .tm.r{justify-content:flex-end;text-align:right}
.scoreboard .tn{font:600 13px var(--font-display);text-wrap:balance;min-width:0}
.score{font:800 clamp(30px,8vw,46px)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center}
.clock{text-align:center;font:600 12px var(--font-mono);color:var(--muted);margin-top:4px}
.prog{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ball);width:var(--w)}
.banner{padding:10px 12px;border-radius:8px;background:var(--water-soft);border:1px solid var(--water);font-size:13.5px;font-weight:600}
.feed{max-height:330px;overflow:auto;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:7px 0 7px 10px;border-bottom:1px dashed var(--line);border-left:3px solid var(--c,transparent);font-size:13.5px}
.ev time{font:500 11.5px var(--font-mono);color:var(--muted);padding-top:2px}
.ev.goal{font-weight:700;background:var(--water-soft)}
.ev.sys{color:var(--muted);font-style:italic}
.lu-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto 70px 44px 30px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.lu-row:last-child{border-bottom:0}
.lu-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center}
.slot select{width:100%}
.bench-row{display:grid;grid-template-columns:34px minmax(0,1fr) 44px 60px auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.frow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.frow:last-child{border-bottom:0}
.frow.tot{font-weight:700;border-top:1px solid var(--line);border-bottom:0;margin-top:4px;padding-top:8px}
.pos-v{color:var(--good-t)}.neg-v{color:var(--bad-t)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font:600 13px var(--font-body);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:var(--on-bad)}
@media (max-width:520px){
  .lu-row{grid-template-columns:30px minmax(0,1fr) auto 40px 28px;gap:6px}
  .lu-row .bar{display:none}
  .bench-row{grid-template-columns:30px minmax(0,1fr) 40px auto}
  .bench-row .bar{display:none}
  .sect{padding-inline:14px}
}

/* ---- v0.3 : radar, rôles, profil, options ---- */
.sect.opt{margin-left:auto}
.tabs{border-radius:8px 0 0 0}
.radar{width:100%;max-width:300px;height:auto;display:block;margin-inline:auto}
.rd-grid{fill:none;stroke:var(--line);stroke-width:1}
.rd-axis{stroke:var(--line);stroke-width:1}
.rd-cap{fill:none;stroke:var(--ball);stroke-width:1.6;stroke-dasharray:4 3;stroke-linejoin:round}
.rd-val{fill:var(--water-soft);stroke:var(--water);stroke-width:2.4;stroke-linejoin:round}
.rd-dot{fill:var(--water)}
.rd-lab{font:700 13px var(--font-mono);fill:var(--muted);text-anchor:middle}
.rd-lab.key{fill:var(--ink)}
.rd-num{font:600 11.5px var(--font-mono);fill:var(--muted);text-anchor:middle}
.rd-lab.key+.rd-num{fill:var(--ink)}
.rd-ring{fill:var(--ball);opacity:.9}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--water);vertical-align:middle;margin-right:5px}
.legend i.c{border-top:2px dashed var(--ball)}
td.stat.k-key{font-weight:700}
td.stat.k-low{color:var(--muted)}
.q-good{color:var(--good)}.q-bad{color:var(--bad)}
td.stat.k-key.q-good{color:var(--good)}
.g-S{color:var(--p-gk);font-weight:700}.g-A{color:var(--good);font-weight:700}.g-B{color:var(--p-mf);font-weight:700}.g-C{}
.r-hi{color:var(--good);font-weight:700}.r-ok{color:var(--p-mf);font-weight:700}.r-lo{color:var(--warn);font-weight:700}.r-bad{color:var(--bad);font-weight:700}
.rtag{font:600 10.5px var(--font-body);color:var(--muted);margin-left:6px}
.sd{display:inline-block;font:600 10.5px var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;min-width:22px;text-align:center}
.sd.bad{color:var(--warn);border-color:var(--warn)}
.ig{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin:0}
.ig dt{color:var(--muted)}.ig dd{margin:0;text-align:right;font-family:var(--font-mono)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}

.st.key.t1{background:color-mix(in srgb,var(--warn) 20%,transparent)}
.st.key.t0{background:color-mix(in srgb,var(--bad) 26%,transparent)}
.st.mid.t4{color:var(--good);font-weight:700}.st.mid.t0{color:var(--bad);font-weight:700}

.nn{font:700 14px var(--font-mono);text-align:center}
.pg{display:inline-grid;place-items:center;width:24px;height:22px;border-radius:5px;font:700 11.5px var(--font-mono);border:1px solid var(--line);color:var(--muted)}

.pg-A{background:var(--good);color:var(--on-good);border-color:transparent}
.pg-B{background:var(--water);color:var(--on-water);border-color:transparent}
.av{display:inline-grid;place-items:center;min-width:34px;height:22px;border-radius:5px;font:700 11.5px var(--font-mono);color:var(--muted)}

.av.r-ok{background:color-mix(in srgb,var(--water) 22%,transparent);color:var(--ink)}
.av.r-lo{background:color-mix(in srgb,var(--warn) 24%,transparent);color:var(--ink)}
.av.r-bad{background:color-mix(in srgb,var(--bad) 28%,transparent);color:var(--ink)}
.hpm{display:grid;gap:2px;font:600 11px var(--font-mono);color:var(--muted);text-align:center}
.pr .btn.small{padding:6px 8px;width:100%}
.sortsel{display:none;gap:8px;align-items:end}
.tabsm{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 0}

.ppanel{padding:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{font:600 11.5px var(--font-mono);padding:2px 8px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.pchip.main{border:1px solid currentColor;font-size:13px;padding:3px 10px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;font-size:12.5px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}

.spend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}

.spend button[disabled]{opacity:.4;cursor:not-allowed}
.hist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.hist li>span{font:600 11px var(--font-mono);color:var(--muted);padding-top:2px}
.refp{padding:12px 14px}
.refbody{display:grid;gap:8px;font-size:13px;margin-top:8px}
.refgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:4px 24px}
.refgrid div{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
.refgrid dt,.refgrid b.k{font:700 12px var(--font-mono);color:var(--water)}
.refgrid dd{margin:0;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.lg span{display:inline-flex;gap:6px;align-items:center}
.lg .st{width:34px}
.fac{display:grid;gap:8px;padding:14px}
.pips{display:flex;gap:4px}
.pips i{width:18px;height:8px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.pips i.on{background:var(--ball);border-color:var(--ball)}
.facs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.crow{display:grid;grid-template-columns:30px minmax(0,1fr) 28px 36px 28px 54px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.crow:last-child{border-bottom:0}
.crow>b,.crow>span.nn{font:600 12.5px var(--font-mono);text-align:center}
.crow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center}
.lane select{width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.swopt{display:inline-flex;gap:6px;align-items:center}
.swopt i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;border:1px solid var(--line)}
.sv-water{fill:color-mix(in srgb,var(--sw,var(--water)) 18%,transparent)}
.sv-ball{fill:var(--sb,var(--ball))}
.goalfx{padding:10px 12px;border-radius:8px;background:var(--ball);color:var(--ball-ink);font:800 16px var(--font-display);text-align:center;letter-spacing:.04em}
tr.pick{cursor:pointer}
@media (max-width:700px){
  .x{display:none}
  .ph{display:none}
  .sortsel{display:flex}
  .pr.sq,.pr.mk{grid-template-columns:42px minmax(0,1fr) auto auto;grid-template-areas:"p n o g" "s s s s" "e e e e";row-gap:6px;padding:8px}
  .pr .c-pos{grid-area:p}.pr .c-name{grid-area:n}.pr .c-ovr{grid-area:o}.pr .c-pot{grid-area:g}
  .c-stats{display:grid;grid-area:s;grid-template-columns:repeat(8,1fr);gap:3px}
  .c-extra{display:flex;grid-area:e;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .st{height:34px;font-size:13px}
  .st::before{display:block;content:attr(data-l);font:600 8.5px var(--font-body);letter-spacing:.05em;opacity:.75;margin-bottom:-2px}
  .st{grid-template-rows:auto auto;place-items:center;align-content:center}
  .pr .btn.small{width:auto;padding:8px 14px}
  .crow{grid-template-columns:30px minmax(0,1fr) 26px 34px 24px}
  .crow .x{display:none}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
  .lane{grid-template-columns:36px minmax(0,1fr) auto}
}

.tabs{flex-wrap:wrap;overflow:visible}
td select,.tbl select{max-width:150px}
.hpcell{min-width:70px}.wbar{min-width:80px}
.ppanel .legend{font-size:11px;gap:2px 10px}
.ppanel .radar{max-width:200px}

.badge.cb{background:none;color:var(--ink);padding-inline:0;min-width:0;height:auto;gap:6px}
.badge.cb svg{width:22px;height:22px}
.badge.big.cb{min-width:0;height:auto;gap:3px;border-radius:0}
.badge.big.cb svg{width:54px;height:54px}
.ph .lbl{position:relative;display:inline-block;white-space:nowrap}
.ph .arr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-style:normal;font-size:9px;line-height:1;color:var(--ball)}
.racel{font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.pos-v,.neg-v{font-weight:600}
.pickgrid .club[aria-pressed="true"]{border-color:var(--water);box-shadow:0 0 0 2px var(--water) inset}
.prv{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.prv .pv-n{display:grid;gap:2px;min-width:0}.prv .pv-n small{color:var(--muted);font-size:11.5px}
.prv .nn{font-weight:700;min-width:24px;text-align:right}
.cgroup{display:grid;gap:8px}

.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.shape-btn{background:var(--surface2);border:2px solid transparent;border-radius:10px;padding:6px;display:grid;place-items:center;cursor:pointer}
.shape-btn[aria-pressed="true"]{border-color:var(--ink)}
.sw.wheel{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);position:relative;overflow:hidden}

.crestprev{display:grid;place-items:center;padding:10px;background:var(--surface2);border-radius:12px}
/* v0.5-dev3 : adéquation au poste, traits, codes de poste */
.fit{display:inline-flex;align-items:baseline;gap:4px;font:600 11px/1.3 var(--font-body);padding:2px 8px;border-radius:999px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 9%,transparent);white-space:nowrap}
.fit i{font:500 10.5px var(--font-mono);font-style:normal;opacity:.9}
.fit-spe{color:var(--good)}.fit-line{color:var(--water)}.fit-sec{color:var(--muted)}.fit-off{color:var(--bad)}
.trs{display:flex;flex-wrap:wrap;gap:4px}
.pr .trs,.prv .trs{flex-wrap:nowrap;overflow:hidden;margin-top:2px}
.tc{display:inline-flex;align-items:center;font:600 10.5px/1 var(--font-body);padding:3px 7px;border-radius:999px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 9%,transparent);white-space:nowrap}
.tc.up{color:var(--good)}.tc.dn{color:var(--bad)}
.st.tm-up{box-shadow:inset 0 -2px 0 var(--good)}.st.tm-dn{box-shadow:inset 0 -2px 0 var(--bad)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.two{display:grid;gap:2px;justify-items:start;min-width:0}
.two .ell{max-width:100%}
.pos{cursor:help}
.fit{cursor:help}
.gridcodes td,.gridcodes th{text-align:center}.gridcodes td:first-child,.gridcodes th:first-child{text-align:left}
@media (max-width:520px){.fit i{display:none}}
/* v0.5-dev3 (UI-08) : bilan de fin de match en lignes (cartes compactes sous 820 px) ; composition lisible à 390 px */
/* v0.6.1 (UI-18, retouche créateur) : bilan d'après-match. PC : texte chiffré AU-DESSUS de la barre pour HP et XP, les deux barres sur la même ligne (bas des deux cellules alignés),
   colonnes HP et XP de largeur fixe adaptée au texte (+ marge) ; mobile : HP et XP ont le même gabarit dans leur bloc : intitulé, barre, chiffres. */
.mtab{display:grid;gap:0}
.mh,.mr{display:grid;grid-template-columns:44px minmax(90px,240px) 48px 52px 40px 60px 128px minmax(250px,344px);gap:8px;align-items:center;justify-content:start}
.mh{padding:2px 0 8px;border-bottom:1px solid var(--line);font:700 10.5px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mh span{min-width:0;overflow-wrap:anywhere}
.mh .r,.mr .mc,.mr .m-rt{text-align:right}
.mr{padding:calc(7px*.9) 0;border-bottom:1px dashed var(--line);font-size:13px}
.mr:last-child{border-bottom:0}
.m-cells{display:contents}
.m-nm{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;min-width:0}
.m-nm b{min-width:0;overflow-wrap:anywhere}
.mc{display:flex;flex-wrap:wrap;gap:2px 6px;justify-content:flex-end;align-items:center;min-width:0;overflow-wrap:anywhere}
.mc::before{display:none}
.mc.m-hp,.mc.m-xp{display:grid;justify-content:stretch;align-self:end;gap:4px;text-align:left}
.mc.m-hp .hpt{font-size:12px;line-height:16px;text-align:left;white-space:nowrap}
.mc.m-hp .bar,.xpb{height:10px;box-sizing:border-box}
.mc.m-xp .xpc{width:100%}
.mc.m-xp .xpn{order:-1;min-height:16px}
@media (max-width:820px){
  .mtab{gap:calc(6px*.9)}
  .mh{display:none}
  .mr{grid-template-columns:42px minmax(0,1fr) auto;gap:calc(6px*.9) 8px;padding:calc(8px*.9);border:1px solid var(--line);border-radius:8px}
  .mr:last-child{border-bottom:1px solid var(--line)}
  .m-cells{display:grid;grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(6px*.9)}
  .mc,.mc.m-hp,.mc.m-xp{display:grid;align-content:start;align-self:auto;justify-content:stretch;gap:calc(3px*.9);padding:calc(4px*.9) 6px;border-radius:6px;background:var(--surface2);text-align:left}
  .mr .mc{text-align:left}
  .mc::before{display:block;content:attr(data-l);font:600 9px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .mc .tag{justify-self:start}
  .mc.m-hp,.mc.m-xp{grid-column:1/-1}
  .mc.m-hp .bar{order:1}.mc.m-hp .hpt{order:2}
  .mc.m-xp .xpn{order:0}
}
@media (max-width:520px){
  .lane{grid-template-columns:36px minmax(0,1fr);gap:4px 8px}
  .lane .fit{grid-column:2;justify-self:start}
  .lane .fit i{display:inline}
  .lane select{font-size:13px}
}

:root{--good-t:color-mix(in srgb,var(--good) 78%,var(--ink));--warn-t:color-mix(in srgb,var(--warn) 78%,var(--ink));--bad-t:color-mix(in srgb,var(--bad) 78%,var(--ink))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ev .dz{grid-column:2;min-width:0;font-style:normal;font-weight:400}
.dz-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-height:26px;padding:2px 8px 2px 4px;border-radius:6px;font:600 12px var(--font-body);color:var(--muted)}
.dz-btn:hover{color:var(--ink);background:var(--water-soft)}
.dz-btn:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.dz-ch{display:inline-block;width:12px;font-size:10px;transition:transform .15s}

.dz-m{display:inline-flex;gap:4px}
.dm{font-style:normal;font-weight:800;font-size:13px;color:var(--muted)}

.dm.bad,.df li.bad,.dl.bad .dr{color:var(--bad-t)}

.dl.good{border-left-color:var(--good)}
.dl.bad{border-left-color:var(--bad)}
.dk{font-weight:700}
.sp{font-style:normal;color:var(--muted)}
.dv{font-family:var(--font-mono);font-weight:500;border-bottom:2px solid var(--c,var(--line));white-space:nowrap}

<script>
// ==ENGINE START==
let rnd=Math.random;
let LANG='fr';
const L=(fr,en)=>LANG==='en'?en:fr;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:0;
function wpick(arr,wf){const ws=arr.map(wf);const t=sum(ws);let r=rnd()*t;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];}

// Caractéristiques inspirées de FFX
const STATS=['hp','vt','ph','at','ps','ti','in','ar'];
const SL={hp:'HP',vt:'VT',ph:'PH',at:'AT',ps:'PS',ti:'TI',in:'IN',ar:'AR'};
const POSW={
  GK:{ar:.55,in:.10,ps:.10,hp:.15,vt:.05,ph:.05},
  DF:{in:.22,at:.22,ph:.20,hp:.14,vt:.12,ps:.10},
  MF:{ps:.26,vt:.20,hp:.18,in:.14,ph:.08,at:.08,ti:.06},
  FW:{ti:.30,vt:.22,ps:.14,hp:.12,ph:.10,at:.06,in:.06}
};
const PROFILE={
  GK:{ar:14,in:4,ph:2,hp:2,ps:-2,vt:-6,at:-8,ti:-14},
  DF:{in:8,at:8,ph:10,hp:4,vt:0,ps:-2,ti:-10,ar:-14},
  MF:{ps:10,vt:4,hp:4,in:4,ph:0,at:0,ti:-2,ar:-16},
  FW:{ti:12,vt:8,ps:2,hp:0,ph:0,at:2,in:-4,ar:-16}
};
const RACES={
  humain:{n:['Humain','Human'],w:40,m:{},d:['Polyvalent : aucun point faible, aucun point fort.','Versatile: no real weakness, no real strength.']},
  albhed:{n:['Al Bhed','Al Bhed'],w:20,m:{ps:4,in:4,vt:2,ph:-5,at:-3,hp:-2},d:['Techniciens : meilleures passes et interceptions, mais fragiles aux tacles.','Technicians: better passing and interceptions, but fragile in tackles.']},
  ronso:{n:['Ronso','Ronso'],w:15,m:{hp:5,ph:6,at:4,vt:-8,ps:-3,in:-2},d:['Costauds : endurance, tacles et résistance hors normes, mais lents à la nage.','Hulking: huge stamina, tackles and toughness, but slow swimmers.']},
  guado:{n:['Guado','Guado'],w:12,m:{ti:5,ar:3,in:2,hp:-4,ph:-3,vt:-3},d:['Longues portées : tirs et arrêts puissants, endurance et vitesse limitées.','Long reach: powerful shots and saves, limited stamina and speed.']},
  hypello:{n:['Hypello','Hypello'],w:13,m:{vt:6,hp:3,ph:-6,at:-2},d:['Nageurs nés : rapides et endurants, mais se font bousculer facilement.','Born swimmers: fast and enduring, but easily bumped off the ball.']}
};
const pickRace=()=>wpick(Object.keys(RACES),k=>RACES[k].w);
const raceMod=(p,s)=>(RACES[p.race||'humain'].m[s]||0);
const raceName=p=>RACES[p.race||'humain'].n[LANG==='en'?1:0];
// ---- v0.5-dev1 (TAC-05) : adéquation au poste ----
// Poste = ligne (GK, DF, MF, FW) + voie (G/C/D) imposée par la formation (slotSides). p.side est la spécialité de voie du joueur.
// Un seul tableau pour eff (composition, affichage) et stv (match) : spécialité +5 %, autre voie de la même ligne +2,5 %,
// ligne secondaire 0 %, hors ligne −12 % ; gardien dans son but +3 %. Jamais de malus de voie en secondaire ni hors ligne.
const FIT_SPEC=.05,FIT_LINE=.025,FIT_SEC=0,FIT_OFF=-.12,FIT_GK=.03;
// fitTier(p, slot, lane) → {id:'spe'|'line'|'sec'|'off', eff, stv} (eff et stv = multiplicateurs, ex. 1,05).
// Gardien dans le but : id 'spe' (+3 %). Joueur de champ au but, ou gardien sur un poste de champ : 'off'. lane absente : la spécialité du joueur.
function fitTier(p,slot,lane){
  let id,v;
  if(slot==='GK'){if(p.pos==='GK'){id='spe';v=FIT_GK;}else{id='off';v=FIT_OFF;}}
  else if(p.pos==='GK'){id='off';v=FIT_OFF;}
  else if(p.pos===slot){const l=lane?String(lane).toUpperCase():p.side;if(l===(p.side||'C')){id='spe';v=FIT_SPEC;}else{id='line';v=FIT_LINE;}}
  else if(p.sec&&p.sec[slot]){id='sec';v=FIT_SEC;}
  else{id='off';v=FIT_OFF;}
  return{id,eff:1+v,stv:1+v};
}
function slotSides(slots){const cnt={},seen={};slots.forEach(s=>cnt[s]=(cnt[s]||0)+1);return slots.map(s=>{const k=seen[s]||0;seen[s]=k+1;const c=cnt[s];if(s==='GK'||c===1)return'C';if(c===2)return k===0?'G':'D';return['G','C','D'][k];});}

function bestLineup(team,formation){

  M.last=hb;
  const A=idx(at,M.n),D=idx(df,M.n),Dn=D.filter(o=>o.s!=='GK');
  const attM=STYLE[at.style].att*(counter?1.1:1),defM=STYLE[df.style].def*(1+.04*df.press);
  const kA=1+.25*at.press,kD=1+.25*df.press,touched=new Set();
  const cost=(o,n,k)=>{o.p.hp=Math.max(0,o.p.hp-n*k);touched.add(o.p);};
  const ev={sd,t:clk(M.n+1),type:'turn',txt:'',goal:false,si:-1,ci:-1,duels:[]};
  const attSty=attM,defSty=STYLE[df.style].def,defPr=1+.04*df.press;
  const end=(type,txt,b)=>{ev.type=type;ev.txt=txt;if(b)M.bias=b;};
  const dw=o=>({DF:2,MF:1.5,FW:.5}[o.s]);
  const car=wpick(A.filter(o=>o.s!=='GK'),o=>({MF:2,FW:1.4,DF:1}[o.s])*Math.pow(stv(o,'vt')/50,2));
  ev.ci=car.i;cost(car,14,kA);
  const dfd=wpick(Dn,o=>dw(o)*Math.pow(stv(o,'at')/50,1.5));
  const atkP=stv(dfd,'at')*defM+.3*stv(dfd,'vt'),resi=stv(car,'ph')+.3*stv(car,'vt')*attM;
  const pT=clamp(.28*Math.pow(atkP/resi,1.5),.08,.55),dT=duelOf('tackle',dsd,dfd,'at',atkP,sd,car,'ph',resi,pT,duelF('a',dfd,'at',defSty,defPr),duelF('b',car,'ph',0,0),null);
  ev.duels.push(dT);
  if(rnd()<pT){
    dfd.p.m.tw++;cost(dfd,4,kD);
    end('tackle',cm('tackle',{d:nm(dfd.p),c:nm(car.p)}),dsd);
  }else{

      const rec=wpick(A.filter(o=>o!==holder&&o.s!=='GK'),o=>({FW:3,MF:1.5,DF:.4}[o.s]));
      cost(holder,9,kA);
      let arr=stv(holder,'ps')*attM*(.78+.2*rnd());
      const ic=wpick(Dn,dw);
      const a=stv(ic,'in')*defM*(.7+.6*rnd()),b=arr*(.7+.6*rnd());
      const dP=duelOf('pass',sd,holder,'ps',b,dsd,ic,'in',a,null,duelF('a',holder,'ps',attSty,0),duelF('b',ic,'in',defSty,defPr),1.3,rec);
      ev.duels.push(dP);
      if(a>b*1.3){
        dP.r='ko';
        ic.p.m.ic++;cost(ic,3,kD);holder.p.m.pf++;

      }
      if(a>b){arr*=.55;if(arr<20){dP.r='ko';holder.p.m.pf++;end('intercept',cm('weak',{h:nm(holder.p),i:nm(ic.p)}),dsd);alive=false;break;}}
      holder.p.m.pa++;assist=holder;holder=rec;passes++;ev.ci=holder.i;
    }
    if(alive){

      if(isFW||rnd()<.28){
        const lg=!isFW,S=holder.p,Sn=nm(S),gk=D[0],Gn=nm(gk.p);
        cost(holder,18,kA);S.m.sh++;ev.si=holder.i;
        let power=stv(holder,'ti')*attM*(.8+.4*rnd())*(lg?.85:1);
        const ic=wpick(Dn,dw);
        const a=stv(ic,'in')*defM*(.7+.6*rnd()),b=power*(.75+.5*rnd());
        const fS=duelF('a',holder,'ti',attSty,0),dS=duelOf('shot',sd,holder,'ti',b,dsd,ic,'in',a,null,fS,duelF('b',ic,'in',defSty,defPr),1.25);
        ev.duels.push(dS);
        if(a>b*1.25){
          dS.r='ko';

        }else{
          if(a>b)power*=.75;
          const arv=stv(gk,'ar')*(.7+.6*rnd());
          if(power<18)end('miss',cm('dry',{s:Sn}),dsd);
          else if(ev.duels.push(duelOf('save',sd,holder,'ti',power,dsd,gk,'ar',arv,null,fS,duelF('b',gk,'ar',0,0),GK_K)),power>arv*GK_K){
            ev.type='goal';ev.goal=true;S.m.g++;if(assist)assist.p.m.a++;
            df.lu.forEach(p=>p.m.ca++);
            if(hb)M.hs++;else M.as++;

          }else if(ev.duels[ev.duels.length-1].r='ko',rnd()<.2){
            end('miss',cm('miss',{s:Sn}),dsd);
          }else{
            gk.p.m.sv++;cost(gk,3,1);
            end('save',cm(lg?'saveFar':'save',{g:Gn,s:Sn}),dsd);
          }

        end('build',cm('build',{t:at.team.short,h:nm(holder.p)}));

    }
  }

function endMatch(M){M.over=true;M.status='over';M.winner=M.hs>M.as?'h':'a';}
function doSub(side,i,b){const out=side.lu[i];side.lu[i]=b;side.bench[side.bench.indexOf(b)]=out;b.m.played=true;side.subs++;return out;}
function aiSubs(side){
  while(side.subs<3){
    let best=null;
    side.lu.forEach((p,i)=>side.bench.forEach(b=>{
      if(b.inj)return;
      const gain=eff(b,side.slots[i],side.sides[i])-eff(p,side.slots[i],side.sides[i]);
      if(gain>3&&(!best||gain>best.gain))best={i,b,gain};
    }));
    if(!best)break;
    doSub(side,best.i,best.b);
  }
}
function prepAI(t){
  let bf='2-2-1',bv=-1;
  FORM_BASE.forEach(f=>{
    const sl=slotsOf(f),ss=lanesOf(t,f),v=avg(bestLineup(t,f).map((p,i)=>eff(p,sl[i],ss[i])));
    if(v>bv){bv=v;bf=f;}
  });
  t.formation=bf;
  t.style=pick(['equilibre','equilibre','offensif','defensif','contre']);
  t.press=pick([-1,0,0,1]);
  setAutoLineup(t);
}
function teamStats(M){
  const o={};
  ['h','a'].forEach(sd=>{
    const ps=[...M[sd].lu,...M[sd].bench],f=k=>sum(ps.map(p=>p.m[k]));
    o[sd]={poss:Math.round(M.poss[sd]/Math.max(1,M.n)*100),sh:f('sh'),pa:f('pa'),pf:f('pf'),tw:f('tw'),ic:f('ic'),g:sd==='h'?M.hs:M.as};
  });
  return o;
}
function finalizeMatch(M){
  const res={hs:M.hs,as:M.as,ot:M.ot,so:M.so,winner:M.winner,inj:[],mvp:null,ts:teamStats(M)};
  ['h','a'].forEach(sd=>{
    const side=M[sd],won=M.winner===sd;
    [...side.lu,...side.bench].forEach(p=>{
      const m=p.m;if(!m.played)return;
      let r=6+m.g*1.3+m.a*.7+m.sv*.35+m.tw*.3+m.ic*.3+m.pa*.05-m.pf*.15+(won?.35:-.25);
      if(p.pos==='GK'||p.pos==='DF')r-=m.ca*.25;else if(p.pos==='MF')r-=m.ca*.1;
      r+=(rnd()-.5)*.5;
      m.rating=Math.round(clamp(r,3,10)*10)/10;
      p.apps++;p.g+=m.g;p.a+=m.a;p.rs+=m.rating;p.cg+=m.g;p.ca+=m.a;p.capps++;p.crs=(p.crs||0)+m.rating;
      const fk=side.team.formation,ce=(p.comps=p.comps||{})[fk]||(p.comps[fk]={p:0,w:0});ce.p++;
      if(won){ce.w++;p.sw=(p.sw||0)+1;p.cw=(p.cw||0)+1;}
      const li=side.lu.indexOf(p),sl=li>=0?side.slots[li]:p.pos;p.posn=p.posn||{};p.posn[sl]=(p.posn[sl]||0)+1;
      if(rnd()<.03*(1+(1-hpPct(p)))){p.inj=ri(1,3);p.newInj=true;res.inj.push({tid:side.team.id,name:p.name,n:p.inj});}
      if(!res.mvp||m.rating>res.mvp.rating)res.mvp={id:p.id,name:p.name,rating:m.rating,sd};
    });
  });
  if(res.mvp){const mp=[...M.h.lu,...M.h.bench,...M.a.lu,...M.a.bench].find(q=>q.id===res.mvp.id);if(mp)mp.mvp=(mp.mvp||0)+1;}
  return res;
}
function simAuto(M){
  while(!M.over){
    liveStep(M);
    phase(M);
    if(M.status==='half'){aiSubs(M.h);aiSubs(M.a);halfStep(M);M.status='play';}
    if(M.n===27&&!M.ot){aiSubs(M.h);aiSubs(M.a);}
  }
  return finalizeMatch(M);
}
function simFixture(G,h,a){
  const H=G.teams[h],A=G.teams[a];
  if(h!==G.userId)prepAI(H);
  if(a!==G.userId)prepAI(A);
  const M=newMatch(H,A),res=simAuto(M);
  [[H,'h'],[A,'a']].forEach(([t,sd])=>{if(t.id!==G.userId)awardTeam(G,t,res.winner===sd,true);});
  return{M,res};
}
const RECOV=.5;
function afterDay(G){
  G.teams.forEach(t=>{
    t.players.forEach(p=>{
      const rec=RECOV+((t.id===G.userId&&(p.train||G.training)==='repos')?.2:0)+(t.id===G.userId?.02*specOn(G.coach,'cond'):0);
      if(p.inj>0&&!p.newInj)p.inj--;
      p.newInj=false;
      p.hp=Math.min(maxHP(p),p.hp+Math.round(maxHP(p)*rec));
    });
  });
}
function newSeason(G){
  const retired=[];
  G.teams.forEach(t=>{
    t.players=t.players.map(p=>{
      p.age++;
      if(p.age>=35){
        if(t.id===G.userId)retired.push(p.name);
        {const q=makePlayer(G,p.pos,t.level-4+ri(-3,3),ri(18,21));q.hist=[{k:'youth',s:G.season+1,c:t.short}];return q;}
      }
      (p.hist=p.hist||[]).push({k:'season',s:G.season,c:t.short,apps:p.apps,g:p.g,a:p.a,avg:p.apps?Math.round(p.rs/p.apps*10)/10:null,w:p.sw||0,lvl:p.lvl});p.hist=p.hist.slice(-40);
      if(p.age>=30)STATS.forEach(s=>{
        let d=-ri(0,2);if((s==='vt'||s==='hp')&&p.age>=32)d-=1;
        p.stats[s]=clamp(p.stats[s]+d,20,95);
      });
      p.pot=Math.max(p.pot,maxStat(p));
      p.g=0;p.a=0;p.apps=0;p.rs=0;p.sw=0;p.inj=0;p.hp=maxHP(p);p.wage=wageOf(p);
      return p;
    });
    setAutoLineup(t);
  });
  G.season++;G.day=0;G.results=[];
  G.schedule=makeSchedule(G.teams.length);
  G.table=G.teams.map(t=>({id:t.id,p:0,w:0,otw:0,otl:0,l:0,gf:0,ga:0,pts:0}));
  G.market=genMarket(G,8);
  return retired;
}

// ---------- UI-12a : « À faire » (pastilles), en-tête, barre mobile ----------
// todoLines(G) : lignes « À faire avant le match », par priorité, calculées depuis G seul (aucune clé ajoutée à G, rien n'est stocké).
// → [{id, go, sev, n, who?}] : go = page ciblée, sev = 'block' (bloquante) | 'warn' (ambre), n = nombre concerné ; le texte vient de todoText.
// Les pastilles (en-tête, barre) la lisent dès 12a ; le bloc « À faire » de l'Accueil la réutilisera en 12b.
function todoLines(G){
  const out=[],t=G&&G.teams&&G.userId!=null?G.teams[G.userId]:null;
  if(!t)return out;
  const lu=(t.lineup||[]).map(id=>t.players.find(p=>p.id===id)).filter(Boolean);
  const hurt=lu.filter(p=>p.inj>0);
  if(hurt.length)out.push({id:'inj',go:'lineup',sev:'block',n:hurt.length,who:hurt[0]});
  const tired=lu.filter(p=>!(p.inj>0)&&hpPct(p)<.5).length;
  if(tired)out.push({id:'tired',go:'lineup',sev:'warn',n:tired});
  if(G.cash<0)out.push({id:'cash',go:'finance',sev:'warn',n:1});
  const pts=sum(t.players.map(p=>p.pts||0));
  if(pts>0)out.push({id:'pts',go:'squad',sev:'warn',n:pts});
  if(G.coach&&coachLvl(G.coach).lvl>=SPEC_MIN&&!G.coach.spec)out.push({id:'spec',go:'coach',sev:'warn',n:1});
  return out;
}
function todoText(l){
  switch(l.id){
    case 'inj':return L(`${nm(l.who)} (${posCode(l.who)}) est blessé et titulaire`,`${nm(l.who)} (${posCode(l.who)}) is injured and starting`);
    case 'tired':return L(`${l.n} titulaire${l.n>1?'s':''} sous 50 % de HP`,`${l.n} starter${l.n>1?'s':''} under 50% HP`);
    case 'cash':return L('Budget négatif : recrutements bloqués','Negative budget: signings blocked');
    case 'pts':return L(`${l.n} point${l.n>1?'s':''} de talent à répartir`,`${l.n} talent point${l.n>1?'s':''} to spend`);
    default:return L('Choisis une spécialité (gratuite)','Pick a specialty (free)');
  }
}
// {section: {n: nombre de lignes, block: au moins une bloquante, tips: textes}} ; l'Accueil n'a jamais de pastille
function todoBySect(G){
  const by={};
  todoLines(G).forEach(l=>{const s=sectOf(l.go);if(s==='accueil')return;const b=by[s]||(by[s]={n:0,block:false,tips:[]});b.n++;if(l.sev==='block')b.block=true;b.tips.push(todoText(l));});
  return by;
}

// ---------- v0.6.3 : écran titre, Options sans partie, parcours, fenêtres, import / export ----------
// UI.scr : 'title' | 'opts' | 'flow' | 'game'. G peut être null sur title et opts. Rien n'est lu ni écrit dans la sauvegarde avant « Commencer la saison ».
// Lecture seule de la sauvegarde, sans effet de bord (aucun rnd(), G intact). st : 'none' | 'ok' | 'foreign' (JSON valide mais pas chargeable) | 'bad' (JSON illisible).
function peekSave(){
  let s=null;try{s=localStorage.getItem(KEY);}catch(e){}
  if(!s)return {st:'none'};
  let g;try{g=JSON.parse(s);}catch(e){return {st:'bad'};}
  if(!g||typeof g!=='object'||g.userId==null||!(g.v>=2&&g.v<=5))return {st:'foreign'};
  try{
    const t=g.teams[g.userId],num=(x,d)=>Number.isFinite(+x)?+x:d;
    return {st:'ok',club:String(t.name).slice(0,40),season:num(g.season,1),day:num(g.day,0),n:g.schedule.length};
  }catch(e){return {st:'foreign'};}
}
// Nom d'entraîneur : espaces multiples réduits, caractères de contrôle retirés, 20 points de code au plus.
function cleanCoachName(s){
  s=String(s==null?'':s).replace(/\s+/g,' ').replace(/[\u0000-\u001f\u007f-\u009f]/g,'').trim();
  return Array.from(s).slice(0,COACH_MAX).join('').trim();
}
// « A, B et C » / « A, B and C » : texte brut, l'appelant passe le résultat par esc().
function joinNames(list,lang){

// Ouvre / met à jour / ferme la fenêtre selon UI.dlg ({k:'sheet',i,t} ou {k:'welcome'}). focusSel : élément à focaliser après le rendu.
function renderDlg(focusSel){
  let root=document.getElementById('dlg');

    if(root)root.remove();

  }

  }
  root.innerHTML=`<div class="dlgback">${box}</div>`;

  const f=(focusSel&&root.querySelector(focusSel))||(d.k==='welcome'?root.querySelector('[data-a=wclose]'):root.querySelector('.dlgbox'));
  if(f&&f.focus)f.focus();
}
function dlgKeys(e){
  if(!UI.dlg)return;
  const box=document.querySelector('#dlg .dlgbox');if(!box)return;
  if(e.key==='Escape'){e.preventDefault();act(UI.dlg.k==='sheet'?'sheetclose':'wclose',{});return;}
  if(UI.dlg.k==='sheet'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();act('sheetnav',{d:e.key==='ArrowLeft'?'-1':'1'});return;}
  if(e.key==='Tab'){
    const f=Array.from(box.querySelectorAll('button:not([disabled]),input:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])'));
    if(!f.length){e.preventDefault();return;}
    const a=document.activeElement,i=f.indexOf(a);
    if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus();}
    else if(!e.shiftKey&&(i<0||i===f.length-1)){e.preventDefault();f[0].focus();}
  }
}

function seasonLines(){
  const u=U(),out=[];
  (G.results||[]).forEach((day,d)=>{
    const r=day&&day.find(x=>x.h===u.id||x.a===u.id);if(!r)return;
    const home=r.h===u.id,gf=home?r.hs:r.as,ga=home?r.as:r.hs;

function clubSeasonHTML(){
  const u=U(),ln=seasonLines(),S=G.stadium;
  const side=h=>{const a=ln.filter(x=>x.home===h);return{p:a.length,w:a.filter(x=>x.won).length,l:a.filter(x=>!x.won).length,gf:sum(a.map(x=>x.gf)),ga:sum(a.map(x=>x.ga))};};
  const hm=side(true),aw=side(false);
  const sline=(lab,o)=>`<div class="frow"><span class="muted">${lab} · ${o.p} ${L('m.','pl.')}</span><b class="mono">${o.p?`${o.w}${L('V','W')} ${o.l}${L('D','L')} · ${o.gf}–${o.ga}`:'–'}</b></div>`;
  const best=(arr,sgn)=>arr.reduce((b,x)=>!b||sgn*(x.gf-x.ga)>sgn*(b.gf-b.ga)?x:b,null);
  const bw=best(ln.filter(x=>x.won),1),bl=best(ln.filter(x=>!x.won),-1);

const SPH={VB:400,R:180,C:200,TR:12,LX:{GK:-.88,DF:-.56,MF:-.21,FW:.12},LANES:{1:[0],2:[-.26,.26],3:[-.36,0,.36]},JIT:.05,POS:.17,NEG:-.07,GOAL:19,CC:.25,ZW:.16};

// passe de séparation déterministe (aucun rnd) : toute paire à moins de SEP unités est écartée, chaque jeton ne s'éloigne pas de plus de SPH.MOVE·R de sa place, reste dans le cercle
SPH.SEP=26;SPH.MOVE=.15;
function sphereSeparate(out){
  const all=[...out.h,...out.a];if(all.length<2)return;
  const R=SPH.R,P=all.map(c=>({c,x0:c.x*R,y0:c.y*R,x:c.x*R,y:c.y*R})),mv=SPH.MOVE*R,lim=SPH.MAXD*R;
  const fit=p=>{let dx=p.x-p.x0,dy=p.y-p.y0,d=Math.hypot(dx,dy);if(d>mv){p.x=p.x0+dx*mv/d;p.y=p.y0+dy*mv/d;}d=Math.hypot(p.x,p.y);if(d>lim){p.x*=lim/d;p.y*=lim/d;}};
  for(let it=0;it<60;it++){
    let moved=false;
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
      const a=P[i],b=P[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d>=SPH.SEP)continue;
      if(d<1e-6){const t=(i*7+j*3)*.7;dx=Math.cos(t);dy=Math.sin(t);d=1;}
      const k=(SPH.SEP-d)/2/d*1.02;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k;fit(a);fit(b);moved=true;
    }

  }

}
function sphereLayout(spec){
  const out={h:[],a:[],ball:{x:0,y:0}};
  ['h','a'].forEach(sd=>{
    const t=spec[sd];if(!t)return;
    const sg=sd==='h'?1:-1,shift=spec.poss?(spec.poss===sd?SPH.POS:SPH.NEG):0,cnt={},seen={};
    t.slots.forEach(s=>{cnt[s]=(cnt[s]||0)+1;});
    t.slots.forEach((s,i)=>{
      const k=seen[s]||0;seen[s]=k+1;
      const ln=SPH.LANES[Math.min(3,cnt[s])],gk=s==='GK';
      const j=a=>Math.sin((spec.n+1)*12.9898+i*78.233+a+(sd==='a'?3.7:0))*SPH.JIT;
      let x=SPH.LX[s]+(gk?0:shift)+j(3),y=(gk?0:ln[k]||0)+j(gk?2:1)*(gk?.6:1);
      const d=Math.hypot(x,y);if(d>SPH.MAXD){x*=SPH.MAXD/d;y*=SPH.MAXD/d;}
      out[sd].push({x:sg*x,y:sg*y});

  const bl=spec.ball;

    const sg=bl.sd==='h'?1:-1,c=bl.si>=0&&out[bl.sd]?out[bl.sd][bl.si]:null;

  }
  return out;
}

// zone de la ligne visée par la consigne : bande hachurée (45° domicile, −45° visiteur) + glyphe ; mode 'always' : les trois lignes, la ligne active en plein
function sphereZones(spec,o){

const HPST={ok:['OK','OK'],warn:['Fatigué','Tired'],low:['Épuisé','Spent']};
const hpStTip=s=>s==='low'?L('Épuisé : moins de 10 HP, PS et TI divisés par 2','Spent: under 10 HP, PS and TI halved'):s==='warn'?L(`Fatigué : HP à ${Math.round(HP_WARN*100)} % du maximum ou moins`,`Tired: HP at ${Math.round(HP_WARN*100)}% of max or less`):L('En forme','Fresh');
const batIcon=s=>`<svg class="bat" viewBox="0 0 18 10" width="18" height="10" aria-hidden="true"><rect x=".75" y=".75" width="14.5" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="16" y="3" width="1.6" height="4" rx=".6" fill="currentColor"/><rect x="2.5" y="2.5" width="${s==='ok'?11:s==='warn'?5.5:1.3}" height="5" rx="1" fill="currentColor"/></svg>`;
const hpState=pl=>`<span class="hps hps-${pl.state}" title="${esc(hpStTip(pl.state))}">${batIcon(pl.state)}<span class="sr">${P(HPST[pl.state])}</span></span>`;
const hpBar3=pl=>{const v=clamp(pl.hp/pl.maxHP*100,0,100),c=pl.state==='low'?'var(--bad)':pl.state==='warn'?'var(--warn)':'var(--good)';return `<div class="bar"><i style="--w:${v}%;--c:${c}"></i><u style="left:${HP_WARN*100}%"></u><u style="left:${clamp(HP_LOW/pl.maxHP*100,0,100)}%"></u></div>`;};
// repère les joueurs de l'équipe du joueur qui passent « épuisé » (une alerte par passage, bandeau + ligne dans le fil)
function trackAlerts(Lv){
  const M=Lv.M,u=Lv.userSide,side=M[u],low=Lv.low||(Lv.low=new Set()),al=Lv.alerts||(Lv.alerts=[]);
  matchInfo(M,u).players.forEach(pl=>{
    const p=side.lu[pl.i];if(!p)return;
    if(pl.state!=='low'){low.delete(p.id);return;}
    if(low.has(p.id))return;
    low.add(p.id);
    const txt=L(`${nm(p)} est épuisé (${Math.round(pl.hp)} HP) : PS et TI divisés par 2.`,`${nm(p)} is spent (${Math.round(pl.hp)} HP): PS and TI halved.`);
    al.push({until:M.n+3,txt});
    M.log.push({sd:u,t:clk(M.n),type:'sys',txt:'⚠ '+txt});
  });
}
const MSTAT=()=>[[L('Possession (%)','Possession (%)'),'poss'],[L('Tirs','Shots'),'sh'],[L('Passes réussies','Completed passes'),'pa'],[L('Tacles gagnés','Tackles won'),'tw'],[L('Interceptions','Interceptions'),'ic']];
function updateLive(){
  const Lv=UI.live;if(!Lv||Lv.done)return;
  const M=Lv.M,u=Lv.userSide,$=id=>document.getElementById(id);
  if(!$('score'))return;
  $('score').textContent=`${M.hs} – ${M.as}`;
  $('clock').textContent=clockText(M);
  $('prog').style.setProperty('--w',Math.min(100,M.n/36*100)+'%');
  feedFill($('feed'),M,`<p class="hint">${L('Le match va commencer.','The match is about to start.')}</p>`);
  const half=M.status==='half';
  const ge=M.ev&&M.ev.goal&&G.stadium.cu.fx&&!M.over?M.ev:null;
  const bn=[];
  if(ge){const mine=ge.sd===u;bn.push(`<div class="goalfx ${mine?'us':'them'}" role="status"><span class="gb">${badge(M[ge.sd].team)}</span><span class="gl"><i aria-hidden="true">${mine?'▲':'▼'}</i><b>${mine?L('BUT !','GOAL!'):L('BUT ADVERSE','OPPONENT GOAL')}</b></span><span class="gt">${esc(ge.txt.replace(/^BUT ! |^GOAL! /,'').split(/[.!]/)[0])}</span></div>`);}
  if(half)bn.push(`<div class="banner">${L(`Mi-temps · ${M.hs} – ${M.as}. Ajuste ta tactique ou tes remplacements, puis reprends.`,`Half-time · ${M.hs} – ${M.as}. Adjust your tactics or substitutions, then resume.`)}</div>`);
  (Lv.alerts||[]).filter(a=>M.n<a.until).forEach(a=>bn.push(`<div class="banner warn"><i aria-hidden="true">⚠</i>${esc(a.txt)}</div>`));
  $('banner').innerHTML=bn.join('');
  $('pausebtn').textContent=half?L('Reprendre le match','Resume the match'):Lv.paused?(M.n===0?L(`Coup d'envoi`,'Kick-off'):L('Reprendre','Resume')):'Pause';
  const side=M[u];
  const mi=matchInfo(M,u);
  $('lineup').innerHTML=side.lu.map((p,i)=>{const pl=mi.players[i];return `<div class="lu-row live">${slotTag(side.slots[i],side.sides[i])}<span class="nm">${esc(p.name)}</span>${fitBadge(p,side.slots[i],side.sides[i],true)}${hpBar3(pl)}<span class="mono">${Math.round(pl.hp/pl.maxHP*100)}%</span>${hpState(pl)}<button class="btn small" data-a="subopen" data-i="${i}" aria-label="${L('Remplacer','Replace')} ${esc(p.name)}" ${side.subs>=3?'disabled':''}>⇄</button></div>`;}).join('');
  $('subinfo').textContent=L(`Remplacements : ${side.subs}/3 · sous 10 HP, PS et TI sont divisés par 2`,`Substitutions: ${side.subs}/3 · below 10 HP, PS and TI are halved`);
  $('subpanel').innerHTML=Lv.subSlot==null?'':subPanel(Lv);
  const ts=teamStats(M);
  $('mstats').innerHTML=MSTAT().filter(x=>x[1]!=='poss').map(([l,k])=>cmpRow(l,ts.h[k],ts.a[k])).join('');
  const tt=` · ${esc(M.h.team.short)} – ${esc(M.a.team.short)}`;
  $('minfo').innerHTML=cmpRow(L('Possession cumulée','Total possession')+tt,mi.poss.h,mi.poss.a)+cmpRow(L('Possession récente (6 phases)','Recent possession (6 phases)')+tt,mi.poss6.h,mi.poss6.a)
    +`<p class="hint hpleg">${['ok','warn','low'].map(s=>`<span class="hps hps-${s}">${batIcon(s)}<b>${P(HPST[s])}</b></span>`).join(' ')} · ${L(`fatigué ≤ ${Math.round(HP_WARN*100)} % des HP, épuisé < ${HP_LOW} HP`,`tired ≤ ${Math.round(HP_WARN*100)}% of HP, spent < ${HP_LOW} HP`)}</p>`;
  const hs=$('halfsec');
  if(hs){
    hs.hidden=M.over||M.ot||!Lv.paused;
    if(!hs.hidden){const hp=$('halfpanel'),ae=document.activeElement,fo=ae&&hp.contains&&hp.contains(ae)?ae:null,fk=fo&&fo.dataset?`[data-a="${fo.dataset.a}"]${fo.dataset.v!=null?`[data-v="${fo.dataset.v}"]`:''}`:null;
      hp.innerHTML=halfPanelHTML(Lv);
      if(fk){const nf=hp.querySelector(fk);if(nf)nf.focus();}}   // le panneau est redessiné à chaque choix : le focus clavier reste sur la même commande
  }
  const chips=halfChips(Lv,u).concat(halfChips(Lv,u==='h'?'a':'h'));
  $('halfbadge').innerHTML=chips.length?`<div class="hbadge"><span class="hl">${L('Consigne','Instruction')}</span>${chips.join('')}</div>`:'';
  updatePitch();
}
function subPanel(Lv){
  const side=Lv.M[Lv.userSide],i=Lv.subSlot,slot=side.slots[i],sd=side.sides[i],out=side.lu[i];
  const cands=side.bench.filter(b=>!b.inj).sort((a,b)=>eff(b,slot,sd)-eff(a,slot,sd));
  return `<div class="stack tight" style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px"><h3>${L('Remplacer','Replace')} ${esc(out.name)}</h3>${cands.map(b=>`<div class="bench-row">${posTag(b)}<span class="two"><span class="ell">${esc(b.name)}</span>${fitBadge(b,slot,sd,true)}</span><span class="mono">${Math.round(eff(b,slot,sd))}</span>${barH(hpPct(b)*100)}<button class="btn small primary" data-a="dosub" data-id="${b.id}">${L('Entrer','Come on')}</button></div>`).join('')||`<p class="hint">${L('Aucun remplaçant disponible.','No substitute available.')}</p>`}<button class="btn small" data-a="subclose" style="justify-self:start">${L('Annuler','Cancel')}</button></div>`;
}
// UI-15 : barre de niveau (fait / gagné hachuré) + chiffres secondaires ; p.lvl et p.xp sont déjà ceux d'après le match
function xpCell(r){
  const p=r.p,gain=r.xp+(r.tx||0),max=p.lvl>=MAXLVL,need=xpNeed(p.lvl),after=max?need:p.xp;
  const before=max?need:r.ups?0:Math.max(0,after-gain);
  const w0=Math.min(100,before/need*100),w1=Math.min(100-w0,(after-before)/need*100);
  const pts=r.ups?r.ups*(p.age<=23?3:2):0;
  const pill=r.ups?`<span class="lvup"><i aria-hidden="true">▲</i>${L('Niv.','Lvl')} ${p.lvl-r.ups} → ${p.lvl}</span>`:'';
  const lab=L(`+${gain} XP, niveau ${p.lvl}${max?' (max)':`, ${after}/${need}`}`,`+${gain} XP, level ${p.lvl}${max?' (max)':`, ${after}/${need}`}`);
  const gn=(r.gain||[]),gtxt=gn.map(g=>`+${g.d} ${SL[g.s]}`).join(', ');
  const gp=`<span class="xpg">${gn.map(g=>`<span class="gpill" title="${esc(P(STATN[g.s]))}" aria-label="${esc(`+${g.d} ${P(STATN[g.s])}`)}">+${g.d} ${SL[g.s]}</span>`).join('')}</span>`;   // emplacement toujours présent : les barres d'XP restent alignées d'une ligne à l'autre
  return `<div class="xpc" role="group" aria-label="${esc(lab+(gtxt?', '+L('entraînement','training')+' '+gtxt:''))}"><div class="xpr"><div class="xpb"><i class="x0" style="width:${w0}%"></i><i class="x1" style="width:${w1}%"></i></div>${gp}</div><div class="xpn"><b class="mono">+${gain} XP</b>${pill}<span class="muted mono">${L('Niv.','Lvl')} ${p.lvl}${max?' max':` · ${after}/${need}`}${pts?` · +${pts} pts`:''}${r.tx?` · ${L('dont','incl.')} +${r.tx} ${L('entr.','trn.')}`:''}</span></div></div>`;
}

    const p=r.p,m=p.m,end=Math.round(r.hpEnd/maxHP(p)*100),next=Math.round(Math.min(maxHP(p),r.hpEnd+Math.round(maxHP(p)*(RECOV+(r.prog==='repos'?.2:0))))/maxHP(p)*100);

  const finRows=[[L('Sponsor','Sponsor'),fin.sponsor],[L('Billetterie','Gate'),fin.gate],[L('Buvettes','Concessions'),fin.conc],[L('Prime de victoire','Win bonus'),fin.bonus],[L('Salaires','Wages'),-fin.wages],['Staff',-fin.staff],[L('Programmes individuels','Individual programmes'),-fin.train],[L('Entretien du stade','Stadium upkeep'),-fin.upk]].map(([l,v])=>`<div class="frow"><span class="muted">${l}</span><b class="mono ${v<0?'neg-v':v>0?'pos-v':''}">${signed(v)}</b></div>`).join('');

  return `<div class="stack"><section class="panel stack"><h3>${L('Coup de sifflet final','Final whistle')}</h3>
  <div class="scoreboard"><div class="tm">${badge(H,true)}<span class="tn">${esc(H.name)}</span></div><div class="score">${res.hs} – ${res.as}</div><div class="tm r"><span class="tn">${esc(A.name)}</span>${badge(A,true)}</div></div>
  <h2 style="text-align:center">${won?L('Victoire','Victory'):L('Défaite','Defeat')} ${how}</h2>
  ${res.mvp?`<p class="muted" style="text-align:center">${L('Meilleure note','Top rating')} : <b style="color:var(--ink)">${esc(res.mvp.name)}</b> (${res.mvp.rating.toFixed(1)})</p>`:''}
  ${rep.cxp?`<p class="muted" style="text-align:center;font-size:13px">${L('Entraîneur','Coach')} +${rep.cxp} XP · ${L('niveau','level')} ${rep.clvl}</p>`:''}${rep.up?`<div class="alert">${L(`Niveau d’entraîneur ${rep.clvl} !`,`Coach level ${rep.clvl}!`)} ${rep.newForms.length?L('Nouvelle composition : ','New formation: ')+`<b>${rep.newForms.join(', ')}</b>`:''} <button class="btn small" data-a="tab" data-t="lineup">${L('Tactique','Tactics')}</button></div>`:''}${res.inj.filter(i=>i.tid===G.userId).map(i=>`<div class="alert warn">${L(`${esc(i.name)} est blessé pour ${i.n} journée${i.n>1?'s':''}.`,`${esc(i.name)} is injured for ${i.n} matchday${i.n>1?'s':''}.`)}</div>`).join('')}${newB}</section>
  <div class="grid2"><section class="panel"><h3>${L('Statistiques','Statistics')}</h3><div class="stack tight" style="margin-top:12px">${MSTAT().map(([l,k])=>cmpRow(l,ts.h[k],ts.a[k])).join('')}</div></section>
  <section class="panel"><h3>${L('Bilan financier','Finances')}</h3><div style="margin-top:8px">${finRows}<div class="frow tot"><span>${L('Résultat net','Net result')}</span><b class="mono ${fin.net>=0?'pos-v':'neg-v'}">${signed(fin.net)}</b></div><div class="frow"><span class="muted">${L('Nouveau budget','New budget')}</span><b class="mono">${fmt(fin.bal)} gils</b></div></div></section></div>

  <details style="flex:1;min-width:240px"><summary>${L('Revoir le fil du match','Review the match feed')}</summary><div class="feed" id="sfeed">${M.log.slice().reverse().map(e=>evHTML(M,e)).join('')}</div></details></div></div>`;

// ---------- Flux de jeu ----------
function stopTimer(){clearTimeout(UI.timer);UI.timer=null;}
function startLive(){
  const u=U(),[h,a]=todayFx(),opp=G.teams[h===u.id?a:h];
  prepAI(opp);
  const M=newMatch(G.teams[h],G.teams[a]);
  UI.live={M,paused:true,speed:1,subSlot:null,done:false,res:null,rep:null,userSide:h===u.id?'h':'a',dotKey:'',open:new Set(),alerts:[],low:new Set(),halfPick:null,halfDone:false,hb:1,souf:{h:null,a:null},start:new Set(M[h===u.id?'h':'a'].lu.map(p=>p.id))};
  UI.tab='match';render();
}
function nextTick(){
  stopTimer();
  const Lv=UI.live;if(!Lv||Lv.done||Lv.paused||Lv.M.over||Lv.M.status==='half')return;
  UI.timer=setTimeout(tick,1250/Lv.speed);
}
function tick(){
  const Lv=UI.live;if(!Lv||Lv.done||Lv.paused)return;
  const M=Lv.M;
  liveAI(Lv,Lv.userSide==='h'?'a':'h');   // MAT-04 : l'adversaire donne ses consignes en direct (aiLive), comme simAuto
  phase(M);
  const opp=Lv.userSide==='h'?M.a:M.h;
  if(M.n===27&&!M.ot)aiSubs(opp);
  if(M.status==='half'){aiSubs(opp);Lv.paused=true;}
  if(M.over){finishLive();return;}
  trackAlerts(Lv);
  updateLive();nextTick();
}
function finishLive(){
  const Lv=UI.live;stopTimer();
  Lv.res=finalizeMatch(Lv.M);Lv.done=true;Lv.subSlot=null;
  const opp=Lv.userSide==='h'?Lv.M.a.team:Lv.M.h.team;
  awardTeam(G,opp,Lv.res.winner!==Lv.userSide,true);
  makeReport(Lv);render();
}
function quickSim(){
  stopTimer();
  const u=U(),[h,a]=todayFx();
  const {M,res}=simFixture(G,h,a);
  const Lv={M,paused:true,speed:1,subSlot:null,done:true,res,rep:null,userSide:h===u.id?'h':'a',open:new Set()};
  UI.live=Lv;makeReport(Lv);UI.tab='match';render();
}
// UI-24 : résultat net d'un match du club selon l'issue (won) et le lieu (home), avec les installations et salaires actuels.
// Source unique du bilan d'après-match (makeReport) et du tableau de bord (prévision) : seule la prime de victoire dépend de won.
// home : par défaut le prochain match ; fee : programmes individuels (par défaut indivFee actuel, makeReport passe la valeur calculée avant le match).
function netIf(won,home,fee){
  const u=U();
  if(home==null){const fx=todayFx();home=fx[0]===u.id;}
  if(fee==null)fee=indivFee(u);
  const sponsor=sponsorOf(G),gate=gateOf(G,home),conc=concOf(G,home),upk=upkeepOf(G),bonus=won?1500:0,wages=sum(u.players.map(p=>p.wage)),staff=800;
  return{sponsor,gate,conc,bonus,wages,staff,train:fee,upk,net:sponsor+gate+conc+bonus-wages-staff-fee-upk};
}
function makeReport(Lv){
  const u=U(),res=Lv.res,won=res.winner===Lv.userSide,home=Lv.userSide==='h';
  const hpEnd={};u.players.forEach(p=>{hpEnd[p.id]=p.hp;});
  const fee=indivFee(u),nIndiv=u.players.filter(p=>p.train&&!p.inj).length;
  const rows=awardTeam(G,u,won,false).map(r=>({...r,hpEnd:hpEnd[r.p.id]}));
  const before={};u.players.forEach(p=>{before[p.id]=Object.assign({},p.stats);});   // UI-23 : copie des stats avant trainGain (moteur non touché)
  const tg=trainGain(G,u);
  rows.forEach(r=>{const b=before[r.p.id];r.gain=b?STATS.filter(k=>r.p.stats[k]>b[k]).map(k=>({s:k,d:r.p.stats[k]-b[k]})):[];});
  const {sponsor,gate,conc,upk,bonus,wages,staff,net}=netIf(won,home,fee);   // UI-24 : même fonction que le tableau de bord
  G.cash+=net;G.fans=clamp(G.fans+fanDelta(G,won),300,6000);
  const fin={sponsor,gate,conc,bonus,wages,staff,train:fee,upk,net,bal:G.cash};
  G.finLog.unshift({s:G.season,d:G.day+1,...fin});G.finLog=G.finLog.slice(0,28);
  const rm=recordMatch(G,res,Lv.userSide);
  Lv.rep={rows,tg,fin,badges:rm.badges,nIndiv,cxp:rm.xp,clvl:rm.lvl,up:rm.up,newForms:rm.newForms};
}
function completeDay(Lv){
  const u=U(),day=G.day,out=[];
  G.schedule[day].forEach(([h,a])=>{
    const mine=h===u.id||a===u.id;
    const res=mine?Lv.res:simFixture(G,h,a).res;
    applyResult(G,h,a,res);
    out.push({h,a,hs:res.hs,as:res.as,ot:res.ot,so:res.so});
    res.inj.forEach(i=>{if(i.tid===u.id)news(L(`${i.name} se blesse (${i.n} journée${i.n>1?'s':''}).`,`${i.name} is injured (${i.n} matchday${i.n>1?'s':''}).`),'effectif',1);});
  });
  G.results[day]=out;
  const res=Lv.res,home=Lv.userSide==='h',won=res.winner===Lv.userSide;
  const opp=Lv.M[home?'a':'h'].team;
  news(L(`${won?'Victoire':'Défaite'} ${res.hs}–${res.as}${res.ot?' (prol.)':''} ${home?'contre':'à'} ${opp.short}. Résultat net : ${signed(Lv.rep.fin.net)} gils.${res.mvp?` Meilleure note : ${res.mvp.name}.`:''}`,`${won?'Win':'Loss'} ${res.hs}–${res.as}${res.ot?' (OT)':''} ${home?'vs':'at'} ${opp.short}. Net result: ${signed(Lv.rep.fin.net)} gil.${res.mvp?` Top rating: ${res.mvp.name}.`:''}`),'match');
  const ups=Lv.rep.rows.filter(r=>r.ups>0);
  if(ups.length)news(L('Niveau supérieur : ','Level up: ')+ups.slice(0,4).map(r=>`${r.p.name} (${L('niv','lvl')} ${r.p.lvl})`).join(', ')+(ups.length>4?` (+${ups.length-4})`:'')+'.','effectif');
  if(Lv.rep.tg.length)news(L('Entraînement : ','Training: ')+Lv.rep.tg.slice(0,4).join(', ')+'.','effectif');
  if(Lv.rep.up)news(L(`Niveau d’entraîneur ${Lv.rep.clvl}`,`Coach level ${Lv.rep.clvl}`)+(Lv.rep.newForms.length?' : '+Lv.rep.newForms.join(', ')+'.':'.'),'club');
  Lv.rep.badges.forEach(b=>news(L('Badge obtenu : ','Badge earned: ')+P(b.n)+'.','club'));
  afterDay(G);
  {const f0=G.finLog[0],f1=G.finLog[1];if(f0&&f0.bal<0&&!(f1&&f1.bal<0))news(L('Budget négatif : les recrutements sont bloqués.','Negative budget: signings are blocked.'),'finances',1);}
  G.day++;
  if(G.day%3===0&&G.day<G.schedule.length)G.market=genMarket(G,8);
  ensureLineup(u);
  checkBadges(G,{});
  UI.live=null;UI.tab='home';UI.resDay=null;
  save();render();window.scrollTo(0,0);
  if(G.cash<0)toast(L('Budget négatif : les recrutements sont bloqués.','Negative budget: signings are blocked.'),true);
}
function endSeasonUI(){
  const st=sortedTable(G),u=U(),rank=st.findIndex(r=>r.id===u.id)+1,me=G.table[u.id];
  G.cash+=PRIZES[rank-1];
  G.honors.push({s:G.season,rank,pts:me.pts,w:me.w,l:me.l+me.otl,gf:me.gf,ga:me.ga,champ:G.teams[st[0].id].name});
  G.coach.seasons++;
  const nb=checkBadges(G,{});
  stampNews();
  const retired=newSeason(G);
  news(L(`Saison ${G.season} lancée. Prime de fin de saison : ${fmt(PRIZES[rank-1])} gils (${rankTxt(rank)}).`,`Season ${G.season} started. End-of-season prize: ${fmt(PRIZES[rank-1])} gil (${rankTxt(rank)}).`),'club');
  if(retired.length)news(L(`Retraite : ${retired.join(', ')}. Des jeunes espoirs les remplacent.`,`Retired: ${retired.join(', ')}. Young prospects take their place.`),'club');
  nb.forEach(b=>news(L('Badge obtenu : ','Badge earned: ')+P(b.n)+'.','club'));
  UI.tab='home';UI.live=null;save();render();
}

      break;}
    case 'totitle':{

    case 'coachok':{const i=document.getElementById('coach-draft');UI.draft.coach=cleanCoachName(i?i.value:UI.draft.coach);UI.step=2;render();window.scrollTo(0,0);break;}

      render();window.scrollTo(0,0);break;}
    case 'sheet':UI.dlg={k:'sheet',i:+d.i,t:UI.prev};renderDlg();break;
    case 'sheetnav':{if(!UI.dlg||UI.dlg.k!=='sheet')break;UI.dlg.i+=+d.d;renderDlg(`[data-a=sheetnav][data-d="${+d.d}"]`);break;}
    case 'sheetclose':{const i=UI.dlg?UI.dlg.i:0;UI.dlg=null;renderDlg();const b=app.querySelector(`[data-a=sheet][data-i="${i}"]`);if(b)b.focus();break;}
    case 'wclose':case 'wrules':{

      break;}
    case 'wpref':PREFS.hideWelcome=d.v==='off';savePrefs();render();break;
    case 'exp':exportNow();break;
    case 'copysave':copyNow();break;
    case 'pastesave':{xreset();UI.xpaste=true;render();const t=document.getElementById('xpaste');if(t)t.focus();break;}
    case 'xsel':{const t=document.getElementById('xcopy');if(t){t.focus();t.select();try{if(document.execCommand('copy'))toast(T('x.ok.copy'));}catch(e){}}break;}
    case 'xclose':xreset();render();break;
    case 'xpgo':{const t=document.getElementById('xpaste');if(t)UI.xptxt=t.value;importText(UI.xptxt,'text');break;}
    case 'imp':{const f=document.getElementById('impfile');if(f)f.click();break;}
    case 'impok':{const g=UI.xpend;if(g)applyImport(g);break;}
    case 'impno':xreset();render();break;
    case 'sort':{
      const m=d.w==='m',cur=m?UI.msort:UI.sort;
      if(cur===d.k){if(m)UI.mdir=-UI.mdir;else UI.sdir=-UI.sdir;}

    case 'msel':UI.msel=+d.id;render();toPanel();break;
    case 'csel':UI.csel=+d.id;render();toPanel();break;
    case 'oppcard':{UI.csel=+d.id;UI.tab='table';UI.last.jouer='table';UI.confirm=null;render();window.scrollTo(0,0);break;}
    case 'jf':UI.jf=d.v;UI.jn=JPAGE;render();break;
    case 'jmore':UI.jn+=JPAGE;render();break;
    case 'ptab':UI.ptab=d.v;render();break;
    case 'cspec':{const C=G.coach;if(coachLvl(C).lvl<SPEC_MIN||C.spec===d.v||!SPECS[d.v])break;const cost=C.spec?SPEC_COST:0;if(G.cash<cost){toast(L('Budget insuffisant.','Not enough budget.'),true);break;}G.cash-=cost;C.spec=d.v;save();render();toast(L('Spécialité choisie.','Specialty chosen.'));break;}
    case 'rtab':UI.rtab=d.v;render();break;
    case 'gorules':pauseLive();UI.rtab=d.v;UI.tab='rules';UI.last.options='rules';render();window.scrollTo(0,0);break;
    case 'ctab':UI.ctab=d.v;render();break;
    case 'sortdir':{if(d.w==='m')UI.mdir=-UI.mdir;else UI.sdir=-UI.sdir;render();break;}
    case 'upfac':{const r=upgradeFac(G,d.k);if(r==='ok'){news(L(`Stade : ${P(FACD[d.k].n)} niveau ${G.stadium.lv[d.k]}.`,`Stadium: ${P(FACD[d.k].n)} level ${G.stadium.lv[d.k]}.`),'club');checkBadges(G,{});save();render();toast(L('Installation améliorée.','Facility upgraded.'));}else toast(r==='cash'?L('Budget insuffisant.','Not enough budget.'):L('Niveau maximum.','Maximum level.'),true);break;}
    case 'scust':{const cu=G.stadium.cu;cu[d.k]=d.k==='fx'?+d.v:d.v;save();render();break;}
    case 'spend':{const p=u.players.find(x=>x.id===+d.id),s=d.s;if(p&&p.pts>0&&p.stats[s]<capOf(p,s)){p.stats[s]++;p.pts--;save();render();}break;}
    case 'alloc':{const p=u.players.find(x=>x.id===+d.id);autoAlloc(p,p.train||G.training);save();render();break;}

      const p=u.players.find(x=>x.id===+d.id);

      if(p.pos==='GK'&&u.players.filter(x=>x.pos==='GK').length<=1){toast(L('Garde au moins un gardien.','Keep at least one keeper.'),true);UI.confirm=null;render();break;}

      news(L(`${p.name} quitte le club.`,`${p.name} leaves the club.`),'marche');UI.confirm=null;UI.sel=null;ensureLineup(u);save();render();toast(L(`${p.name} libéré.`,`${p.name} released.`));break;}
    case 'buy':{
      const p=G.market.find(x=>x.id===+d.id);if(!p)break;
      const cost=valueOf(p);
      if(G.cash<cost||u.players.length>=14)break;
      G.cash-=cost;p.hp=maxHP(p);p.wage=wageOf(p);(p.hist=p.hist||[]).push({k:'sign',s:G.season,c:u.name,price:cost});u.players.push(p);G.market=G.market.filter(x=>x!==p);
      news(L(`Recrue : ${p.name} (${posCode(p)}, ${ovr(p)}) pour ${fmt(cost)} gils.`,`Signing: ${p.name} (${posCode(p)}, ${ovr(p)}) for ${fmt(cost)} gil.`),'marche');save();render();toast(L(`${p.name} rejoint le club.`,`${p.name} joins the club.`));break;}

    case 'tname':{const v=el.value.trim();if(v)u.name=v.slice(0,28);save();render();break;}
    case 'tshort':{const v=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(v.length>=2)u.short=v;save();render();break;}

    case 'ccol':{if(/^#[0-9a-fA-F]{6}$/.test(el.value)){setCrest(u,el.dataset.k,'c',el.value);save();render();}break;}

});

loadPrefs();
